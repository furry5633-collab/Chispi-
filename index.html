    get actual() { return actual; },
    get pidiendoNombre() { return pidiendoNombre; },
    nombres: () => lista.map((p) => p.nombre),
    tocar(trato) { if (actual) { actual.trato = clamp((actual.trato || 0) + trato, -5, 5); actual.ultimaVez = now(); guardar(actual); } }
  };
})();

/* ==================================== 15. SALUDO (uno solo cada cierto tiempo, variado) ==================================== */
const Saludo = (() => {
  const saludosConocido = ['¡hola {n}!', '¡{n}! ¡qué alegría!', '¡hola hola, {n}!', '¡{n}, te estaba esperando!', '¡ey, {n}!'];
  const saludosPresencia = ['¡hola!', '¡aaah, hola!', '¡te veo!', '¡hola hola!', '¡hola, humano!'];
  const saludosVuelta = ['¡has vuelto!', '¡ya estás aquí!', '¡volviste!', '¡qué bien, has vuelto!'];
  let ultimo = 0, ultimoLargo = 0;
  async function saludar(motivo, persona) {
    if (now() - ultimo < 12000) return;
    if (Estado.modo === 'durmiendo') return;
    ultimo = now();
    let texto, espect = 'saludo';
    if (persona) texto = pick(saludosConocido).replace('{n}', persona.nombre);
    else if (motivo === 'vuelta') texto = pick(saludosVuelta);
    else texto = pick(saludosPresencia);
    /* cada saludo es distinto: el sistema procedural elige la variante */
    const spec = Anim.gestoAhora('saludo', {});
    Estado.novedad = now() + 2000;
    Estado.ultimoSaludo = now();
    Burbujas.decir(texto, { dur: 2.6 });
    Audio2.saludo(); Haptica.alegria();
    if (chance(.6)) Voz.hablar(texto);
    /* saludo con la voz: además mueve la mirada y se inclina hacia ti */
    Reflejos.mirar(0, -.1, 2200);
    FX.G.estrellas(Dibujo.centro().x + rnd(-40, 40), Dibujo.centro().y - Dibujo.u * 1.1, Math.round(6 * (spec ? spec.intensidad : .6)), PALETA.feliz.acc);
    return true;
  }
  return { saludar, get ultimo() { return ultimo; } };
})();

/* ==================================== 16. PERCEPCIÓN (lo que ve, oye y siente) ==================================== */
const Percepcion = (() => {
  let sinVerDesde = 0, vistoAntes = false, ultimoSusto = 0, ultimoFlash, ultimoAvisoHora = 0, ultimaLuzAlta = 0;
  let movHist = [], quietoDesde = now(), orientHist = [], quietoTumbado = 0;
  function tick(t, dt) {
    const s = Estado, an = Camara.analisis;
    /* --- luz --- */
    if (an.t) {
      ultimoFlash = ultimoFlash == null ? an.media : ultimoFlash;
      const delta = an.media - ultimoFlash;
      ultimoFlash = lerp(ultimoFlash, an.media, .35);
      s.luz = lerp(s.luz, an.media, .4);
      s.luzOscura = an.media < .16;
      // oscuridad súbita => se asusta (solo si no duerme y hay alguien cerca)
      if (delta < -.34 && an.media < .3 && now() - ultimoSusto > 9000 && !s.durmiendo && s.presente) {
        ultimoSusto = now(); s.susto = now(); s.miedo = clamp(s.miedo + .5, 0, 1);
        Anim.gestoAhora('asustarse', {}); Audio2.miedo(); Haptica.fuerte();
        Burbujas.decir(pick(['¡ay!', '¡se ha ido la luz!', '¡uy!']), { dur: 2 });
      }
    }
    /* --- presencia --- */
    const hayPresencia = !!(an.blobs && an.blobs.length && an.blobs[0].area > CFG.ricon.minCara);
    if (hayPresencia) {
      if (!s.presente) {
        s.presente = true;
        const ausencia = now() - s.ultimaPresencia;
        s.ultimaPresencia = now();
        if (vistoAntes) {
          if (ausencia > 90000) Saludo.saludar('vuelta', null);
          else if (ausencia > 25000) { Anim.gestoAhora('curiosidad', { texto: null }); Burbujas.decir(pick(['¡ah, estás ahí!', '¡vuelves!']), { dur: 2.2 }); }
        } else { vistoAntes = true; s.novedad = now(); }
        if (s.durmiendo && s.sueno < .8) Emocion.dormir(false, 'te-he-visto');
      }
      s.ultimaPresencia = now(); sinVerDesde = 0;
      Personas.tick(t);
    } else {
      if (s.presente && !sinVerDesde) sinVerDesde = now();
      if (s.presente && now() - sinVerDesde > 12000) {
        s.presente = false; s.telequinesis = 0; Manos.limpiar();
        Personas.resetPresencia();
        if (!s.durmiendo && now() - s.ultimaPresencia > 15000) {
          Anim.gestoAhora('despedida', { texto: null });
          if (chance(.5)) Burbujas.decir(pick(['¿te vas?', '¡no te vayas!', 'te echo de menos...']), { dur: 2.6 });
        }
      }
    }
    /* --- si duerme y nota movimiento cerca, se despierta --- */
    if (s.durmiendo && an.t && an.movimiento > .16 && now() - (s.despertando || 0) > 8000) {
      s.despertando = now();
      Emocion.dormir(false, 'te-he-visto');
      Burbujas.decir(pick(['¿eh? ¿te levantas?', 'mmm... ¿ya?', 'uy, perdona']), { dur: 2.4 });
    }
    /* --- movimiento brusco => sobresalto --- */
    const mov = an.movimiento || 0;
    movHist.push(mov); if (movHist.length > 8) movHist.shift();
    const media = movHist.reduce((a, b) => a + b, 0) / (movHist.length || 1);
    if (mov > .3 && media < .09 && now() - ultimoSusto > 8000 && !s.durmiendo && s.presente) {
      ultimoSusto = now(); s.susto = now(); s.miedo = clamp(s.miedo + .35, 0, 1);
      Anim.gestoAhora('asustarse', {});
      Dibujo.Movimiento.empujar(rnd(-60, 60), rnd(-40, 0));
    }
    /* --- quietud / tumbado / sueño --- */
    if (!Camara.activo) { quietoDesde = t; s.quietoT = 0; quietoTumbado = 0; }
    else if ((an.movimiento || 0) > .05 || (an.piel || 0) > .25 && Math.random() < .02) { quietoDesde = t; quietoTumbado = 0; }
    s.quietoT = (t - quietoDesde) / 1000;
    s.tumbado = Estado.flatPhone && s.quietoT > 45 && s.luz < .35;
    if (!s.durmiendo && s.sueno > .68 && s.quietoT > 240 && !s.presente && (s.luz < .3 || contextoHora().noche)) Emocion.dormir(true, 'solo');
    /* --- hora del día --- */
    if (t - ultimoAvisoHora > 600000) {
      ultimoAvisoHora = t;
      const H = contextoHora();
      if (!s.durmiendo && !s.actividad) {
        if (H.h === 7 || H.h === 8) { if (chance(.5)) { Burbujas.decir('buenos días...', { dur: 2.6 }); Anim.gestoAhora('bostezo', {}); } }
        else if (H.h === 23 || (H.h >= 0 && H.h < 3)) { if (chance(.5)) { Burbujas.decir(pick(['qué tarde...', '¡a dormir!', 'hora de soñar']), { dur: 2.8 }); Anim.gestoAhora('bostezo', {}); } }
      }
    }
  }
  function reset() { vistoAntes = false; sinVerDesde = 0; }
  return { tick, reset, get visto() { return vistoAntes; } };
})();

/* ==================================== 17. ACTIVIDADES Y GUSTOS ==================================== */
const Actividades = (() => {
  const DEF = {
    comer:     { item: ['hamburguesa', 'pizza', 'manzana', 'helado', 'sushi', 'pastel', 'brócoli', 'sardina', 'tarta'], dur: 14, cadencia: .62, cat: 'comer', nombre: 'comiendo', comida: true },
    beber:     { item: ['taza', 'biberon'], dur: 10, cadencia: .9, cat: 'beber', nombre: 'bebiendo' },
    ver:       { item: ['tele', 'palomitas'], dur: 34, cadencia: 5.2, cat: 'ver', nombre: 'viendo la tele' },
    jugar:     { item: ['mando', 'pelota', 'cohete'], dur: 26, cadencia: 1.6, cat: 'jugar', nombre: 'jugando' },
    leer:      { item: ['libro', 'gafas'], dur: 30, cadencia: 4.5, cat: 'leer', nombre: 'leyendo' },
    ejercicio: { item: ['pesa', 'pelota'], dur: 18, cadencia: 1.1, cat: 'ejercicio', nombre: 'haciendo ejercicio' },
    bailar:    { item: ['cascos', 'guitarra', 'ninguno'], dur: 16, cadencia: 1.2, cat: 'baile', nombre: 'bailando' },
    cancion:   { item: ['guitarra', 'cascos'], dur: 20, cadencia: 2.4, cat: 'baile', nombre: 'cantando' },
    pensar:    { item: ['gafas', 'libro', 'ninguno'], dur: 12, cadencia: 3.5, cat: 'pensar', nombre: 'pensando' },
    descansar: { item: ['ninguno', 'taza'], dur: 26, cadencia: 6, cat: 'normal', nombre: 'descansando' }
  };
  let ultimaCadencia = 0, itemActual = null;
  /* Gustos propios: se generan una vez y se guardan */
  const gustos = (() => {
    let g = LS.get('gustos', null);
    if (!g) {
      g = { encantan: shuffle(['pizza', 'helado', 'sushi', 'tarta', 'pastel', 'manzana', 'hamburguesa']).slice(0, 3), asco: shuffle(['sardina', 'brócoli', 'sushi', 'brócoli']).slice(0, 2) };
      LS.set('gustos', g);
    }
    return g;
  })();
  function elegirItem(nombre) {
    const d = DEF[nombre]; if (!d) return null;
    let opciones = d.item.slice();
    if (d.comida) {
      opciones = opciones.filter((i) => !gustos.asco.includes(i));      // nunca elige lo que le da asco
      if (chance(.7)) opciones = gustos.encantan.filter((i) => d.item.includes(i)).concat(opciones);
    }
    return pick(opciones.length ? opciones : d.item);
  }
  function gradoGusto(nombre, item) {
    if (!DEF[nombre] || !DEF[nombre].comida) return 1;
    if (gustos.encantan.includes(item)) return 1.6;
    if (gustos.asco.includes(item)) return -1;
    return .8;
  }
  function empezar(nombre, opts) {
    opts = opts || {};
    const s = Estado;
    if (!DEF[nombre]) return false;
    if (s.durmiendo) Emocion.dormir(false, 'actividad');
    if (s.actividad === nombre && !s.actividadPausada) { s.actividadDur = Math.max(s.actividadDur, DEF[nombre].dur * .6); return true; }
    const item = opts.item || elegirItem(nombre);
    s.actividad = nombre; s.actividadItem = item; s.actividadDur = opts.dur || DEF[nombre].dur;
    s.actividadGusto = gradoGusto(nombre, item);
    s.actividadPausada = false;
    s.actividadAuto = !!opts.auto;
    animar(nombre, item, true);
    if (nombre === 'comer') { s.ultimaComida = now(); s.saciedad = clamp(s.saciedad + .6, 0, 1); }
    if (nombre === 'beber') s.ultimaBebida = now();
    if (nombre === 'jugar') s.ultimoJuego = now();
    s.aburrimiento = 0;
    Memoria.apuntar('hice algo', { actividad: nombre });
    if (!opts.silencioso) Burbujas.decir(opts.texto || pick(['¡vamos allá!', '¡me apunto!', '¡mmm, qué rico!', '¡a jugar!', 'me pongo']), { dur: 2.2 });
    return true;
  }
  function animar(nombre, item, primera) {
    const d = DEF[nombre];
    if (d.comida && gradoGusto(nombre, item) < 0 && primera) {
      // le da asco
      Anim.gestoAhora('asco' in ESPEC.CAT ? 'triste' : 'triste', { texto: null });
      Burbujas.decir(pick(['¡puaj!', 'eso no me gusta', '¡qué asco!']), { dur: 2.4 });
      Audio2.asco(); Haptica.doble();
      Estado.felicidad = clamp(Estado.felicidad - .12, 0, 1);
      return;
    }
    if (d.comida && gradoGusto(nombre, item) > 1.2 && primera) {
      Burbujas.decir(pick(['¡mi favorito!', '¡mmmm!', '¡siii!']), { dur: 2.2 });
      Audio2.gorgorito(); Haptica.alegria();
    }
    if (primera) { Audio2.zoom(); }
    Anim.gestoAhora(d.cat, { texto: null });
    if (nombre === 'ver' && chance(.3)) Burbujas.decir(pick(['¿qué vemos?', 'shhh, que empieza', '¡qué capítulo!']), { dur: 2.4 });
    if (nombre === 'jugar' && chance(.3)) Burbujas.decir(pick(['¡te gano!', '¡otra ronda!', '¡vamos!']), { dur: 2.2 });
  }
  function terminar(motivo) {
    const s = Estado;
    if (!s.actividad) return;
    const eraComida = DEF[s.actividad] && DEF[s.actividad].comida;
    s.actividad = null; s.actividadItem = null; s.actividadPausada = false;
    Anim.limpiarGestos();
    if (motivo === 'tu-orden') {
      Anim.gestoAhora(eraComida ? 'triste' : 'despedida', { texto: null });
      Burbujas.decir(eraComida ? pick(['...vale, paro', 'bueno... si tú lo dices']) : pick(['vale, lo dejo', '¡ya paro!']), { dur: 2.2 });
      Audio2.triste();
      s.felicidad = clamp(s.felicidad - (eraComida ? .2 : .06), 0, 1);
    } else if (motivo === 'tiempo') {
      Anim.gestoAhora(chance(.5) ? 'bostezo' : 'normal', { texto: null });
    }
    Memoria.apuntar('dejé de hacer algo', { actividad: motivo });
  }
  /* Cuidado: al pedir que deje de comer se pone triste; al decirle que puede comer, feliz. */
  function permitir(nombre) {
    Estado.felicidad = clamp(Estado.felicidad + .3, 0, 1);
    Estado.energia = clamp(Estado.energia + .1, 0, 1);
    Estado.orgullo = now();
    Anim.gestoAhora('felicidad', { texto: null });
    Burbujas.decir(pick(['¡¡bien!!', '¡siii, gracias!', '¡qué felicidad!']), { dur: 2.4 });
    Audio2.chillido(); Haptica.alegria();
    FX.G.corazones(Dibujo.centro().x, Dibujo.centro().y, 10, PALETA.amor.acc);
    if (nombre) setTimeout(() => empezar(nombre, { texto: '¡voy a por ello!' }), 900);
  }
  function tick(t) {
    const s = Estado;
    if (!s.actividad || s.actividadPausada) return;
    const d = DEF[s.actividad];
    if (!ultimaCadencia) ultimaCadencia = t;
    if (t - ultimaCadencia > d.cadencia * 1000) {
      ultimaCadencia = t;
      animar(s.actividad, s.actividadItem, false);
      if (d.comida && chance(.5)) FX.G.chispitas(Dibujo.centro().x + rnd(-20, 20), Dibujo.centro().y + Dibujo.u * 1.2, 2, PALETA.feliz.acc);
    }
    if (s.actividad === 'ver' && chance(.002)) FX.G.estrellas(Dibujo.centro().x + rnd(-60, 60), Dibujo.centro().y - Dibujo.u, 1, PALETA.sorpresa.acc);
    if (s.actividad === 'ejercicio' && chance(.004)) Dibujo.Movimiento.empujar(rnd(-30, 30), -40);
  }
  return {
    DEF, empezar, terminar, permitir, tick, gustos,
    get nombre() { return Estado.actividad ? DEF[Estado.actividad].nombre : null; },
    estaHaciendo: (n) => Estado.actividad === n,
    /* si ve la actividad en dos fotogramas seguidos, la imita; si deja de verla, la termina */
    detectar(actividad) {
      const s = Estado;
      s.actividadVisto = (s.actividadVisto || 0) + 1;
      if (s.actividad === actividad) { s.actividadDur = Math.max(s.actividadDur, DEF[actividad].dur * .5); return; }
      if (s.actividadVisto >= 2) empezar(actividad, { texto: pick(['¡yo también!', 'te copio', '¡me uno!']) });
      setTimeout(() => { s.actividadVisto = 0; }, 2400);
    },
    /* si no se ve en el siguiente fotograma, termina con su animación de salida */
    perdida() {
      if (Estado.actividad && !Estado.actividadPausada) terminar('visto');
    }
  };
})();

/* ==================================== 17b. TE VEO HACER ALGO (heurística baratita) ==================================== */
/* Con 1 fps y un blob no se puede saber si comes o bailas, pero sí ver si hay
   vaivén pequeño cerca de la cabeza, movimiento amplio del cuerpo o quietud.
   Si la pauta se repite en dos fotogramas seguidos la imita; si desaparece, lo deja. */
const VisionActividad = (() => {
  let hist = [], candidato = null, contador = 0, ultimoCambio = 0, sinVer = 0;
  function tick(t) {
    const s = Estado, an = Camara.analisis;
    if (s.durmiendo) { hist.length = 0; return; }
    if (!s.presente || !an.centro || an.media < .13) {
      hist.length = 0; candidato = null; contador = 0;
      /* si lo había imitado y ya no te ve, termina con su animación de salida */
      if (s.actividad && s.actividadAuto) { sinVer++; if (sinVer >= 4) { sinVer = 0; Actividades.terminar('visto'); } }
      return;
    }
    sinVer = 0;
    if (s.actividad && !s.actividadAuto) return;          // lo que le pediste tú manda
    hist.push({ t, y: an.centro.y, x: an.centro.x, m: an.movimiento || 0 });
    if (hist.length > 9) hist.shift();
    if (hist.length < 4) return;
    const ys = hist.map((h) => h.y);
    const rangoY = Math.max.apply(null, ys) - Math.min.apply(null, ys);
    const mov = hist.reduce((a, h) => a + h.m, 0) / hist.length;
    let act = null;
    if (rangoY > .17 && mov > .06) act = 'ejercicio';
    else if (rangoY > .045 && rangoY <= .17 && mov > .05) act = an.centro.y < .5 ? 'comer' : 'beber';
    else if (rangoY < .022 && mov < .03 && t - ultimoCambio > 8000) act = 'ver';
    if (!act) { candidato = null; contador = 0; return; }
    if (act !== candidato) { candidato = act; contador = 1; return; }
    contador++;
    if (contador < 2) return;                             // dos fotogramas seguidos: entonces sí
    contador = 0; ultimoCambio = t;
    if (s.actividad === act) { s.actividadDur = Math.max(s.actividadDur, 11); return; }
    if (s.actividad) return;
    Actividades.empezar(act, { auto: true, silencioso: chance(.5), texto: pick(['¡yo también!', 'te copio', '¡me apunto!']) });
    s.actividadAuto = true;
  }
  return { tick, limpiar() { hist.length = 0; candidato = null; } };
})();

/* ==================================== 18. FOTO INSTANTÁNEA (polaroid) ==================================== */
const Foto = (() => {
  let fase = 'quieto', pol = null, guardada = false, pidiendoGuardar = false;
  function esperar(ms) { return new Promise((res) => setTimeout(res, ms)); }
  async function tomar(opts) {
    if (fase !== 'quieto') return false;
    const s = Estado;
    if (s.durmiendo) Emocion.dormir(false, 'foto');
    fase = 'preparando';
    Anim.gestoAhora('foto', { texto: null });
    Audio2.zoom();
    Burbujas.decir(pick(['¡mira!', '¡una foto!', 'sonríe... o no']), { dur: 1.8 });
    await esperar(500);
    /* 1) cámara plana delante */
    Anim.gestoAhora('foto', { spec: ESPEC.generar('foto', { acc: 'camara', son: 'ninguno', mov: 'quieto', dur: 3.4 }) });
    await esperar(650);
    /* 2) flash + obturador */
    Dibujo.destello('#bff3ff', 320); Audio2.shot(); Haptica.disparo();
    const foto = capturar();
    /* 3) la cámara escupe la polaroid */
    pol = { x: Dibujo.W / 2, y: Dibujo.H * .62, rot: -.06, salto: 40, revelado: 0, foto, pie: NAME + ' · ' + fmtHora() };
    Dibujo.setPolaroid(pol);
    await esperar(280);
    Audio2.tono3(300, 700);
    /* 4) el robot la golpea con los ojos y la sacude */
    for (let i = 0; i < 4; i++) {
      Anim.pulso({ dy: 0, alto: .12 }, .28, 'out');
      Dibujo.Movimiento.empujar(rnd(-20, 20), 20);
      Haptica.suave();
      pol.salto += rnd(6, 14);
      await esperar(230);
    }
    fase = 'revelando';
    /* 5) se revela despacio */
    const t0 = now();
    await new Promise((res) => {
      const paso = () => {
        pol.revelado = clamp((now() - t0) / 4000, 0, 1);
        if (pol.revelado < 1) requestAnimationFrame(paso); else res();
      };
      paso();
    });
    if (!pol) return false;
    fase = 'preguntando';
    Burbujas.decir('¿la guardo?', { dur: 4 });
    Dialogo.decir('¿la guardo de recuerdo?', { tono: 'cariñoso' });
    await new Promise((res) => {
      pidiendoGuardar = true;
      mostrarHoja('¿guardo la foto?', 'sí / no / descargar', (v) => { resolverGuardar(v, res); }, [
        { txt: 'sí, guárdala', fn: () => resolverGuardar('sí', res) },
        { txt: 'no', fn: () => resolverGuardar('no', res) },
        { txt: 'descargar', fn: () => resolverGuardar('descargar', res) }
      ]);
      setTimeout(() => { Hoja.cerrar(); resolverGuardar(null, res); }, 14000);   // si no responde, sigue a lo suyo
    });
    return true;
  }
  function capturar() {
    const w = 480, h = 600;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#050a0d'; g.fillRect(0, 0, w, h);
    const v = Camara.video;
    if (v && v.videoWidth) {
      // recorte central con la proporción de la polaroid
      const vw = v.videoWidth, vh = v.videoHeight;
      const esc = Math.max(w / vw, h / vh);
      const dw = vw * esc, dh = vh * esc;
      g.save(); g.translate((w - dw) / 2, (h - dh) / 2); g.scale(-1, 1); g.drawImage(v, -dw, 0, dw, dh); g.restore();
      g.globalAlpha = .16; g.fillStyle = '#0a2230'; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
    } else {
      // sin cámara: dibujamos un autorretrato plano de Chispi
      g.fillStyle = PALETA.normal.ojo;
      for (const x of [w * .34, w * .66]) { g.beginPath(); g.arc(x, h * .45, 46, 0, TAU); g.fill(); }
      g.fillStyle = PALETA.normal.acc; g.font = '600 26px system-ui'; g.textAlign = 'center';
      g.fillText('(sin cámara)', w / 2, h * .78);
    }
    return c;
  }
  function resolverGuardar(v, res) {
    if (!pidiendoGuardar) return;                 // evita dobles respuestas
    pidiendoGuardar = false;
    const val = String(v || '').toLowerCase();
    const siono = val === 'sí' || val === 'si' || val === 's' || val === 'yes' || /guárd|guard/.test(val);
    const descargar = val === 'descargar' || /download|archivo/.test(val);
    const no = !siono && !descargar;
    if (!v) {
      Burbujas.decir('ya decidirás luego', { dur: 2.4 });
      const p = pol; pol = null;

/* ==================================== 19. BATERÍA ==================================== */

    el.classList.toggle('verylow', n <= .08 && !bat.charging);

  }
  async function init() {

      Estado.cargando = bat.charging;

      bat.addEventListener('levelchange', () => { Estado.bateria.nivel = bat.level; pintar(); revisar(); });
      bat.addEventListener('chargingchange', () => {

/* ==================================== 20. CLIMA Y LLUVIA ==================================== */
const Clima = (() => {
  let ultima = 0, pedido = false, permiso = null, micLluvia = 0;
  async function porUbicacion() {
    if (!navigator.geolocation) return false;
    return new Promise((res) => {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const { latitude: la, longitude: lo } = pos.coords;
          const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + la.toFixed(3) + '&longitude=' + lo.toFixed(3) + '&current=weather_code,is_day,precipitation,temperature_2m,wind_speed_10m&timezone=auto');
          const j = await r.json();
          const w = j && j.current; if (!w) { res(false); return; }
          aplicar(w.weather_code, w.precipitation, w.is_day, w.temperature_2m);
          res(true);
        } catch (e) { res(false); }
      }, () => { permiso = false; res(false); }, { maximumAge: 600000, timeout: 8000 });
    });
  }
  function aplicar(code, precip, isDay, temp) {
    let desc = 'despejado';
    if (code == null) return;
    if (code >= 95) desc = 'tormenta';
    else if (code >= 80) desc = 'chubascos';
    else if (code >= 61) desc = 'lluvia';
    else if (code >= 51) desc = 'llovizna';
    else if (code >= 45) desc = 'niebla';
    else if (code >= 1) desc = 'nubes';
    if (code >= 71 && code <= 77) desc = 'nieve';
    const llueve = /lluvia|chubascos|tormenta/.test(desc);
    const cambio = llueve !== Estado.llueve;
    Estado.llueve = llueve; Estado.climaDescrito = desc;
    Dibujo.lluvia(llueve, desc === 'tormenta' ? .95 : .6);
    Audio2.lluvia(llueve, desc === 'tormenta' ? .9 : .55);
    if (llueve && cambio && !Estado.durmiendo) {
      Anim.gestoAhora(pick(['asustarse', 'lluvia']), { texto: null });
      Burbujas.decir(desc === 'tormenta' ? pick(['¡ay, tormenta!', '¡uf, qué miedo!']) : pick(['está lloviendo...', 'me mojo...', '¿oigo lluvia?']), { dur: 3 });
      Audio2.susurro(); Haptica.suave();
      Memoria.apuntar('llovía', {});
      if (desc === 'tormenta' && chance(.5)) { Audio2.miedo(); Estado.miedo = clamp(Estado.miedo + .35, 0, 1); }
    }
    if (!llueve && cambio) Dibujo.lluvia(false, 0);
  }
  /* Lluvia por micrófono: ruido ancho y sostenido (heurística suave) */
  function porMicro(energiaAncha, planitud) {
    if (energiaAncha > .22 && planitud > .55) micLluvia = clamp(micLluvia + .25, 0, 1);
    else micLluvia = clamp(micLluvia - .1, 0, 1);
    if (micLluvia > .8 && !Estado.llueve && Estado.luz < .5) {
      Estado.llueve = true; Estado.climaDescrito = 'lluvia (la oigo)';
      Dibujo.lluvia(true, .6); Audio2.lluvia(true, .5);
      if (!Estado.durmiendo) { Anim.gestoAhora('lluvia', { texto: null }); Burbujas.decir('¿oigo lluvia?', { dur: 2.6 }); }
      micLluvia = .3;
    } else if (micLluvia < .1 && Estado.climaDescrito === 'lluvia (la oigo)') {
      Estado.llueve = false; Dibujo.lluvia(false, 0); Audio2.lluvia(false, 0);
    }
  }
  async function tick(t) {
    if (t - ultima < 15 * 60000) return;
    ultima = t;
    if (permiso === false) return;
    const ok = await porUbicacion();
    if (!ok) permiso = permiso === null ? false : permiso;
  }
  return { tick, aplicar, porMicro, get desc() { return Estado.climaDescrito; } };
})();

/* ==================================== 22. VOZ (escucha + habla) ==================================== */
const Voz = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null, quieroEscuchar = false, escuchando = false, reinicios = 0, ultimoArranque = 0;
  let pausaHasta = 0, hablando = false, voz = null, vozElegida = null;
  let micStream = null, analizador = null, micBuf = null, esperandoPermisoMic = false;
  let ultimaEnergia = 0, ultimoBlow = 0;
  const soportado = () => !!SR || !!window.webkitAudioContext;
  const reconocimientoSoportado = () => !!SR;

  function elegirVoz() {
    if (vozElegida) return vozElegida;
    try {
      const voces = speechSynthesis.getVoices() || [];
      const es = voces.filter((v) => /^es/i.test(v.lang));
      const preferidas = [/mónica|monica|helena|female|mujer|marisol|elvira|lucía|lucia/i];
      let v = es.find((x) => preferidas.some((r) => r.test(x.name))) || es.find((x) => /es-ES/i.test(x.lang)) || es[0];
      if (v) vozElegida = v;
    } catch (e) {}
    return vozElegida;
  }
  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => { vozElegida = null; elegirVoz(); };
    elegirVoz();
  }
  async function init() {
    if (rec) return true;
    if (!SR) return false;
    try {
      rec = new SR();
      rec.lang = LANG;
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.onstart = () => { escuchando = true; reinicios = 0; };
      rec.onerror = (e) => {
        escuchando = false;
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { quieroEscuchar = false; micPermiso = false; }
        if (e.error === 'no-speech' || e.error === 'aborted') reiniciar(700);
      };
      rec.onend = () => { escuchando = false; if (quieroEscuchar) reiniciar(400); };
      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          const texto = (r[0] && r[0].transcript || '').trim();
          if (!texto) continue;
          if (r.isFinal) Dialogo.oir(texto, true);
          else Dialogo.oir(texto, false);
        }
      };
      return true;
    } catch (e) { rec = null; return false; }
  }
  function reiniciar(ms) {
    if (!quieroEscuchar || pausado()) return;
    const t = now();
    if (t - ultimoArranque < 300) return;
    ultimoArranque = t;
    setTimeout(() => { if (quieroEscuchar && !escuchando && !pausado()) { try { rec.start(); } catch (e) {} } }, ms);
  }
  const pausado = () => now() < pausaHasta || hablando;
  function escuchar(on) {
    quieroEscuchar = !!on;
    if (!rec) { init().then((ok) => { if (ok && on) { try { rec.start(); } catch (e) {} } }); return; }
    if (on) { try { if (!escuchando) rec.start(); } catch (e) {} }
    else { try { rec.stop(); } catch (e) {} }
  }
  function pausar(ms) { pausaHasta = now() + (ms || 900); }
  let micPermiso = null;
  /* --- micrófono propio: soplar, lluvia y nivel de ruido --- */
  async function abrirMic() {
    if (micStream || esperandoPermisoMic || NO_CAM) return micStream;
    esperandoPermisoMic = true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ac = Audio2.ensure();
      if (ac) {
        const src = ac.createMediaStreamSource(micStream);
        analizador = ac.createAnalyser(); analizador.fftSize = 512; analizador.smoothingTimeConstant = .5;
        src.connect(analizador);
        micBuf = new Uint8Array(analizador.frequencyBinCount);
      }
      micPermiso = true;
    } catch (e) { micPermiso = false; micStream = null; }
    esperandoPermisoMic = false;
    return micStream;
  }
  function cerrarMic() { try { if (micStream) micStream.getTracks().forEach((t) => t.stop()); } catch (e) {} micStream = null; analizador = null; }
  function analizarMic() {
    if (!analizador || !micBuf) return;
    analizador.getByteFrequencyData(micBuf);
    const n = micBuf.length;
    let baja = 0, alta = 0, total = 0, log = 0;
    for (let i = 0; i < n; i++) {
      const v = micBuf[i] / 255;
      total += v;
      if (i < n * .18) baja += v;                  // graves (voz, ruido de fondo)
      else if (i > n * .45) alta += v;             // agudos (soplido, lluvia)
      log += v > 0 ? Math.log(v + .001) : Math.log(.001);
    }
    const energia = total / n;
    const planitud = Math.exp(log / n) / (energia + .0001);
    const soplido = alta / (baja + .05) > 2.1 && energia > .12 && energia > ultimaEnergia * 1.35;
    const previa = ultimaEnergia; ultimaEnergia = energia;
    if (soplido && now() - ultimoBlow > 3500 && energia < .55 && !Estado.durmiendo) {
      ultimoBlow = now();
      Anim.gestoAhora('sorpresa', { texto: null });
      Anim.pulso({ escala: .08, temblor: .25 }, .7, 'out');
      Burbujas.decir(pick(['¡me despeinas!', '¡fiuuu!', '¡qué viento!', '¡uy, sopla!']), { dur: 2.4 });
      Audio2.susurro(); Audio2.hipo(); Haptica.suave();
      Estado.susto = now(); Estado.novedad = now();
      FX.G.polvo(Dibujo.centro().x, Dibujo.centro().y, 8, PALETA.curioso.acc);
    }
    Clima.porMicro(energia, planitud);
    return { energia, planitud };
  }
  /* --- hablar: voz aguda y tierna + boca animada --- */
  let ttsToken = 0;
  function hablar(texto, tono, opts) {
    if (!texto) return;
    tono = tono || 'neutral';
    const cfg = {
      neutral:    { p: 1.55, r: 1.03, v: .95 },
      cariñoso:   { p: 1.62, r: .98,  v: .9 },
      jugueton:   { p: 1.75, r: 1.12, v: 1 },
      enfadado:   { p: 1.25, r: 1.12, v: 1 },
      triste:     { p: 1.35, r: .9,   v: .8 },
      emocionado: { p: 1.85, r: 1.16, v: 1 },
      susurro:    { p: 1.5,  r: .92,  v: .45 }
    }[tono] || { p: 1.55, r: 1.03, v: .95 };
    if (!('speechSynthesis' in window) || opts && opts.mudo) { parloteo(texto, tono); return; }
    try {
      const u = new SpeechSynthesisUtterance(String(texto).slice(0, 220));
      const v = elegirVoz(); if (v) u.voice = v;
      u.lang = LANG; u.pitch = clamp(cfg.p + rnd(-.05, .05), .1, 2); u.rate = clamp(cfg.r + rnd(-.03, .03), .5, 1.8);
      u.volume = cfg.v * (contextoHora().noche ? .7 : 1);
      u.onstart = () => { hablando = true; pausar(1200); parloteo(texto, tono); };
      u.onend = () => { hablando = false; pausar(400); };
      u.onerror = () => { hablando = false; };
      speechSynthesis.speak(u);
    } catch (e) { parloteo(texto, tono); }
  }
  /* Animación de boca mientras "habla" (sirve también si no hay TTS) */
  function parloteo(texto, tono) {
    const token = ++ttsToken;
    const silabas = Math.max(2, Math.round(String(texto).split(/\s+/).length * 2.2));
    let i = 0;
    const paso = () => {
      if (token !== ttsToken) return;
      const alto = tono === 'susurro' ? .18 : rnd(.25, .8);
      Anim.pulso({ bocaA: alto, boca: .1 }, rnd(.09, .16), 'out');
      if (chance(.25)) Audio2.gorgojo();
      i++;
      if (i < silabas && (hablando || !('speechSynthesis' in window))) setTimeout(paso, rnd(70, 130));
      else if (i < silabas && hablando) setTimeout(paso, 120);
    };
    paso();
  }
  return {
    init, escuchar, hablar, parloteo, pausar, analizarMic, abrirMic, cerrarMic, pausar,
    soportado, reconocimientoSoportado, elegirVoz,
    get escuchando() { return escuchando; }, get hablando() { return hablando; },
    get micPermiso() { return micPermiso; }, get quiereEscuchar() { return quieroEscuchar; }
  };
})();

/* ==================================== 23. IA (proxy del servidor + respaldo local) ==================================== */
const IA = (() => {
  let peticiones = 0, ultimaFallo = 0, servidorOk = null, enCurso = false;
  const LOCALES = {

    pregunta: ['mmm, buena pregunta', 'déjame pensar... no sé', '¡uf! ni idea, pero suena interesante'],
    insulto:  ['¡eh! eso no se dice', 'me has herido los sentimientos', 'no me hables así...'],
    carino:   ['¡ayyy! yo también te quiero', '¡me haces muy feliz!', '¡qué cosquillas en el corazón!'],
    neutro:   ['¡mmm!', 'cuéntame más', '¿y luego?', 'te escucho', '¡interesante!', 'ajá...']
  };
  const MALAS = /tonto|idiota|imb[eé]cil|est[uú]pido|feo|in[uú]til|odio|asco|callate|c[aá]llate|pendejo|gilipollas/i;
  const BUENAS = /te quiero|gracias|mono|adorable|bonito|guapo|buena|bien hecho|genial|perfecto|jaja|jeje/i;
  const TRISTES = /mal|triste|fatal|problema|duele|enfermo|no puedo|perdí|perdi|solo|sola/i;
  function clasificarTexto(t) {
    const x = String(t || '').toLowerCase();
    if (MALAS.test(x)) return 'insulto';
    if (BUENAS.test(x)) return 'carino';
    if (TRISTES.test(x)) return 'negativo';
    if (/[?¿]/.test(x)) return 'pregunta';
    if (/bien|genial|contento|feliz|logré|logre|aprobé|aprobe|gané|gane/.test(x)) return 'positivo';
    return 'neutro';
  }
  function local(texto) {
    const tipo = clasificarTexto(texto);
    const emoc = { positivo: 'feliz', negativo: 'triste', pregunta: 'curioso', insulto: 'enfadado', carino: 'amor', neutro: 'normal' }[tipo];
    const act = tipo === 'carino' ? 'brincar' : (tipo === 'insulto' ? 'parar' : 'ninguna');
    return { ok: true, local: true, text: pick(LOCALES[tipo]), emotion: emoc, action: act, duration: 5, intensity: .6, tone: tipo === 'insulto' ? 'enfadado' : (tipo === 'carino' ? 'cariñoso' : 'neutral') };
  }
  function contexto() {
    const s = Estado, H = contextoHora();
    return {
      who: s.nombreVisitante || 'alguien', people: Personas.nombres(), emotion: Emocion.actual,
      energy: +s.energia.toFixed(2), activity: Actividades.nombre || 'nada', hour: String(H.h),
      memory: Memoria.resumen(), likes: Actividades.gustos.encantan, hates: Actividades.gustos.asco,
      history: Memoria.conversacion.slice(-6).map((c) => (c.quien === 'yo' ? 'Chispi: ' : 'Tú: ') + c.texto)
    };
  }
  async function pedir(texto) {
    if (enCurso) return local(texto);
    enCurso = true;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 7000);
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: texto, context: contexto() }), signal: ctrl.signal
      });
      const j = await r.json();
      servidorOk = !!(j && j.ok);
      if (j && j.ok) { peticiones++; return j; }
      /* en modo dev te contamos por qué la IA no ha contestado (clave, cuota, red...) */
      if (DEV) DevTest.escribe('IA dice: ' + (j && j.error ? j.error : 'sin respuesta') + ' → uso respuestas locales');
      if (j && j.error === 'clave_no_valida') servidorOk = false;
      return local(texto);
    } catch (e) {
      servidorOk = false; ultimaFallo = now();
      return local(texto);
    } finally { clearTimeout(to); enCurso = false; }
  }
  return { pedir, local, clasificarTexto, contexto, get servidorOk() { return servidorOk; }, get peticiones() { return peticiones; } };
})();

/* ==================================== 24. COMANDOS LOCALES (sin IA: respuesta inmediata) ==================================== */
const Comandos = (() => {
  const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
  const hay = (x, arr) => arr.some((p) => x.includes(p));
  /* cada regla: {quien: función que devuelve true/false, hacer: acción, decir: variantes de respuesta} */
  const REGLAS = [

    { id: 'despertar', pat: ['despierta', 'levantate', 'despiertate', 'vamos despierta', 'abre los ojos'], decir: ['¡ya, ya!', 'uuuaaa...'] },
    { id: 'parar',   pat: ['para', 'parate', 'deja de', 'basta', 'stop', 'deja ya', 'corta'], decir: ['vale, vale', '¡ya paro!'] },
    { id: 'seguir',  pat: ['sigue', 'continua', 'puedes seguir', 'puedes comer', 'puedes jugar', 'permiso para', 'ya puedes'], decir: ['¡¡siii!!', '¡gracias!'] },
    { id: 'feliz',   pat: ['ponte contento', 'ponte feliz', 'alegrate', 'ponte alegre', 'sonrie'], decir: ['¡¡yupi!!', '¡qué contento estoy!'] },
    { id: 'enfadado', pat: ['ponte enfadado', 'enfadate', 'ponte furioso'], decir: ['¡grrrr!', '¡me has enfadado!'] },
    { id: 'triste',  pat: ['ponte triste', 'ponte triste chispi', 'entristecete'], decir: ['...bueno', 'buaaa'] },
    { id: 'querer',  pat: ['te quiero', 'te aprecio', 'eres mi robot favorito', 'te adoro'], decir: ['¡ayyy! yo también', '¡me haces feliz!'] },
    { id: 'gracias', pat: ['gracias', 'muchas gracias', 'gracias chispi'], decir: ['¡de nada!', '¡para eso estoy!'] },
    { id: 'quien',   pat: ['quien soy', 'como me llamo', 'me conoces', 'quienes son mi familia'], decir: null },
    { id: 'olvidar', pat: ['olvida a', 'olvidate de', 'borra a', 'quien es'], decir: null },
    { id: 'hora',    pat: ['que hora es', 'dime la hora', 'la hora'], decir: null },
    { id: 'clima',   pat: ['que tiempo hace', 'esta lloviendo', 'el tiempo', 'va a llover'], decir: null },
    { id: 'ayuda',   pat: ['que puedes hacer', 'que sabes hacer', 'ayuda', 'comandos'], decir: ['puedo comer, jugar, hacer fotos, bailar... ¡pídeme lo que quieras!'] },
    { id: 'interruptor', pat: ['apagate', 'duerme para siempre', 'haz como si no estuviera'], decir: ['me quedo quietecito'] },
    { id: 'ruido',   pat: ['shhh', 'silencio', 'calla', 'no hables'], decir: null }
  ];
  function detectar(texto) {
    const x = norm(texto);
    for (const r of REGLAS) if (hay(x, r.pat)) return { regla: r, texto: x };
    return null;
  }
  /* Ejecuta el comando local. Devuelve true si lo ha gestionado. */
  function ejecutar(texto, opts) {
    opts = opts || {};
    const d = detectar(texto);
    if (!d) return false;
    const r = d.regla, x = d.texto, s = Estado;
    const decir = (t) => { if (!opts.mudo) { Burbujas.decir(t, { dur: 2.4 }); Voz.hablar(t, opts.tono || 'neutral'); } };
    switch (r.id) {
      case 'foto': Foto.tomar(); decir(pick(['¡sonríe!', '¡clic!'])); return true;
      case 'album': Foto.album(); decir('mi álbum...'); return true;
      case 'saluda': Saludo.saludar('orden'); decir(pick(['¡hola!', '¡holaa!'])); return true;
      case 'comer': Actividades.empezar('comer', {}); decir(pick(['¡a comer!', '¡mmm, hamburguesa!'])); return true;
      case 'beber': Actividades.empezar('beber', {}); decir('¡glub glub!'); return true;
      case 'ver': Actividades.empezar('ver', {}); decir('¡palomitas y a ver!'); return true;
      case 'jugar': Actividades.empezar('jugar', {}); decir('¡a jugar!'); return true;
      case 'leer': Actividades.empezar('leer', {}); decir('me pongo a leer'); return true;
      case 'ejercicio': Actividades.empezar('ejercicio', {}); decir('¡uno, dos!'); return true;
      case 'bailar': Actividades.empezar('bailar', {}); decir('¡a bailar!'); return true;
      case 'cancion': Actividades.empezar('cancion', {}); decir('la la laaa'); return true;
      case 'pensar': Actividades.empezar('pensar', {}); decir('mmm...'); return true;
      case 'dormir': Emocion.dormir(true, 'orden'); decir('buenas noches...'); return true;
      case 'despertar': Emocion.dormir(false, 'orden'); decir('¡ya, ya!'); return true;
      case 'parar': {
        Memoria.apuntar('dejé de hacer algo', { actividad: 'orden' });
        const era = s.actividad;
        if (era) {
          const nombre = x.match(/para(r)?\s*(de\s+)?(comer|beber|jugar|bailar|leer|ver)/);
          Actividades.terminar('tu-orden');
          decir(nombre && /comer/.test(nombre[3]) ? pick(['...vale, paro de comer', 'bueno... si tú lo dices']) : 'vale, lo dejo');
        } else { Anim.gestoAhora('despedida', { texto: null }); decir('ya estaba parado, ¿eh?'); }
        return true;
      }
      case 'seguir': {
        const cual = /comer/.test(x) ? 'comer' : (/jugar/.test(x) ? 'jugar' : (/bailar/.test(x) ? 'bailar' : null));
        Actividades.permitir(cual); decir(pick(['¡¡siii!!', '¡gracias!'])); return true;
      }
      case 'feliz': Emocion.inyectar('feliz', 3000); s.felicidad = clamp(s.felicidad + .3, 0, 1); decir('¡¡yupi!!'); Audio2.feliz(); return true;
      case 'enfadado': Emocion.inyectar('enfadado', 4000); s.enfado = clamp(s.enfado + .6, 0, 1); Anim.gestoAhora('enfado', {}); decir('¡grrr!'); return true;
      case 'triste': Emocion.inyectar('triste', 4000); Anim.gestoAhora('triste', {}); decir('...bueno'); return true;
      case 'querer': s.carino = clamp(s.carino + .5, 0, 1); Anim.gestoAhora('amor', { texto: null }); Audio2.risita(); FX.G.corazones(Dibujo.centro().x, Dibujo.centro().y, 10, PALETA.amor.acc); decir(pick(['¡ayyy! yo también', '¡me haces feliz!'])); Haptica.alegria(); return true;
      case 'gracias': s.felicidad = clamp(s.felicidad + .15, 0, 1); Anim.gestoAhora('felicidad', { texto: null }); decir('¡de nada!'); return true;
      case 'quien': {
        const nombres = Personas.nombres();
        const yo = Personas.actual ? Personas.actual.nombre : (s.nombreVisitante || null);
        decir(yo ? 'creo que eres ' + yo : (nombres.length ? 'conozco a ' + nombres.join(', ') : 'aún no me sé tu nombre'));

      }
      case 'olvidar': {
        const m = x.match(/(olvida(r)?(te)?\s+(de\s+)?|borra\s+a\s+|quien es\s+)(.+)/);

        else decir('¿a quién quieres que olvide?');

        const saludoH = h < 6 ? 'son las ' + h + ' de la madrugada...' : (h < 14 ? 'son las ' + h + (m ? ' y ' + m : '') : 'son las ' + h + ' y ' + m);

      }

})();

/* ==================================== 25. DIÁLOGO (palabra de activación, conversación y tono) ==================================== */
const Dialogo = (() => {
  let activo = false, desde = 0, ultimaFrase = 0, esperandoRespuesta = false, ultimoInterim = 0;
  const VENTANA = 5000, GRACIA = 2000;
  function despertar(frase) {
    if (Estado.durmiendo) { Emocion.dormir(false, 'voz'); }
    activo = true; desde = now(); ultimaFrase = now();
    Audio2.saludo(); Haptica.doble();
    Anim.gestoAhora('curiosidad', { texto: null });
    const nombre = Personas.actual ? Personas.actual.nombre : null;
    const dicho = pick(['¿sí?', '¿dime?', '¿qué pasa?', 'cuéntame', 'aquí estoy', '¿me hablas?']);
    Burbujas.decir(dicho, { dur: 1.8 });
    Voz.hablar(nombre && chance(.5) ? '¿sí, ' + nombre + '?' : dicho, 'cariñoso');
    Reflejos.mirar(0, -.05, 1800);
    Estado.modo = 'conversando';
    return true;
  }
  function esPalabraActivacion(texto) {
    return wakeRe.some((r) => r.test(texto));
  }
  /* Cada fragmento reconocido pasa por aquí (interino y final) */
  function oir(texto, esFinal) {
    if (!texto) return;
    const x = texto.toLowerCase().trim();
    Estado.vozReciente = Date.now();
    if (!esFinal) return;
    /* si está esperando una respuesta concreta, la voz vale como respuesta */
    if (Foto.preguntando) {
      const si = ['sí', 'si', 'vale', 'claro', 'guarda', 'guárdala', 'guardala', 'ok', 'yes', 'sisi', 'sii', 'siiii'];
      const no = ['no', 'nope', 'paso', 'tírala', 'tirala', 'quítala', 'quit', 'bah'];
      const ini = (lista) => lista.some((k) => x === k || x.startsWith(k + ' ') || x.startsWith(k + ','));
      if (ini(si)) { Foto.resolverGuardar('sí'); return; }
      if (ini(no)) { Foto.resolverGuardar('no'); return; }
      if (x.indexOf('descarg') >= 0) { Foto.resolverGuardar('descargar'); return; }
    }
    if (Personas.pidiendoNombre) {
      const m = x.match(/(?:me llamo|soy|mi nombre es|ll[aá]mame)\s+(.+)/);
      const nombre = Personas.limpiarNombre(m ? m[1] : x);
      if (nombre) { Personas.registrar(nombre, null); return; }
    }
    if (!activo) {
      if (esPalabraActivacion(x)) { despertar(x); return; }
      if (esFinal && Comandos.detectar(x)) {
        /* comandos sin decir "hey": los entiende igual si son claros */
        ejecutarComando(x);
      }
      return;
    }
    ultimaFrase = now();
    let limpio = x;
    /* quitamos la palabra de activación si va delante */
    for (const r of wakeRe) limpio = limpio.replace(r, '').trim();
    if (!limpio) return;
    hablarCon(limpio);
  }
  function ejecutarComando(x) {
    const ok = Comandos.ejecutar(x, {});
    if (ok) { activo = true; desde = now(); ultimaFrase = now(); Memoria.turno('yo', x); return true; }
    return false;
  }
  async function hablarCon(texto) {
    Memoria.turno('tu', texto);
    Memoria.apuntar('me habló', { texto });
    Personas.tocar(0);
    /* tono con el que me habla: influye en la reacción */
    const tipo = IA.clasificarTexto(texto);
    const tono = { insulto: 'enfadado', carino: 'cariñoso', negativo: 'triste', positivo: 'emocionado', pregunta: 'neutral', neutro: 'neutral' }[tipo];
    if (tipo === 'insulto') { Estado.enfado = clamp(Estado.enfado + .5, 0, 1); Estado.memoriaTrato = -1; Emocion.inyectar('enfadado', 2500); }
    if (tipo === 'carino') { Estado.carino = clamp(Estado.carino + .4, 0, 1); Estado.memoriaTrato = 1; }
    /* comando local primero: respuesta inmediata y gratis */
    if (ejecutarComando(texto)) { if (chance(.5)) Reflejos.mirar(0, 0, 1500); return; }
    /* si no, IA */
    esperandoRespuesta = true;
    const t0 = now();
    const res = await IA.pedir(texto);
    esperandoRespuesta = false;
    if (!res) return;
    /* no deja lo que hace: atiende con los ojos y el gesto, pero sigue */
    const ocupado = !!Estado.actividad && !Estado.actividadPausada;
    aplicarRespuesta(res, { ocupado });
    /* reacción espejo al tono del usuario además de la emoción de la IA */
    if (tipo === 'negativo' && chance(.6)) { Estado.felicidad = clamp(Estado.felicidad - .06, 0, 1); }
    ultimaFrase = now();
  }
  function aplicarRespuesta(res, opts) {
    opts = opts || {};
    const s = Estado;
    Voz.hablar(res.text, res.tone || 'neutral');
    Burbujas.decir(res.text, { dur: Math.max(2.2, Math.min(5, res.text.length * .06 + 1.6)) });
    if (res.emotion) {
      Emocion.inyectar(res.emotion, Math.max(1500, (res.duration || 5) * 400));
      if (res.emotion === 'enfadado') s.enfado = clamp(s.enfado + .3, 0, 1);
      if (res.emotion === 'triste') s.felicidad = clamp(s.felicidad - .1, 0, 1);
      if (res.emotion === 'feliz' || res.emotion === 'amor') s.felicidad = clamp(s.felicidad + .12, 0, 1);
      if (res.emotion === 'miedo') s.miedo = clamp(s.miedo + .3, 0, 1);
    }
    /* acciones: si está ocupado y la acción no es fuerte, atiende sin dejar lo suyo */
    const accion = res.action;
    const fuertes = ['comer', 'beber', 'ver', 'jugar', 'leer', 'ejercicio', 'bailar', 'dormir', 'foto', 'cancion', 'brincar', 'cosquillas'];
    if (accion && accion !== 'ninguna') {
      if (accion === 'saludar') Saludo.saludar('orden');
      else if (accion === 'foto') { if (!opts.ocupado) Foto.tomar(); else { Burbujas.decir('ahora mismo no, que estoy liado', { dur: 2.4 }); } }
      else if (accion === 'dormir') Emocion.dormir(true, 'orden');
      else if (accion === 'despertar') Emocion.dormir(false, 'orden');
      else if (accion === 'parar') { Actividades.terminar('tu-orden'); }
      else if (accion === 'pensar') Anim.gestoAhora('pensar', { texto: null });
      else if (accion === 'cosquillas') Anim.gestoAhora('cosquillas', { texto: null });
      else if (fuertes.includes(accion) && !opts.ocupado) Actividades.empezar(accion, {});
      else if (fuertes.includes(accion) && opts.ocupado) { Anim.pulso({ entorna: .2 }, .6, 'out'); }
    } else if (opts.ocupado) {
      /* un gestito de atención mientras sigue con lo suyo */
      Anim.pulso({ cejaY: .25, entorna: .12 }, .7, 'out');
    }
  }
  /* Ventanas de escucha: 5 s sin hablar deja de escuchar; 2 s de gracia al activarse */
  function tick(t) {
    const s = Estado;
    if (s.durmiendo && activo) { activo = false; }
    if (!activo) { if (Estado.modo === 'conversando') Estado.modo = 'despierto'; return; }
    const sinHablar = now() - ultimaFrase;
    if (esperandoRespuesta) return;
    if (sinHablar > VENTANA) { activo = false; Estado.modo = s.durmiendo ? 'durmiendo' : 'despierto'; return; }
    if (sinHablar > GRACIA && sinHablar < VENTANA && now() - desde > GRACIA * 2.2 && chance(.0009 * (t / 1000) * 6)) {
      /* sigue atento, sin decir nada, con un gestito */
      Anim.pulso({ cejaY: .3 }, .5, 'out');
      if (chance(.2)) Burbujas.decir(pick(['...', 'te escucho', '¿y?']), { dur: 1.6 });
    }
  }
  return {
    oir, tick, hablarCon, aplicarRespuesta, esPalabraActivacion, despertar,
    get activo() { return activo; }, get escuchando() { return activo; },
    decir(texto, opts) { Voz.hablar(texto, (opts && opts.tono) || 'cariñoso'); Burbujas.decir(texto, {}); },
    mirarAlUsuario(ms) { Reflejos.mirar(0, -.05, ms || 2000); }
  };
})();

/* ==================================== 26. HOJA INFERIOR (texto y opciones) ==================================== */
const Hoja = (() => {
  const el = document.getElementById('sheet'), title = document.getElementById('sheetTitle'),
        input = document.getElementById('sheetInput'), enviar = document.getElementById('sheetSend'),
        opts = document.getElementById('sheetOpts');
  let abierta = false, cb = null;

/* ==================================== 28. WAKE LOCK Y ATENUACIÓN ==================================== */
const Wake = (() => {
  let lock = null, activo = false;
  async function pedir() {
    if (!('wakeLock' in navigator)) return false;
    try { lock = await navigator.wakeLock.request('screen'); activo = true; lock.addEventListener('release', () => { activo = false; }); return true; } catch (e) { return false; }
  }
  async function liberar() { try { if (lock) await lock.release(); } catch (e) {} lock = null; activo = false; }
  function despertarPantalla() { if (!activo) pedir(); }
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') { pedir(); App.volver(); }
    else { liberar(); App.ocultar(); }
  });
  return { pedir, liberar, despertarPantalla, get activo() { return activo; } };
})();

/* ==================================== 29. SUEÑOS (mini escenas planas dentro de una burbuja) ==================================== */
const Suenos = (() => {
  const TIPOS = ['pizza', 'cohete', 'gato', 'playa', 'estrella', 'tele', 'lluvia', 'tarta', 'baile', 'volar', 'pesca', 'helado', 'burbuja', 'amigos'];
  let activo = null, proximo = 0;
  function empezar() { proximo = now() + rnd(8000, 16000); }
  function tick(t) {
    if (!Estado.durmiendo) { activo = null; return; }
    if (!proximo) empezar();
    if (t > proximo) {
      activo = { tipo: pick(TIPOS), t: 0, dur: rnd(6, 11) };
      proximo = t + activo.dur * 1000 + rnd(6000, 14000);
      Audio2.snore();
    }
    if (activo) { activo.t += 1; if (activo.t > activo.dur * 1000) activo = null; }
  }
  function dibujar(t) {
    if (!activo) return;
    const ctx = Dibujo.ctx, W = Dibujo.W, H = Dibujo.H, u = Dibujo.ojoU;
    const w = Math.min(W * .66, u * 6.4), h = w * .62;
    const x = W / 2 - w / 2, y = H * .16;
    const c = PALETA.dormido.acc, c2 = PALETA.normal.acc;
    ctx.save();
    ctx.globalAlpha = clamp(Math.min(activo.t / 400, (activo.dur * 1000 - activo.t) / 600), 0, 1);
    ctx.fillStyle = '#000'; ctx.strokeStyle = c; ctx.lineWidth = 2;
    const rr2 = (X, Y, Ww, Hh, R) => { ctx.beginPath(); ctx.moveTo(X + R, Y); ctx.arcTo(X + Ww, Y, X + Ww, Y + Hh, R); ctx.arcTo(X + Ww, Y + Hh, X, Y + Hh, R); ctx.arcTo(X, Y + Hh, X, Y, R); ctx.arcTo(X, Y, X + Ww, Y, R); ctx.closePath(); };
    rr2(x, y, w, h, 18); ctx.fill(); ctx.stroke();
    ctx.clip();
    const per = t * 1.2;
    const gx = x + w / 2, gy = y + h / 2, s = u * .5;
    ctx.fillStyle = c2;
    switch (activo.tipo) {
      case 'pizza': Dibujo.silueta('triangulo', gx, gy, s * 1.1, c2); Dibujo.silueta('circulo', gx, gy + s * .2, s * .2, c); break;
      case 'cohete': Dibujo.silueta('triangulo', gx + Math.sin(per) * 20, gy - 8, s, c2); Dibujo.silueta('chispa', gx + Math.sin(per) * 20, gy + s * .8, s * .4, c); break;
      case 'gato': Dibujo.silueta('circulo', gx, gy, s, c2); Dibujo.silueta('triangulo', gx - s * .3, gy - s * .3, s * .4, c2); Dibujo.silueta('triangulo', gx + s * .3, gy - s * .3, s * .4, c2); break;
      case 'playa': for (let i = 0; i < 3; i++) Dibujo.silueta('arco', x + w * (i + 1) / 4, gy + s * .5, s * (1 - i * .2), c); Dibujo.silueta('circulo', gx, gy - s * .5, s * .6, c2); break;
      case 'estrella': for (let i = 0; i < 4; i++) Dibujo.silueta('estrella', x + w * (.2 + i * .2), gy + Math.sin(per + i) * 10, s * .5, i % 2 ? c : c2); break;
      case 'tele': Dibujo.silueta('rect', gx, gy, s * 2, c2); Dibujo.silueta('rect', gx, gy, s * 1.5, '#000'); break;
      case 'lluvia': for (let i = 0; i < 8; i++) Dibujo.silueta('gota', x + (i + 1) * w / 9, y + ((t * .06 + i * 40) % h), s * .3, c); Dibujo.silueta('arco', gx, gy + s, s * 2, c2); break;
      case 'tarta': Dibujo.comida('tarta', gx, gy, s * 1.2, t / 600); Dibujo.silueta('estrella', gx, gy - s * 1.1, s * .4, c2); break;
      case 'baile': Dibujo.silueta('nota', gx - s * .5, gy + Math.sin(per * 2) * 8, s * .7, c2); Dibujo.silueta('nota', gx + s * .6, gy + Math.cos(per * 2) * 8, s * .6, c); break;
      case 'volar': Dibujo.silueta('luna', gx + Math.sin(per * .6) * 40, gy - 10, s, c2); Dibujo.silueta('estrella', gx - 40, gy + 14, s * .4, c); break;
      case 'pesca': Dibujo.silueta('luna', gx, gy - s * .5, s * .8, c2); Dibujo.silueta('gota', gx, gy + s * .4, s * .5, c); break;
      case 'helado': Dibujo.comida('helado', gx, gy, s * 1.2, per); break;
      case 'burbuja': for (let i = 0; i < 5; i++) Dibujo.silueta('onda', gx + Math.sin(per + i * 2) * 30, gy + Math.cos(per + i) * 12, s * (.3 + i * .14), i % 2 ? c : c2); break;
      default: /* amigos */ for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(gx + (i - 1) * s * 1.1, gy, s * .28, 0, TAU); ctx.fill(); } break;
    }
    ctx.restore();
    /* zZz flotando */
    if (chance(.02)) FX.G.zzz(x + w - 20, y + 10, PALETA.dormido.acc);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  return { tick, dibujar, get activo() { return activo; }, empezar };
})();

/* ==================================== 30. DORMIR Y DESPERTAR ==================================== */
Emocion.dormir = function (on, motivo) {
  const s = Estado;
  if (on) {
    if (s.durmiendo) return;
    s.durmiendo = true; s.modo = 'durmiendo';
    s.actividad = null; s.actividadItem = null; s.telequinesis = 0;
    Anim.limpiarGestos();
    Anim.gestoAhora('dormir', { texto: null });
    Anim.setMovimiento('respirar', { intensidad: .25, vel: .6, lado: 1 });
    Dibujo.brillo = .32;                       // pantalla muy atenuada
    Audio2.setNocturno(true);
    Audio2.ronroneo(false);
    Camara.intervalo = CFG.capture.dormido;    // captura cada varios segundos
    Voz.escuchar(false);                       // nada de escucha continua al dormir
    Manos.rafaga(false); Manos.limpiar();
    Suenos.empezar();
    Hoja.cerrar();
    if (Foto.preguntando) Foto.resolverGuardar(null);
    FX.G.zzz(Dibujo.centro().x + 40, Dibujo.centro().y - 40, PALETA.dormido.acc);
    Burbujas.decir(pick(['zzz...', 'a dormir...', 'buenas noches...']), { dur: 3 });
    Audio2.dormir();
    Memoria.apuntar('me dormí', { motivo: motivo || '' });
    return;
  }
  if (!s.durmiendo) return;
  s.durmiendo = false;
  s.sueno = Math.min(s.sueno, motivo === 'toque' ? .25 : .35);
  Dibujo.brillo = 1;
  Audio2.setNocturno(false);
  Camara.intervalo = CFG.capture.normal;
  if (motivo !== 'orden' && !Estado.camaraApagada) Voz.escuchar(true);
  Anim.gestoAhora('despertar', { texto: null });
  Audio2.despertar();
  if (motivo === 'toque') {
    /* despertar de mal humor: se enfada y dispara */
    s.enfado = clamp(s.enfado + .8, 0, 1);
    Emocion.inyectar('enfadado', 3000);
    Burbujas.decir(pick(['¡¿quién me despierta?!', '¡me estabas despertando!', '¡grrr! ¡deja dormir!']), { dur: 2.6 });
    setTimeout(() => Entrada.enfadarYDisparar(null), 420);
    Memoria.apuntar('me despertó de malas', {});
  } else {
    s.felicidad = clamp(s.felicidad + .1, 0, 1);
    s.modo = 'despierto';
    Burbujas.decir(pick(['¡uuuaaa!', 'buenos días', '¿ya es de día?', '¡hola otra vez!']), { dur: 2.6 });
    Anim.pulso({ escala: .1 }, .8, 'out');
    Reflejos.mirar(0, 0, 2000);
  }
  Personas.resetPresencia();
  Suenos.tick(now());
};

/* ==================================== 31. PRUEBAS INTERNAS (solo con ?dev=1) ==================================== */
const DevTest = (() => {
  const bar = document.getElementById('devbar'), log = document.getElementById('devlog');
  let lineas = [];
  function escribe(txt) {
    lineas.unshift(typeof txt === 'string' ? txt : JSON.stringify(txt));
    lineas = lineas.slice(0, 7);
    log.textContent = lineas.join('\n');
  }
  /* --- simulador de 21 puntos de la mano (poses inequívocas) --- */
  const BASE = [
    [0, 1], [.1, .9], [.05, .8], [0, .72], [0, .65],
    [.25, .72], [.25, .55], [.25, .4], [.25, .28],
    [.5, .7], [.5, .5], [.5, .33], [.5, .2],
    [.72, .72], [.75, .55], [.75, .4], [.75, .3],
    [.9, .78], [.95, .65], [.95, .55], [.95, .45]
  ];
  const POSE = {
    abierta: {},
    /* puño: puntas hacia la muñeca y sin separación */
    puno: { 4: [.2, .84], 3: [.16, .78], 2: [.1, .86], 6: [.25, .55], 8: [.25, .6], 10: [.5, .52], 12: [.5, .58], 14: [.75, .55], 16: [.75, .6], 18: [.9, .62], 20: [.9, .66], 7: [.27, .66], 11: [.48, .68], 15: [.72, .66], 19: [.88, .72] },
    /* mano a medias: dos dedos extendidos y el resto doblados */
    media: { 12: [.5, .86], 16: [.72, .88], 20: [.9, .9], 11: [.5, .82], 15: [.74, .84], 19: [.92, .86] },
    paz: { 12: [.55, .25], 8: [.2, .25], 16: [.72, .88], 20: [.9, .9], 15: [.74, .84], 19: [.92, .86], 4: [.06, .74], 3: [.04, .86] },
    pulgar: { 4: [.3, .3], 8: [.3, .88], 12: [.44, .9], 16: [.58, .92], 20: [.7, .94], 7: [.27, .83], 11: [.45, .85], 15: [.6, .87], 19: [.74, .9] }
  };
  function manoSimulada(pose, cx, cy, esc) {
    const p = POSE[pose] || {};
    const out = [];
    for (let i = 0; i < 21; i++) {
      const b = p[i] || BASE[i];
      out.push({ x: cx + (b[0] - .5) * esc, y: cy + (b[1] - .5) * esc, z: 0 });
    }
    return out;
  }
  /* --- secuencias completas --- */
  const SECUENCIAS = {
    saludo:      { pose: 'abierta', paso: (k, n) => ({ cx: .5 + Math.sin(k * 1.15) * .2, cy: .55, esc: .8 }), dur: 16 },
    quieta:      { pose: 'abierta', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    alejandose:  { pose: 'abierta', paso: (k, n) => ({ cx: .5, cy: .55, esc: 1.0 - k / n * .35 }), dur: 10 },
    acercandose: { pose: 'abierta', paso: (k, n) => ({ cx: .5, cy: .55, esc: .6 + k / n * .45 }), dur: 10 },
    puno:        { pose: 'puno', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    medias:      { pose: 'media', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    paz:         { pose: 'paz', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    pulgar:      { pose: 'pulgar', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 }
  };
  function pruebaSecuencia(nombre) {
    const sec = SECUENCIAS[nombre];
    if (!sec) { escribe('secuencia desconocida: ' + nombre); return; }
    escribe('▶ probando "' + nombre + '" (' + sec.dur + ' fotogramas)...');
    Manos.rafaga(true);
    Camara.rafaga(sec.dur * 130);
    let k = 0;
    const id = setInterval(() => {
      const tr = sec.paso(k, sec.dur);
      const mano = Manos.analizar(manoSimulada(sec.pose, tr.cx, tr.cy, tr.esc));
      Manos.inyectar([mano]);
      Manos.clasificar();
      escribe('  ' + nombre + ' #' + k + ' → gesto: ' + Manos.gesto + (Manos.duda ? ' (duda)' : '') + ' | telequinesis ' + Estado.telequinesis.toFixed(2));
      k++;
      if (k >= sec.dur) { clearInterval(id); Manos.rafaga(false); Camara.rafaga(1); escribe('✓ fin de "' + nombre + '"'); }
    }, 130);
  }
  function pruebaTodas() {
    const nombres = Object.keys(SECUENCIAS);
    nombres.forEach((n, i) => setTimeout(() => pruebaSecuencia(n), i * 2600));
    escribe('Probando las ' + nombres.length + ' secuencias (≈' + (nombres.length * 2.6).toFixed(0) + ' s)');
  }
  /* --- variantes procedurales --- */
  function reporteVariantes() {
    const cats = Object.keys(ESPEC.CAT);
    let total = 0; const partes = [];
    for (const c of cats) { const n = ESPEC.contar(c); total += n; partes.push(c + ':' + n); }
    escribe('Categorías ' + cats.length + ' | suma de variantes ' + total.toLocaleString('es-ES') + ' (todas ≥1024: ' + cats.every((c) => ESPEC.contar(c) >= 1024) + ')');
    escribe('Combinaciones libres: ' + ESPEC.totalLibre.toLocaleString('es-ES') + ' | rueda base: ' + ESPEC.TOTAL.toLocaleString('es-ES'));
    escribe(partes.join('  '));
    return { cats, total, libre: ESPEC.totalLibre };
  }
  function probarCodigo(code) {
    const spec = ESPEC.generarLibre({ code: Number(code) || 1 });
    escribe('código ' + code + ' → ' + JSON.stringify({ ojos: spec.ojos, cara: spec.cara, cejas: spec.cejas, boca: spec.boca, acc: spec.acc, mov: spec.mov, son: spec.son, dur: spec.dur }));
    Anim.gestoAhora('normal', { spec: spec });
    Audio2.tono3(880, 1200);
  }
  function cicloEmociones() {
    const emos = ['normal', 'feliz', 'triste', 'enfadado', 'curioso', 'sorpresa', 'miedo', 'nervioso', 'amor', 'aburrido', 'picaro', 'mareado', 'orgulloso', 'dormido'];
    emos.forEach((e, i) => setTimeout(() => { Emocion.inyectar(e, 1400); escribe('emoción → ' + e); }, i * 1500));
  }
  function stats() {
    escribe('fps ' + App.fps + ' | capturas ' + App.capturas + ' | partículas ' + FX.cuenta + ' | gente ' + Personas.lista.length + ' | IA ' + (IA.servidorOk === null ? 'sin probar' : (IA.servidorOk ? 'ok' : 'local')) + ' | mic ' + Voz.micPermiso);
    escribe('memoria: ' + Memoria.resumen());
    escribe('cámara ' + (Camara.activo ? 'on' : 'off') + ' luz ' + Estado.luz.toFixed(2) + ' px piel ' + (Camara.analisis.piel * 100).toFixed(1) + '% | manos ' + (Manos.disponible ? 'listas' : 'no') + ' | TTS ' + Voz.reconocimientoSoportado());
  }
  function iniciar() {
    bar.classList.remove('hidden');
    const B = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.addEventListener('click', fn); bar.appendChild(b); };
    B('▶ todas las secuencias', pruebaTodas);
    Object.keys(SECUENCIAS).forEach((n) => B('· ' + n, () => pruebaSecuencia(n)));
    B('variantes', reporteVariantes);
    B('código…', () => Hoja.mostrar('código de variante (0–' + ESPEC.totalLibre + ')', 'p. ej. 123456', (v) => probarCodigo(v), []));
    B('emociones', cicloEmociones);
    B('foto', () => Foto.tomar());
    B('simular susto', () => { Estado.susto = now(); Estado.miedo = clamp(Estado.miedo + .6, 0, 1); Anim.gestoAhora('asustarse', {}); });
    B('simular dormir', () => Emocion.dormir(true, 'dev'));
    B('simular despertar', () => Emocion.dormir(false, 'dev'));
    B('simular batería crítica', () => { Estado.bateria = { nivel: .05, cargando: false }; Bateria.revisar(); });
    B('simular cargando', () => { Estado.bateria = { nivel: .3, cargando: true }; Bateria.revisar(); Audio2.pararAlarma(); });
    B('simular lluvia', () => Clima.aplicar(63, 2, 0, 14));
    B('simular lluvia: no', () => Clima.aplicar(0, 0, 1, 20));
    B('forget…', () => Hoja.mostrar('olvidar a alguien', 'nombre', (v) => Personas.olvidar(v), []));
    B('stats', stats);
    B('sonidos', () => { ['saludo', 'feliz', 'risita', 'ronroneo', 'bostezo', 'chomp', 'asco', 'triste', 'enfado', 'miedo', 'magia', 'disparo', 'alarma'].forEach((s, i) => setTimeout(() => Audio2[s] && Audio2[s](true), i * 700)); });
    B('limpiar todo', async () => { await DB.clear('people'); await DB.clear('photos'); Memoria.limpiar(); Personas.cargarLista(); escribe('datos borrados'); });
    setInterval(() => { if (DEV) stats(); }, 12000);
    /* manejador de depuración: solo existe en modo dev */
    window.__chispi = { Estado, Emocion, Anim, Reflejos, FX, Burbujas, Dibujo, ESPEC, Camara, Manos, Personas, Saludo, Percepcion, Actividades, Foto, Bateria, Clima, Memoria, Voz, IA, Comandos, Dialogo, Hoja, Entrada, Wake, Suenos, App, DevTest, PALETA, CFG };
    reporteVariantes();
    escribe('modo dev activo. Mejor con ?dev=1&nocam=1 en el escritorio.');
  }
  return { iniciar, pruebaSecuencia, pruebaTodas, reporteVariantes, probarCodigo, escribe, manoSimulada, SECUENCIAS };
})();

/* ==================================== 32. APP (arranque, bucle y ciclo de vida) ==================================== */
const App = (() => {
  let ultimoT = 0, acumulador = 0, fpsCont = 0, fpsT = 0, visible = true, iniciado = false;
  let capturas = 0, pedidoPermisos = false, primerGestoHecho = false, quiereCamara = false;
  let tMood = 0, tPerc = 0, tPers = 0, tBat = 0, tMic = 0, tDev = 0;
  let modoObjetivo = 'tranquilo';

  const hudMicro = document.getElementById('microHint');
  function esperar(ms) { return new Promise((r) => setTimeout(r, ms)); }

  /* --- pedir la cámara de forma natural: primero un gesto, y si no, se intenta igual --- */
  function pedirCamaraNatural() {
    if (pedidoPermisos) return;
    pedidoPermisos = true;
    Burbujas.decir('¿me dejas verte?', { dur: 5 });
    Anim.gestoAhora('curiosidad', { texto: null });
    Audio2.quien();
    Reflejos.mirar(0, -.05, 2400);
  }
  async function abrirCamara() {
    quiereCamara = true;
    const ok = await Camara.encender();
    if (ok) {
      Burbujas.decir(pick(['¡te veo!', '¡ahí estás!', '¡qué bien, ya te veo!']), { dur: 3 });
      Anim.gestoAhora('feliz', { texto: null });
      Audio2.feliz(); Haptica.alegria();
      Personas.resetPresencia();
      /* los modelos de manos se cargan cuando haga falta: en cuanto se detecte a alguien */
      Manos.pendiente = true;
    } else {
      // sin cámara: mecánicas visuales desactivadas, con elegancia
      Estado.camaraApagada = true;
      Burbujas.decir(pick(['no pasa nada, no te veo', 'sin cámaras, ¿eh? vale', 'me quedo sin ojos... pero te oigo']), { dur: 3.4 });
      Anim.gestoAhora('triste', { texto: null });
      Audio2.triste();
    }
    return ok;
  }
  async function permisosVoz() {
    const ok = await Voz.init();
    if (ok) { Voz.escuchar(true); Voz.abrirMic(); }
    else if (Voz.micPermiso !== false) { Voz.abrirMic(); }
  }
  function primerGesto() {
    if (primerGestoHecho) return;
    primerGestoHecho = true;
    Audio2.ensure();
    Entrada.pedirSensores();
    Wake.pedir();
    if (quiereCamara || !Estado.camaraApagada) { /* ya en marcha o denegado */ } else { }
    if (!Camara.activo && !Camara.denegado) abrirCamara();
    permisosVoz();
  }
  /* --- arranque --- */
  async function boot() {
    if (iniciado) return;
    iniciado = true;
    Dibujo.resize();
    /* estado inicial: ojos cerrados, respirando, casi a oscuras */
    Estado.durmiendo = true; Estado.sueno = .85; Estado.energia = .3; Estado.felicidad = .5;
    Estado.modo = 'durmiendo'; Estado.luz = .5;
    Dibujo.brillo = .28;
    Emocion.inyectar('dormido', 1200);
    Anim.setMovimiento('respirar', { intensidad: .22, vel: .55, lado: 1 });
    await Personas.cargarLista();
    Bateria.init();
    Entrada.init();
    document.addEventListener('pointerdown', primerGesto, { passive: true, once: false });
    await esperar(1500);
    /* se despierta solo: bostezo, parpadeo y mira alrededor */
    Emocion.dormir(false, 'inicio');
    Reflejos.parpadear();
    await esperar(1200);
    Reflejos.mirar(-.6, .1, 1600);
    await esperar(900);
    Reflejos.mirar(.6, -.1, 1600);
    await esperar(1400);
    Burbujas.decir('¡hola! soy ' + NAME, { dur: 3.4 });
    Voz.hablar('¡hola! soy ' + NAME, 'cariñoso');
    await esperar(2600);
    pedirCamaraNatural();
    /* si nadie toca la pantalla, intentamos la cámara igualmente (algunos navegadores lo permiten) */
    setTimeout(() => { if (!Camara.activo && !Camara.denegado) abrirCamara(); }, 7000);
    /* recordatorio suave si sigue sin permiso */
    setTimeout(() => { if (!Camara.activo && !Camara.denegado && !Estado.camaraApagada) pedirCamaraNatural(); }, 26000);
    if (DEV) DevTest.iniciar();
    ultimoT = now();
    requestAnimationFrame(loop);
  }
  /* --- bucle con fps adaptativo --- */
  function objetivoFps() {
    const s = Estado;
    if (!visible) return 1;
    if (s.durmiendo) return CFG.fps.dormido;
    if (Dialogo.activo || s.telequinesis > .05 || Entrada.caricias || Anim.gesto || Foto.polaroid || s.modo === 'emergencia') return CFG.fps.activo;
    return CFG.fps.tranquilo;
  }
  function loop(t) {
    requestAnimationFrame(loop);
    const dtMs = Math.min(80, t - ultimoT); ultimoT = t;
    if (dtMs <= 0) return;
    fpsCont++; if (t - fpsT > 1000) { fpsT = t; fpsCont = 0; }
    const fps = objetivoFps();
    const intervalo = 1000 / fps;
    acumulador += dtMs;
    if (acumulador < intervalo) return;
    const dt = Math.min(.4, acumulador / 1000);
    acumulador = 0;
    /* --- animación siempre fluida --- */
    Anim.tick(dt, t / 1000);
    Reflejos.tick(dt, t / 1000);
    FX.update(dt);
    Burbujas.update(dt);
    Dibujo.Movimiento.tick(dt);
    Actividades.tick(t);
    Suenos.tick(t);
    Dibujo.frame(dt, t / 1000);
    Suenos.dibujar(t / 1000);
    if (Foto.polaroid) Dibujo.setPolaroid(Foto.polaroid);
    /* --- cámara y visión (a su propio ritmo) --- */
    if (visible && Camara.activo) {
      if (t - tPerc > 1000) { tPerc = t; Camara.tick(t); capturas++; Percepcion.tick(t, dt); }
      if (t - tPers > CFG.ricon.cadaMs) { tPers = t; Personas.tick(t); }
      VisionActividad.tick(t);
      Manos.tick(t);
      /* ráfaga si hay una mano abierta clara */
      const abierta = (Manos.resultados || []).find((m) => m.gesto === 'abierta' && m.score > .62);
      if (abierta && !Estado.durmiendo) { Camara.rafaga(CFG.capture.rafagaMs); Manos.rafaga(true); setTimeout(() => Manos.rafaga(false), CFG.capture.rafagaMs); }
    }
    /* --- estado, voz y módulos lentos --- */
    if (t - tMood > 340) { tMood = t; actualizarMood(dt * 3); Emocion.tick(dt); Dialogo.tick(t); }
    if (t - tMic > 500 && Voz.escuchando) { tMic = t; Voz.analizarMic(); }
    if (t - tBat > 8000) { tBat = t; Bateria.revisar(); Audio2.setNocturno(contextoHora().noche && !Estado.durmiendo ? true : Estado.durmiendo); }
    if (visible && !Estado.durmiendo) Clima.tick(t);
    if (visible && Estado.presente && Manos.disponible === null && !Manos.cargando) Manos.cargar();   // modelos de visión: solo con alguien delante
    /* --- HUD --- */
    hudMicro.classList.toggle('on', !!Voz.escuchando && !Estado.durmiendo);
    if (DEV && t - tDev > 8000) { tDev = t; DevTest.escribe('fps ' + fpsCont + ' | modo ' + Emocion.actual + ' | capturas ' + capturas); }
  }
  /* --- ciclo de vida --- */
  function ocultar() {
    visible = false;
    Voz.escuchar(false);
    Audio2.ronroneo(false);
    Audio2.pararAlarma();
    Camara.apagar();
    Manos.limpiar();
  }
  function volver() {
    visible = true;
    if (quiereCamara && !Camara.denegado) Camara.encender();
    if (!Estado.durmiendo && !Estado.camaraApagada) Voz.escuchar(true);
    if (Estado.modo === 'emergencia') Bateria.revisar();
    Personas.resetPresencia();
  }
  return {
    boot, loop, ocultar, volver, pedirCamaraNatural, abrirCamara,
    get fps() { return fpsCont; }, get capturas() { return capturas; }
  };
})();

/* ==================================== 33. ARRANQUE Y SERVICE WORKER ==================================== */
(function arrancar() {
  /* evitar el zoom/rebote y el menú contextual en móvil */
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  /* guardar memoria al salir */
  window.addEventListener('pagehide', () => { LS.set('memoria', LS.get('memoria', [])); });
  /* en modo dev, cualquier fallo se ve en pantalla */
  window.addEventListener('error', (e) => { try { if (DEV) DevTest.escribe('⚠ ' + (e.message || 'error')); } catch (x) {} });
  window.addEventListener('unhandledrejection', (e) => {
    try { if (DEV) DevTest.escribe('⚠ promesa: ' + ((e.reason && (e.reason.message || e.reason)) || '?')); } catch (x) {}
  });
  /* registrar el service worker (offline) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
        if (DEV) DevTest.escribe('sw registrado: ' + (reg.active ? 'activo' : 'instalando'));
        reg.addEventListener('updatefound', () => {});
      }).catch(() => {});
      /* al volver a la pestaña, buscamos actualizaciones */
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
      });
    });
  }
  /* ¡vamos! */
  App.boot();
})();
