<style>
/* =====================================================================
   Chispi · PWA de robot compañero
   Estética OLED: negro puro, dos ojos planos, todo lo demás son siluetas.
   ===================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  position:fixed;inset:0;width:100%;height:100%;background:#000;color:#8ef2ff;overflow:hidden;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.8s ease;z-index:2}
/* pilulita del oído: se ve que te está escuchando, con las barritas de tu voz */
#oido{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;
  padding:7px 14px;border-radius:999px;background:rgba(6,14,20,.86);border:1px solid rgba(120,220,240,.5);
  color:#d9f6ff;font:600 12.5px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.2px;
  pointer-events:none;z-index:6;transition:opacity .25s ease,border-color .25s ease,transform .25s ease;max-width:74vw}
#oido.hidden{opacity:0;transform:translateX(-50%) scale(.9)}
#oido.llamada{border-color:#ffd76a;color:#fff3cf}
#oido.oyendo{border-color:#7ef0c0}
#oidoTexto{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#oidoBars{display:flex;align-items:flex-end;gap:2px;height:15px}
#oidoBars i{display:block;width:3px;height:15px;border-radius:2px;background:#8fe9ff;transform:scaleY(.2);transform-origin:bottom;
  transition:transform .07s linear}
#oido.llamada #oidoBars i{background:#ffd76a}
#oido.oyendo #oidoBars i{background:#7ef0c0}
.hidden{display:none !important}
.nodisp{opacity:0;pointer-events:none;transition:opacity .5s}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0 14px;pointer-events:none;z-index:3}
.hud .spacer{flex:1}
#battery{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.5px;color:#5f8d99;opacity:0;transition:opacity .8s}
#battery.on{opacity:1}
#battery.low{color:#ff9a8a}
#battery.verylow{color:#ff6b5e}
#battery.charging{color:#8ef2ff}
#battery svg{display:block}
#microHint{
  pointer-events:auto;background:#04121a;border:1px solid #123a46;color:#4e8898;border-radius:999px;
  min-width:30px;height:30px;font-size:13px;line-height:1;font-family:inherit;
}
#microHint.on{color:#8ef2ff;border-color:#26697c;box-shadow:0 0 10px -4px #2ba6c4}

/* ---------- Hoja inferior (nombre, opciones, texto) ---------- */
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:6;background:#04070a;border-top:1px solid #0f2d36;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px) 16px;
  transform:translateY(115%);transition:transform .38s cubic-bezier(.2,.9,.2,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.9);
}
#sheet.open{transform:translateY(0)}
#sheetTitle{font-size:14px;color:#bfeff8;letter-spacing:.4px;margin-bottom:10px;line-height:1.35}
#sheetRow{display:flex;gap:8px;align-items:center}
#sheetInput{
  flex:1;background:#01060a;border:1px solid #16414d;border-radius:12px;color:#dffbff;font-size:16px;
  padding:11px 12px;outline:none;font-family:inherit;min-width:0;
}
#sheetInput:focus{border-color:#2b8ea3}
.sbtn{background:#08222a;border:1px solid #1d6377;color:#c9f6ff;border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;font-weight:600;letter-spacing:.3px}
.sbtn:active{transform:scale(.96)}
#sheetOpts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* ---------- Aviso de depuración / pruebas ---------- */
#devbar{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#050d10;border-top:1px solid #123;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px) 10px;display:flex;flex-wrap:wrap;gap:6px;max-height:46%;overflow:auto}
#devbar button{background:#07202a;border:1px solid #1b5666;color:#a9ecfa;border-radius:9px;padding:7px 9px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
#devbar button:active{background:#0d3a47}
#devlog{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:9;font:10px/1.35 ui-monospace,Menlo,monospace;color:#4e7c88;max-width:60%;pointer-events:none;white-space:pre-wrap;text-shadow:0 0 4px #000}
</style>

<script>
/* =====================================================================================
   CHISPI · robot compañero virtual
   Un solo archivo: motor de ojos 2D, visión local (1 fps), voz, IA por proxy y memoria.
   Reglas de oro: nunca cortes bruscos (todo se interpola), duda => no hacer nada,
   y todo lo posible funciona sin internet.
   ===================================================================================== */
'use strict';

/* ==================================== 0. CONFIG ==================================== */
const NAME = 'Chispi';                     // <--- el nombre. La palabra de activación es "hey" + NAME
const CFG = {
  fps:        { activo: 1, tranquilo: 1, dormido: .25 },    // fracción de los Hz de la pantalla (1 = todos)
  fpsMin:     24,                                            // suelo de la tasa adaptativa
  capture:    { normal: 1000, dormido: 5000, rafaga: 110, rafagaMs: 1300, w: 160, h: 120 },
  ricon:      { cadaMs: 4000, faceCadaMs: 2200, manosCadaMs: 1000, umbral: 0.55, minCara: 0.055 },
  voz:        { wakeMs: 0, hablarMs: 5000, activoMs: 2000, tts: 1.02, pausaIA: 0, sesion: 20000 },
  vida:       { descanso: 4500, hopCada: 7000, miradaCada: 5200, parpadeoCada: 4200, bostezoCada: 24000 },
  memoriaMax: 120,
  version:    '1.0.0'
};
const DEV = new URLSearchParams(location.search).has('dev');
const NO_CAM = new URLSearchParams(location.search).has('nocam');   // para pruebas de escritorio
const FPS_PEDIDOS = Number(new URLSearchParams(location.search).get('fps')) || 0;   // ?fps=120 para forzarla
const LANG = 'es-ES';

/* Variantes de pronunciación aceptadas para la palabra de activación ("hey chispi") */
const WAKE_VARIANTS = [
  'hey chispi','hey chispi','hey chispi','jei chispi','ey chispi','hei chispi','hey chispy','hey chispi',
  'hey chisp','ey chisp','hey chipi','hey chisbi','hey chispi','hey crispi','hey chispis','hola chispi',
  'hey chispi por favor'
];
const wakeRe = (() => {
  const base = NAME.toLowerCase();
  const raices = ['chispi', 'chispy', 'chisp', 'chipi', 'chisbi', 'crispi', 'chipsi'];
  const hey = ['hey', 'hei', 'ey', 'he', 'hej', 'hola'];
  const r = [];
  for (const h of hey) for (const b of raices) r.push(new RegExp('\\b' + h + '\\s+' + b + '\\w*', 'i'));
  r.push(new RegExp('\\b' + base + '\\b', 'i'));   // solo el nombre también vale al despertar
  return r;
})();

/* Colores planos por emoción (paleta pequeña, sin degradados) */
const PALETA = {
  normal:   { ojo:'#8ef2ff', acc:'#7ee6ff', boca:'#8ef2ff', bochecha:'#1d4a58' },
  feliz:    { ojo:'#ffd166', acc:'#ffc24b', boca:'#ffd166', bochecha:'#5a3f10' },
  triste:   { ojo:'#6aa8ff', acc:'#7fb4ff', boca:'#6aa8ff', bochecha:'#16294d' },
  enfadado: { ojo:'#ff6b5e', acc:'#ff8a7a', boca:'#ff6b5e', bochecha:'#4b1c18' },
  curioso:  { ojo:'#b9f7ff', acc:'#a5f0ff', boca:'#b9f7ff', bochecha:'#1d4a58' },
  sorpresa: { ojo:'#ffffff', acc:'#ffd166', boca:'#ffffff', bochecha:'#333' },
  miedo:    { ojo:'#c9c2ff', acc:'#a9a0ff', boca:'#c9c2ff', bochecha:'#242147' },
  dormido:  { ojo:'#3f6d7a', acc:'#3f6d7a', boca:'#3f6d7a', bochecha:'#0e2229' },
  nervioso: { ojo:'#ffe08a', acc:'#ffe08a', boca:'#ffe08a', bochecha:'#4a3a11' },
  amor:     { ojo:'#ff9ecb', acc:'#ff8dc2', boca:'#ff9ecb', bochecha:'#54203c' },
  aburrido: { ojo:'#8ba9b0', acc:'#8ba9b0', boca:'#8ba9b0', bochecha:'#152e33' },
  picaro:   { ojo:'#9dffd0', acc:'#9dffd0', boca:'#9dffd0', bochecha:'#1d4a3a' },
  mareado:  { ojo:'#d3b8ff', acc:'#c2a4ff', boca:'#d3b8ff', bochecha:'#2b2148' },
  orgulloso:{ ojo:'#a4ffcf', acc:'#8ef2ff', boca:'#a4ffcf', bochecha:'#173f33' }
};

/* ==================================== 1. UTILIDADES ==================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const inv   = (v, a, b) => clamp((v - a) / (b - a || 1), 0, 1);
const rnd   = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi  = (a, b) => Math.floor(rnd(a, b + 1));
const chance= (p) => Math.random() < p;
const pick  = (arr) => arr[Math.floor(Math.random() * arr.length)];
const pickW = (pairs) => { let t = 0; for (const p of pairs) t += p[1]; let r = Math.random() * t; for (const p of pairs) { r -= p[1]; if (r <= 0) return p[0]; } return pairs[0][0]; };
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/* easing */
const easeIO   = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut  = (t) => 1 - Math.pow(1 - t, 3);
const easeIn   = (t) => t * t * t;
const easeOutBack = (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
const easeOutElastic = (t) => t === 0 || t === 1 ? t : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1;
const easeOutBounce = (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; };
const damp = (cur, target, half, dt) => cur + (target - cur) * (1 - Math.exp(-Math.LN2 / Math.max(.0001, half) * dt));
const norm180 = (d) => { while (d > 180) d -= 360; while (d < -180) d += 360; return d; };
const now = () => performance.now();
const fmtHora = () => new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const uid = () => 'id' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* PRNG determinista: para decodificar códigos de variante (?dev=1) */
function mulberry32(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ==================================== 2. AUDIO (Web Audio API, todo sintetizado) ==================================== */
/* Paleta kawaii: campanitas dulces, "boings", "nya", risitas y una reverb corta
   generada por código para que todo suene redondito. Nada de archivos. */
const Audio2 = (() => {
  let ac = null, master = null, conv = null, nocturno = false, vol = 0.6, silenciado = false;
  let rain = null, purr = null, alarm = null;

  function ensure() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain(); master.gain.value = vol;
    const comp = ac.createDynamicsCompressor ? ac.createDynamicsCompressor() : null;
    if (comp) { try { comp.threshold.value = -14; comp.ratio.value = 4; } catch (e) {} master.connect(comp); comp.connect(ac.destination); }
    else master.connect(ac.destination);
    /* reverb casera: ruido con decaimiento (0,45 s) -> todo suena más dulce */
    try {
      const len = Math.floor(ac.sampleRate * .45);
      const buf = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
      }
      conv = ac.createConvolver(); conv.buffer = buf;
      const envio = ac.createGain(); envio.gain.value = .3;
      conv.connect(envio); envio.connect(master);
    } catch (e) { conv = null; }
    return ac;
  }
  const V = () => (nocturno ? vol * .4 : vol);
  function ok() { if (silenciado) return null; return ensure(); }
  /* conecta un nodo a la salida (y a la reverb si se pide) */
  function salida(nodo, wet) {
    if (!master) return;
    nodo.connect(master);
    if (wet && conv && !nocturno) { const g = ac.createGain(); g.gain.value = wet; nodo.connect(g); g.connect(conv); }
  }
  function env(g, t0, a, d, pico) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, pico), t0 + Math.max(.008, a));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(.02, a + d));
  }
  /* ---------- bloques básicos ---------- */
  function pop() { osc(760, .07, 'sine', .13, 190); ruido(.03, 1800, 1.2, .04, 'bandpass', 0); }
  function osc(freq, dur, tipo, pico, curva, cuando, wet) {
    const a = ok(); if (!a) return;
    const t0 = a.currentTime + (cuando || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = tipo || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (curva) o.frequency.exponentialRampToValueAtTime(Math.max(30, curva), t0 + dur);
    env(g, t0, dur * .14, dur, (pico == null ? .13 : pico) * V());
    o.connect(g); salida(g, wet == null ? .22 : wet);
    o.start(t0); o.stop(t0 + dur + .08);
  }
  function ruido(dur, freq, q, pico, tipo, cuando, barrido) {
    const a = ok(); if (!a) return;
    const t0 = a.currentTime + (cuando || 0);
    const n = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = tipo || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.1;
    if (barrido) f.frequency.exponentialRampToValueAtTime(Math.max(60, barrido), t0 + dur);
    const g = a.createGain(); g.gain.value = (pico == null ? .09 : pico) * V();
    s.connect(f); f.connect(g); salida(g, .2); s.start(t0);
  }
  /* campanita: fundamental + parciales inarmónicos -> "¡din!" adorable */
  function campana(f, dur, pico, cuando, wet) {
    const a = ok(); if (!a) return;
    if (!isFinite(f) || f <= 0) f = pick(PENTA);
    const t0 = a.currentTime + (cuando || 0);
    const d = dur || .5;
    const g = a.createGain(); env(g, t0, .012, d, (pico == null ? .11 : pico) * V());
    salida(g, wet == null ? .35 : wet);
    for (const par of [[1, 1], [2.76, .32], [5.4, .1]]) {
      const o = a.createOscillator(), gg = a.createGain();
      o.type = 'sine'; o.frequency.value = f * par[0]; gg.gain.value = par[1];
      o.connect(gg); gg.connect(g); o.start(t0); o.stop(t0 + d + .1);
    }
  }
  /* "nya": voz minúscula y tierna (triángulo con vibrato + formante) */
  function nya(f, cuando, dur) {
    const a = ok(); if (!a) return;
    if (!isFinite(f) || f <= 0) f = rnd(600, 1000);
    const t0 = a.currentTime + (cuando || 0);
    const d = dur || .3;
    const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f * .8, t0);
    o.frequency.exponentialRampToValueAtTime(f * 1.25, t0 + d * .35);
    o.frequency.exponentialRampToValueAtTime(f * 1.05, t0 + d);
    lfo.frequency.value = 26; lg.gain.value = f * .05;
    lfo.connect(lg); lg.connect(o.frequency);
    const f1 = a.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 1100; f1.Q.value = 2.2;
    const f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 3400;
    env(g, t0, .02, d, .12 * V());
    o.connect(f1); f1.connect(f2); f2.connect(g); salida(g, .25);
    o.start(t0); lfo.start(t0); o.stop(t0 + d + .08); lfo.stop(t0 + d + .08);
  }
  function acorde(freqs, dur, pico) { freqs.forEach((f, i) => campana(f, dur || .6, pico || .085, i * .06, .4)); }
  const PENTA = [1046.5, 1174.7, 1318.5, 1568, 1760, 2093];   // do re mi sol la do: dulce y luminoso

  const api = {
    ensure,
    get listo() { return !!ac; },
    setNocturno(v) { nocturno = !!v; },
    setVolumen(v) { vol = clamp(v, 0, 1); if (master) master.gain.value = vol; },
    silenciar(v) { silenciado = !!v; if (master) master.gain.value = silenciado ? 0.00001 : vol; },

    /* --- saludos, risas y reacciones --- */
    saludo()   { campana(1318, .5, .1); campana(1568, .55, .09, .09); nya(880, .18, .22); },
    feliz()    { acorde([1046, 1318, 1568], .5, .08); },
    risita()   { for (let i = 0; i < 4; i++) { nya(rnd(900, 1250), i * .11, .09); ruido(.05, 2400, 1.6, .03, 'bandpass', i * .11); } },
    chillido() { nya(1500, 0, .18); nya(1900, .1, .12); campana(2637, .3, .05, .06); },
    mmm()      { nya(420, 0, .5); },
    bostezo()  { ruido(.6, 600, .8, .05, 'lowpass', 0, 260); osc(300, .55, 'sine', .06, 170); nya(380, .34, .3); },
    hipo()     { osc(200, .07, 'sine', .1, 420); },
    gorgojo()  { nya(rnd(700, 1000), 0, .07); },
    gorgorito(){ for (let i = 0; i < 3; i++) osc(rnd(180, 260), .08, 'sine', .07, rnd(120, 200), i * .07); },
    pop,
    boing()    { const a = ok(); if (!a) return; const t0 = a.currentTime;
                 const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
                 o.type = 'sine'; o.frequency.setValueAtTime(280, t0);
                 o.frequency.exponentialRampToValueAtTime(620, t0 + .08);
                 o.frequency.exponentialRampToValueAtTime(420, t0 + .3);
                 lfo.frequency.value = 17; lg.gain.value = 30; lfo.connect(lg); lg.connect(o.frequency);
                 env(g, t0, .008, .34, .12 * V()); o.connect(g); salida(g, .3);
                 o.start(t0); lfo.start(t0); o.stop(t0 + .42); lfo.stop(t0 + .42); },
    whoosh(arriba) { ruido(.3, arriba ? 400 : 1800, .9, .06, 'bandpass', 0, arriba ? 1900 : 320); },
    sparkle()  { campana(pick(PENTA), .4, .06); campana(pick(PENTA) * 1.5, .5, .05, .07); ruido(.2, 5200, 2, .025, 'highpass'); },
    shimmer(dur) { const d = dur || .5; for (let i = 0; i < 5; i++) campana(2093 * (1 + i * .06), d, .035, i * .05, .5); },

    /* --- comida y bebida --- */
    chomp()    { ruido(.07, 480, 1.4, .1, 'bandpass'); osc(150, .05, 'sine', .05, 90); },
    beber()    { const a = ok(); if (!a) return; const t0 = a.currentTime;
                 const o = a.createOscillator(), g = a.createGain();
                 o.type = 'sine'; o.frequency.setValueAtTime(280, t0); o.frequency.exponentialRampToValueAtTime(640, t0 + .12);
                 env(g, t0, .02, .18, .08 * V()); o.connect(g); salida(g, .25); o.start(t0); o.stop(t0 + .24);
                 ruido(.12, 900, 1.2, .04, 'bandpass', .1); },
    asco()     { nya(700, 0, .18); nya(520, .14, .26); ruido(.18, 300, 1.2, .05, 'lowpass'); },
    estrella() { campana(1568, .45, .08); campana(2093, .6, .07, .08); campana(2637, .7, .05, .16); },

    /* --- emociones --- */
    triste()   { campana(494, .5, .08); campana(440, .6, .07, .16); nya(520, .3, .4); },
    lloro()    { for (let i = 0; i < 3; i++) { nya(rnd(520, 640), i * .24, .16); ruido(.08, 1200, 2, .02, 'highpass', i * .24 + .06); } },
    enfado()   { const a = ok(); if (!a) return; const t0 = a.currentTime;
                 const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
                 o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t0); o.frequency.exponentialRampToValueAtTime(130, t0 + .34);
                 lfo.frequency.value = 14; lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency);
                 const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
                 env(g, t0, .02, .36, .1 * V()); o.connect(f); f.connect(g); salida(g, .2);
                 o.start(t0); lfo.start(t0); o.stop(t0 + .46); lfo.stop(t0 + .46); },
    gruñido()  { ruido(.34, 200, .8, .08, 'lowpass'); osc(120, .3, 'sawtooth', .06, 80); },
    miedo()    { nya(1300, 0, .12); nya(1700, .08, .1); nya(1100, .2, .22); },
    sorpresa() { campana(1046, .3, .09); campana(1760, .45, .07, .07); },
    curiosidad(){ campana(1174, .35, .07); campana(1568, .4, .06, .1); nya(900, .06, .12); },
    susurro()  { ruido(.45, 2600, .7, .03, 'bandpass'); },
    quien()    { nya(780, 0, .2); campana(1568, .4, .06, .14); },
    orgullo()  { acorde([1046, 1318, 1760, 2093], .55, .07); },

    /* --- acciones --- */
    disparo()  { ruido(.08, 1700, .8, .16, 'highpass'); osc(500, .1, 'square', .07, 120); },
    shot()     { ruido(.05, 3000, .9, .12, 'highpass'); pop(); },
    magia()    { for (let i = 0; i < 7; i++) campana(PENTA[i % PENTA.length] * (chance(.5) ? 1 : 2), .5, .05, i * .07, .55); ruido(.6, 3000, 1.4, .02, 'highpass', 0, 6000); },
    zoom()     { ruido(.22, 500, 1, .05, 'bandpass', 0, 2200); },
    alarma(leve) {
      const a = ok(); if (!a || alarm) return;
      let i = 0;
      const paso = () => {
        if (!alarm) return;
        campana(i % 2 ? 880 : 660, .4, .05, 0, .2);
        i++;
        alarm.id = setTimeout(paso, leve ? 900 : 620);
      };
      alarm = { id: 0 }; paso();
    },
    pararAlarma() { if (alarm) { clearTimeout(alarm.id); alarm = null; } },

    /* --- descanso --- */
    dormir()   { campana(523, .6, .07); campana(392, .7, .06, .18); nya(420, .5, .5); },
    snore()    { ruido(.8, 220, .8, .04, 'lowpass'); osc(150, .5, 'sine', .03, 110, .12); },
    despertar(){ acorde([784, 988, 1318], .45, .075); },
    ronroneo(on) {
      const a = ok(); if (!a) return;
      if (on && !purr) {
        const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
        const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
        o.type = 'sine'; o.frequency.value = 58; lfo.frequency.value = 23; lg.gain.value = 10;
        lfo.connect(lg); lg.connect(o.frequency);
        g.gain.value = .0001; o.connect(f); f.connect(g); salida(g, 0);
        g.gain.exponentialRampToValueAtTime(.05 * V(), a.currentTime + .35);
        o.start(); lfo.start(); purr = { o, g, lfo };
      } else if (!on && purr) {
        const p = purr; purr = null;
        try { p.g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .3); p.o.stop(a.currentTime + .34); p.lfo.stop(a.currentTime + .34); } catch (e) {}
      }
    },
    lluvia(on, intensidad) {
      const a = ok(); if (!a) return;
      if (on && !rain) {
        const n = Math.floor(a.sampleRate * 2.2);
        const buf = a.createBuffer(1, n, a.sampleRate); const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const s = a.createBufferSource(); s.buffer = buf; s.loop = true;
        const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
        const g = a.createGain(); g.gain.value = 0.0001;
        s.connect(f); f.connect(g); salida(g, 0); s.start();
        g.gain.exponentialRampToValueAtTime(.03 * V(), a.currentTime + .9);
        rain = { s, g, f };
      } else if (rain) {
        if (on) rain.g.gain.setTargetAtTime((0.018 + 0.04 * (intensidad || .5)) * V(), a.currentTime, .5);
        else { const p = rain; rain = null; try { p.g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .5); p.s.stop(a.currentTime + .6); } catch (e) {} }
      }
    },
    bajaBat()  { nya(600, 0, .2); nya(440, .22, .3); },
    cargando() { acorde([880, 1100, 1318, 1760], .5, .07); },

    /* --- varios --- */
    ensure,
    click()    { campana(2093, .12, .05, 0, .2); },
    tono3(a1, a2) { campana(a1 || 880, .3, .08); campana(a2 || 1320, .35, .06, .06); },
    acorde, nya, campana
  };
  return api;
})();

/* ==================================== 3. VIBRACIÓN ==================================== */
const Haptica = (() => {
  let ultimo = 0;
  function can() { return typeof navigator.vibrate === 'function'; }
  function go(pat) { const t = now(); if (t - ultimo < 90) return; ultimo = t; if (can()) { try { navigator.vibrate(pat); } catch (e) {} } }
  return {
    soporte: can(),
    suave:  () => go(12),
    caricias: () => go([8, 24, 8]),
    doble:  () => go([14, 40, 14]),
    fuerte: () => go(45),
    temblor: () => go([22, 30, 22, 30, 22]),
    disparo: () => go(28),
    alarma: () => go([40, 90, 40, 90, 40]),
    alegria: () => go([12, 30, 12, 30, 22])
  };
})();

/* ==================================== 4. ALMACENAMIENTO (IndexedDB + localStorage) ==================================== */
const DB = (() => {
  const NOMBRE = 'chispi-db', VER = 1;
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('sin-idb'));
      const rq = indexedDB.open(NOMBRE, VER);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('people')) db.createObjectStore('people', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }).catch(() => null);
    return dbp;
  }
  async function tx(store, mode) { const db = await open(); if (!db) return null; return db.transaction(store, mode).objectStore(store); }
  function req(r) { return new Promise((res, rej) => { if (!r) return res(null); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  return {
    async get(store, key) { try { const s = await tx(store, 'readonly'); return s ? await req(s.get(key)) : null; } catch (e) { return null; } },
    async set(store, val, key) { try { const s = await tx(store, 'readwrite'); if (!s) return false; await req(key === undefined ? s.put(val) : s.put(val, key)); return true; } catch (e) { return false; } },
    async del(store, key) { try { const s = await tx(store, 'readwrite'); if (!s) return false; await req(s.delete(key)); return true; } catch (e) { return false; } },
    async all(store) { try { const s = await tx(store, 'readonly'); return s ? (await req(s.getAll())) || [] : []; } catch (e) { return []; } },
    async clear(store) { try { const s = await tx(store, 'readwrite'); if (!s) return false; await req(s.clear()); return true; } catch (e) { return false; } }
  };
})();
/* Preferencias y memoria corta en localStorage (síncrono y siempre disponible) */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('chispi.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('chispi.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ==================================== 5. ESTADO Y MÁQUINA DE EMOCIONES ==================================== */
/* Valores 0..1 que suben y bajan solos con el tiempo, lo que ve y cómo le tratas. */
const Estado = {
  felicidad: .62, energia: .72, enfado: 0, miedo: 0, sueno: .12, aburrimiento: .1,
  confianza: .5, carino: .35, saciedad: .2, /* hambre baja = saciado */
  memoriaTrato: 0,        // >0 bien tratado, <0 mal tratado (se recuerda)
  interacciones: 0,
  durmiendo: false, dormirFase: 0, despertarMalHumor: false,
  actividad: null, actividadDur: 0, actividadGusto: 1, actividadVar: null, actividadPausada: false,
  presente: false, ultimaPresencia: now(), ultimaCaricia: 0, ultimoGesto: 0, ultimoSaludo: 0,
  ultimaComida: now(), ultimaBebida: now(), ultimoJuego: now(),
  luz: .5, luzOscura: false, movCamara: 0, tumbado: false, quietoT: 0, flatPhone: false,
  soplidoActivo: true,
  llueve: false, climaDescrito: '',
  bateria: null, cargando: false,
  gesto: 'ninguno', gestoDuda: false, telequinesis: 0,
  nombreVisitante: null, ultimaVisita: {},
  textos: [], // cola de burbujas
  hz: 60,                // tasa real de la pantalla (se mide al arrancar: 60, 90, 120...)
  modo: 'despierto'      // despierto | conversando | durmiendo | emergencia
};

/* Rellena el estado con la fecha/hora actual */
function contextoHora() {
  const h = new Date().getHours();
  return { h, noche: h >= 22 || h < 7, tarde: h >= 14 && h < 22, manana: h >= 7 && h < 12 };
}

/* Decaimiento natural y derivas: corazón del "vive solo" */
function actualizarMood(dt) {
  const H = contextoHora();
  const s = Estado;
  const dormido = s.durmiendo;

  // Felicidad: vuelve a un punto medio; de noche y con hambre baja algo.
  let baseF = .55 + (H.noche ? -.08 : .05) + (s.energia - .5) * .18 + s.carino * .1;
  if (s.actividad && !s.actividadPausada) baseF += .12 * s.actividadGusto;
  s.felicidad = damp(s.felicidad, clamp(baseF, 0, 1), dormido ? 40 : 22, dt);

  // Energía: baja con el tiempo despierto, sube al dormir; come cuando tiene hambre.
  if (dormido) s.energia = damp(s.energia, Math.min(1, s.energia + .09), 30, dt);
  else s.energia = damp(s.energia, clamp(.75 - s.sueno * .35 - (now() - s.ultimaComida) / 3.6e6 * .12, 0, 1), 90, dt);

  // Sueño: sube de noche, con poca luz, al tumbarse sin moverse y mucho rato sin nada.
  const tasaSueno = (H.noche ? .022 : .0045) + (s.luz < .18 ? .022 : 0) + (s.tumbado && s.quietoT > 60 ? .01 : 0);
  s.sueno = clamp(s.sueno + (dormido ? .04 : tasaSueno) * dt, 0, 1);

  // Aburrimiento: crece sin interacción ni actividad; desaparece al jugar o hablar.
  const aburInc = (s.actividad ? -.05 : .012) + (s.presente ? 0 : .008);
  s.aburrimiento = clamp(s.aburrimiento + aburInc * dt - (now() - s.interacciones < 1 ? 0 : 0), 0, 1);
  if (now() - s.ultimoGesto < 12000) s.aburrimiento = Math.max(0, s.aburrimiento - .02 * dt);

  // Enfado: se calma poco a poco (más rápido si le haces cariño).
  const calma = (now() - s.ultimaCaricia < 2500 ? .06 : .035) + (dormido ? .02 : 0);
  s.enfado = clamp(s.enfado - calma * dt, 0, 1);

  // Miedo: se disipa lentamente.
  s.miedo = clamp(s.miedo - .05 * dt, 0, 1);

  // Confianza y cariño: suben con buen trato, bajan con gritos/toques agresivos.
  if (now() - s.interacciones > 0) { /* placeholder */ }
  s.confianza = clamp(s.confianza + s.memoriaTrato * .004 * dt, .05, 1);
  s.carino    = clamp(s.carino + (now() - s.ultimaCaricia < 6000 ? .02 : -.006) * dt, 0, 1);
  s.memoriaTrato = damp(s.memoriaTrato, 0, 600, dt);

  // Hambre/saciedad
  s.saciedad = clamp(s.saciedad - .01 * dt, 0, 1);
  if (s.saciedad < .12 && now() - s.ultimaComida > 600000) s.aburrimiento = clamp(s.aburrimiento + .004 * dt, 0, 1);

  // Comer/bebe solo si no se lo hemos pedido nosotros
  if (!s.actividad && !dormido && s.presente && s.saciedad < .05 && now() - s.ultimaComida > 1.5e6 && chance(.00025 * dt * 60)) Actividades.empezar('comer', { auto: true });

  /* Telequinesis: si la mano ya no está, se apaga con un rebote (la sube Manos cuando la ve) */
  if (s.telequinesis > 0) {
    s.telequinesis = damp(s.telequinesis, 0, .34, dt);
    if (s.telequinesis < .02) s.telequinesis = 0;
  }

  // Actividad: duración y fin
  if (s.actividad) {
    if (!s.actividadPausada) s.actividadDur -= dt;
    if (s.actividadDur <= 0) Actividades.terminar('tiempo');
  }

  /* Se queda dormido solo si de verdad toca: de noche, a oscuras y quieto, o si
     lleva muchísimo rato sin nada. Si te ve delante, aguanta despierto. */
  if (!dormido && !s.actividad && !Dialogo.escuchando && !s.presente &&
      ((s.sueno > .8 && H.noche) || (s.sueno > .55 && s.luz < .3 && s.quietoT > 150) || (s.sueno > .6 && s.quietoT > 420))) {
    Emocion.dormir(true, 'solo');
  }
}

/* Elección de emoción: base + finas, con histéresis para no parpadear de estado a estado */
const Emocion = (() => {
  let actual = 'normal', desde = now(), forzada = null, forzadaHasta = 0, ultimoCambio = now();
  const FINAS = ['curioso', 'sorpresa', 'miedo', 'nervioso', 'aburrido', 'picaro', 'mareado', 'orgulloso', 'amor'];
  function puntuar() {
    const s = Estado, p = [];
    if (s.durmiendo) p.push(['dormido', 3]);
    if (s.modo === 'emergencia') p.push(['nervioso', 3]);
    p.push(['feliz', s.felicidad * 1.25 + s.energia * .25 + (s.actividadGusto > 1 ? .3 : 0)]);
    p.push(['enfadado', s.enfado * 1.8]);
    p.push(['triste', (1 - s.felicidad) * .8 + s.memoriaTrato < 0 ? .3 : 0]);
    p.push(['normal', .55 + (1 - Math.abs(s.felicidad - .55) * 2) * .2]);
    p.push(['aburrido', s.aburrimiento * 1.3]);
    p.push(['miedo', s.miedo * 2.1]);
    p.push(['nervioso', s.bateria && s.bateria.nivel < .08 && !s.bateria.cargando ? 1.6 : 0]);
    p.push(['sorpresa', s.susto && now() - s.susto < 1400 ? 2 : 0]);
    p.push(['amor', s.carino * 1.5 + (now() - s.ultimaCaricia < 3500 ? .6 : 0)]);
    p.push(['picaro', s.felicidad > .75 && s.energia > .6 ? .45 : 0]);
    p.push(['mareado', s.mareo && now() - s.mareo < 2600 ? 2.2 : 0]);
    p.push(['curioso', s.novedad && now() - s.novedad < 3000 ? 1.2 : (s.gestoDuda ? 1.1 : 0)]);
    return p.filter((x) => x[1] > .05).sort((a, b) => b[1] - a[1]);
  }
  function tick(dt) {
    if (forzada && now() < forzadaHasta) return;
    if (forzada) { forzada = null; }
    const p = puntuar();
    const mejor = p[0] ? p[0][0] : 'normal';
    const score = p[0] ? p[0][1] : 0;
    const curva = p.find((x) => x[0] === actual);
    const scoreActual = curva ? curva[1] : 0;
    const estable = now() - ultimoCambio > 900;
    if (mejor !== actual && (score > scoreActual * 1.18 + .04) && estable) {
      actual = mejor; ultimoCambio = now(); desde = now();
      // micro-reacción de sonido al cambiar de humor fuerte
      if (mejor === 'enfadado') Audio2.gruñido();
      else if (mejor === 'miedo') Audio2.miedo();
      else if (mejor === 'feliz') Audio2.tono3(660, 990);
    }
  }
  return {
    tick,
    get actual() { return actual; },
    inyectar(nombre, ms) { actual = nombre; desde = now(); ultimoCambio = now(); forzada = nombre; forzadaHasta = now() + (ms || 1500); },
    segundos() { return (now() - desde) / 1000; },
    finas: FINAS
  };
})();

/* "Tuplas finas": matices que se superponen a la emoción base (curiosidad, sueño, amor...) */
function maticesFinos() {
  const s = Estado, out = [];
  if (s.durmiendo) out.push({ n: 'dormido', w: 1 });
  if (s.sueno > .45) out.push({ n: 'sueno', w: inv(s.sueno, .45, .95) });
  if (s.gestoDuda) out.push({ n: 'curioso', w: .9 });
  if (now() - (s.novedad || 0) < 2500) out.push({ n: 'curioso', w: .7 });
  if (now() - (s.susto || 0) < 1500) out.push({ n: 'sorpresa', w: 1 - inv(now() - s.susto, 0, 1500) });
  if (s.miedo > .35) out.push({ n: 'miedo', w: inv(s.miedo, .35, .9) });
  if (now() - (s.mareo || 0) < 2600) out.push({ n: 'mareado', w: .9 });
  if (now() - s.ultimaCaricia < 3500) out.push({ n: 'amor', w: .8 * inv(3500 - (now() - s.ultimaCaricia), 0, 3500) + .2 });
  if (s.bateria && s.bateria.nivel < .08 && !s.bateria.cargando) out.push({ n: 'nervioso', w: 1 });
  if (s.aburrimiento > .55 && !s.actividad) out.push({ n: 'aburrido', w: inv(s.aburrimiento, .55, 1) });
  if (s.telequinesis > .1) out.push({ n: 'picaro', w: clamp(s.telequinesis, 0, 1) });
  if (now() - (s.orgullo || 0) < 3000) out.push({ n: 'orgulloso', w: 1 });
  return out;
}

  picaro:   { entorna: .35, cejaY: .25, cejaI: .5, boca: .35, sonrisa: .3 },
  mareado:  { temblor: .4, giro: .04, radio: .14, boca: .3, bocaA: .15 },
  orgulloso:{ entorna: .25, sonrisa: .35, mejilla: .25, boca: .3, bocaW: .3 },
  nervioso: { temblor: .5, cejaY: -.15, cejaI: .4, boca: .2, bocaA: .2 },
  dormido:  { parpI: .9, parpD: .9, brillo: -.35, escala: -.03, altura: 6, boca: .1, bocaW: .5 },
  enfado:   { cejaY: .9, cejaIn: -.85, alto: -.22, temblor: .12 },
  triste:   { cejaY: .35, cejaIn: -.45, sonrisa: -.5, brillo: -.2, inclI: -.1, inclD: .1 },
  feliz:    { entorna: .3, sonrisa: .4, mejilla: .2, boca: .35, bocaW: .5 }
};

const MOV = {
  quieto:    () => ({ dx: 0, dy: 0, rot: 0, sx: 1, sy: 1 }),
  respirar:  (t, s) => ({ dx: 0, dy: Math.sin(t * 1.15) * 2.4, rot: 0, sx: 1, sy: 1 + Math.sin(t * 1.15) * .012 * s.intensidad }),
  saltitos:  (t, s) => { const k = Math.abs(Math.sin(t * 3.1 * s.vel)); return { dx: 0, dy: -k * 20 * s.intensidad, rot: Math.sin(t * 3.1 * s.vel) * .02, sx: 1 + (1 - k) * .05, sy: 1 - (1 - k) * .05 }; },
  baile:     (t, s) => ({ dx: Math.sin(t * 4.2 * s.vel) * 16 * s.intensidad, dy: -Math.abs(Math.sin(t * 4.2 * s.vel)) * 12, rot: Math.sin(t * 2.1 * s.vel) * .12, sx: 1 + Math.sin(t * 8.4) * .03, sy: 1 - Math.sin(t * 8.4) * .03 }),
  temblar:   (t, s) => ({ dx: (Math.random() - .5) * 4 * s.intensidad, dy: (Math.random() - .5) * 4 * s.intensidad, rot: (Math.random() - .5) * .02 * s.intensidad, sx: 1, sy: 1 }),
  cabeceo:   (t, s) => ({ dx: Math.sin(t * 1.6 * s.vel) * 6, dy: Math.max(0, Math.sin(t * 1.6 * s.vel)) * 6, rot: Math.sin(t * 1.6 * s.vel) * .06, sx: 1, sy: 1 }),
  ladeo:     (t, s) => ({ dx: 0, dy: 0, rot: Math.sin(t * 1.1 * s.vel) * .1 * (s.lado || 1), sx: 1, sy: 1 }),
  acercar:   (t, s) => { const k = easeIO(clamp(t / 1.2, 0, 1)); return { dx: 0, dy: 14 * k, rot: 0, sx: 1 + .34 * k * s.intensidad, sy: 1 + .34 * k * s.intensidad }; },
  alejar:    (t, s) => { const k = 1 - easeIO(clamp(t / 1.4, 0, 1)); return { dx: 0, dy: 0, rot: 0, sx: .72 + .28 * k, sy: .72 + .28 * k }; },
  rebote:    (t, s) => { const k = Math.abs(Math.sin(t * 5.4 * s.vel)); return { dx: 0, dy: -k * 30 * s.intensidad, sx: 1 + (1 - k) * .09, sy: 1 - (1 - k) * .09 }; },
  giro:      (t, s) => ({ dx: Math.sin(t * 2.6) * 10, dy: 0, rot: Math.sin(t * 2.6) * .22, sx: 1, sy: 1 }),
  carrera:   (t, s) => ({ dx: Math.sin(t * 6 * s.vel) * 40 * s.intensidad, dy: -Math.abs(Math.sin(t * 6 * s.vel)) * 16, rot: Math.sin(t * 6 * s.vel) * .2, sx: 1, sy: 1 }),
  flotar:    (t, s) => ({ dx: Math.sin(t * .9) * 8 * s.intensidad, dy: Math.sin(t * 1.5) * 9 * s.intensidad, rot: Math.sin(t * .7) * .06, sx: 1, sy: 1 }),
  deslizar:  (t, s) => ({ dx: Math.sin(t * 1.3 * s.vel) * 26 * s.intensidad, dy: Math.cos(t * 1.3 * s.vel) * 8, rot: Math.sin(t * 1.3 * s.vel) * .16, sx: 1, sy: 1 }),
  contoneo:  (t, s) => ({ dx: Math.sin(t * 2.4 * s.vel) * 14 * s.intensidad, dy: Math.sin(t * 4.8) * 5, rot: Math.sin(t * 2.4 * s.vel) * .14, sx: 1, sy: 1 }),
  hundir:    (t, s) => ({ dx: 0, dy: 6 + Math.sin(t * .8) * 4, rot: 0, sx: 1 - .03 * s.intensidad, sy: 1 - .04 * s.intensidad }),
  sacudida:  (t, s) => { const k = Math.exp(-t * 3.4); return { dx: Math.sin(t * 34) * 26 * k * s.intensidad, dy: Math.cos(t * 29) * 12 * k, rot: Math.sin(t * 30) * .08 * k, sx: 1, sy: 1 }; },
  bostezo:   (t, s) => { const k = Math.sin(clamp(t / 2.4, 0, 1) * Math.PI); return { dx: 0, dy: 8 * k, rot: 0, sx: 1 + .12 * k, sy: 1 + .1 * k }; },
  masticar:  (t, s) => ({ dx: 0, dy: Math.sin(t * 6.2 * s.vel) * 3.4, rot: 0, sx: 1 + Math.sin(t * 6.2 * s.vel) * .022, sy: 1 - Math.sin(t * 6.2 * s.vel) * .022 }),
  nadar:     (t, s) => ({ dx: Math.sin(t * 1.8) * 22, dy: Math.sin(t * 3.6) * 8, rot: Math.sin(t * 1.8) * .3, sx: 1, sy: 1 }),
  estirar:   (t, s) => { const k = Math.sin(clamp(t / 1.8, 0, 1) * Math.PI); return { dx: 0, dy: -10 * k, rot: 0, sx: 1 + .16 * k, sy: 1 + .22 * k }; },
  salto:     (t, s) => { const k = Math.sin(clamp(t / .9, 0, 1) * Math.PI); return { dx: 0, dy: -68 * k * s.intensidad, sx: 1 - .1 * k, sy: 1 + .12 * k }; }
};
const mover = (nombre, t, spec) => (MOV[nombre] || MOV.quieto)(t, spec);

const Anim = (() => {
  const cur = Object.assign({}, CANAL_CERO);
  const pulsos = [];
  let gesto = null, gestoPrev = null, gestoMix = 0;       // gestoPrev para la salida suave
  let movimiento = 'respirar', movSpec = { intensidad: .4, vel: 1, lado: 1 }, movGesto = null;
  const coste = {};                                        // last os

  function pulso(adds, dur, ease, delay) {
    pulsos.push({ adds, dur: dur || .4, t: -(delay || 0), ease: ease || 'out' });
  }
  /* Fija la cara de base añadiendo un pulso largo (para cambios de mancha, no de humor) */
  function gestoAhora(nombre, opts) {
    const spec = (opts && opts.spec) ? opts.spec : ESPEC.generar(nombre, opts);
    if (gesto) gestoPrev = gesto;      // el anterior se va apagando
    gesto = { spec, t0: now() + (opts && opts.anticipacion != null ? opts.anticipacion : 150), dur: spec.dur * (opts && opts.velMult ? 1 / opts.velMult : 1), vivo: true, cat: nombre, texto: opts && opts.texto };
    movimiento = spec.mov; movGesto = spec;
    if (opts && opts.sinSonido !== true) {
      const d = (gesto.t0 - now()) / 1000;
      setTimeout(() => { Sonar.play(spec.son, spec.intensidad); Vibrar.play(spec.vib); }, Math.max(0, (gesto.t0 - now())));
    }
    return spec;
  }
  /* Sonidos y vibraciones del sistema procedural */
  const Sonar = { play(n, int) {
    if (!n || n === 'ninguno') return;
    const f = Audio2[n];
    if (typeof f === 'function' && n !== 'lluvia' && n !== 'alarma' && n !== 'ronroneo' && n !== 'pararAlarma') {
      try { f(); } catch (e) {}
    }
  } };
  const Vibrar = { play(n) { const f = Haptica[n]; if (typeof f === 'function') { try { f(); } catch (e) {} } } };

  /* Cálculo del objetivo de cada canal: preset + finas + actividad + interacción + vida */
  function calcularObjetivo(t) {
    const s = Estado, o = Object.assign({}, CANAL_CERO);
    const base = PRESET_EMO[Emocion.actual] || PRESET_EMO.normal;
    for (const k in base) if (k in o) o[k] = base[k];
    /* matices finos (suma ponderada) */
    for (const m of maticesFinos()) {
      const d = DELTA_FINA[m.n]; if (!d) continue;
      const w = clamp(m.w, 0, 1.2);
      for (const k in d) if (k in o) {
        if (k === 'escala' || k === 'brillo') o[k] += d[k] * w; else o[k] += d[k] * w;
      }
    }
    /* emoción base ya incluye enfado/triste como emociones: refuerzo suave por valores */
    o.cejaY += clamp(s.enfado * .7, 0, .8); o.cejaIn -= clamp(s.enfado * .6, 0, .7);
    o.temblor += clamp(s.miedo * .3, 0, .3) + clamp(s.enfado * .18, 0, .2);
    o.brillo = clamp(o.brillo * (1 - s.sueno * .18), .4, 1.2);
    /* energía: postura general */
    o.escala += (s.energia - .5) * .05;
    o.altura += (1 - s.energia) * 6;
    /* caricias: ojos entrecerrados + mejillas + inclinación hacia el dedo */
    if (s.caricia.activo) {
      const f = inv(s.caricia.fuerza, 0, 1);
      o.entorna += .5 * (.4 + f * .6);
      o.mejilla = clamp(o.mejilla + .45 * (.5 + f), 0, 1);
      o.sonrisa = clamp(o.sonrisa + .5, -1, 1);
      o.boca = Math.max(o.boca, .55); o.bocaW = Math.max(o.bocaW, .7);
      o.lad += s.caricia.lado * .16;
      o.giroOjos = clamp(o.giroOjos + s.caricia.lado * .1, -1, 1);
      o.altura += 3;
    }
    /* telequinesis: ojos grandes que se acercan a la mano */
    if (s.telequinesis > 0) {
      const k = clamp(s.telequinesis, 0, 1);
      o.alto += .5 * k; o.ancho += .16 * k; o.radio += .1 * k;
      o.brillo = clamp(o.brillo + .25 * k, 0, 1.4);
      o.particulas = Math.max(o.particulas, k);
      o.escala += .12 * k;
    }
    /* sueño: párpados caídos */
    o.parpI += clamp(s.sueno, 0, 1) * .35; o.parpD += clamp(s.sueno, 0, 1) * .35;
    /* aburrimiento: mirada arriba */
    if (s.aburrimiento > .5 && !s.actividad) o.miradaY -= .25;
    /* gesto activo (mezcla de entrada y salida) */
    const g = gestoActivo();
    if (g) {
      const sp = g.spec, w = g.env;
      const caraC = { normal: 1, entornada: .62, cerrada: 0, corazon: .6, estrella: .72, espiral: .8, x: .55, triste: .8, sparkle: 1.2, feliz: .6, guino: .55, felizOjos: .58 }[sp.cara] || 1;
      o.alto = lerp(o.alto, caraC, w);
      o.ancho = lerp(o.ancho, sp.cara === 'estrella' ? 1.2 : (sp.cara === 'felizOjos' ? 1.08 : o.ancho), w * .8);
      o.radio = lerp(o.radio, sp.cara === 'corazon' || sp.cara === 'feliz' ? .44 : o.radio, w * .7);
      if (sp.cara === 'entornada') o.entorna = Math.max(o.entorna, .6 * w);
      if (sp.cara === 'cerrada') { o.parpI = Math.max(o.parpI, w); o.parpD = Math.max(o.parpD, w); }
      if (sp.cara === 'guino') o.parpI = Math.max(o.parpI, w);
      if (sp.cara === 'espiral') { o.giro = o.giro + Math.sin(t * 3) * .1 * w; o.radio = Math.max(o.radio, .5); }
      if (sp.cara === 'x') { o.entorna = Math.max(o.entorna, .45 * w); }
      /* cejas */
      const cj = { ninguna: 0, neutras: .1, arriba: .7, enfadadas: 1, tristes: .45, una: .5, interrogante: .8, arqueada: .6, juntas: .95 }[sp.cejas] || 0;
      o.cejaY = lerp(o.cejaY, cj, w);
      if (sp.cejas === 'enfadadas' || sp.cejas === 'juntas') o.cejaIn = lerp(o.cejaIn, -.9, w);
      if (sp.cejas === 'tristes') o.cejaIn = lerp(o.cejaIn, -.55, w);
      if (sp.cejas === 'una') o.cejaI = Math.max(o.cejaI, .9 * w);
      if (sp.cejas === 'arqueada') o.cejaA = Math.max(o.cejaA, .8 * w);
      /* boca */
      const bo = { ninguna: 0, w: .55, abierta: .7, sonrisa: .5, sorpresa: .85, triste: .45, temblor: .5, mordida: .5 }[sp.boca] || 0;
      o.boca = lerp(o.boca, Math.max(o.boca, bo), w);
      if (sp.boca === 'abierta') o.bocaA = lerp(o.bocaA, .85, w);
      if (sp.boca === 'sorpresa') o.bocaA = lerp(o.bocaA, .6, w);
      if (sp.boca === 'w') { o.bocaW = lerp(o.bocaW, 1, w); o.bocaA = lerp(o.bocaA, 0, w); }
      if (sp.boca === 'sonrisa') o.sonrisa = lerp(o.sonrisa, .8, w);
      if (sp.boca === 'triste') o.sonrisa = lerp(o.sonrisa, -.7, w);
      if (sp.boca === 'temblor') { o.bocaA = lerp(o.bocaA, .3, w); o.temblor = Math.max(o.temblor, .2 * w); }
      /* mejillas */
      const me = { ninguna: 0, suave: .35, rubor: .6, puntitos: .55 }[sp.mejillas] || 0;
      o.mejilla = Math.max(o.mejilla, me * w);
      /* intensidad global del gesto */
      o.escala += (sp.intensidad - .5) * .08 * w;
      o.particulas = Math.max(o.particulas, (sp.cat === 'telequinesis' || sp.acc === 'corazones' || sp.acc === 'estrellas' || sp.cat === 'felicidad') ? sp.intensidad * w : o.particulas);
    }
    /* vida: respiración */
    o.resp = (Math.sin(t * 1.1) * .5 + .5);
    return o;
  }

  function gestoActivo() {
    if (!gesto && !gestoPrev) return null;
    const t = now();
    let g = null;
    if (gesto) {
      const el = (t - gesto.t0) / 1000, d = gesto.dur;
      if (el > d) { gestoPrev = gesto; gesto = null; }
      else if (el >= 0) {
        // envolvente: entra en 18%, se mantiene, sale en 30%
        const eIn = clamp(el / (d * .18), 0, 1), eOut = clamp((d - el) / (d * .32), 0, 1);
        g = { spec: gesto.spec, env: easeIO(Math.min(eIn, 1)) * easeIO(Math.min(eOut, 1)), cat: gesto.cat, tt: Math.max(0, el) };
      }
    }
    if (!g && gestoPrev) {
      const el = (t - (gestoPrev.t0 + gestoPrev.dur * 1000)) / 1000;
      if (el < .5) g = { spec: gestoPrev.spec, env: (1 - easeIO(clamp(el / .5, 0, 1))) * .6, cat: gestoPrev.cat, tt: 9 };
      else gestoPrev = null;
    }
    return g;
  }

  function tick(dt, t) {
    const obj = calcularObjetivo(t);
    /* pulsos aditivos (sobresaltos, golpecitos, empujones...) */
    for (let i = pulsos.length - 1; i >= 0; i--) {
      const p = pulsos[i]; p.t += dt;
      if (p.t < 0) continue;
      if (p.t > p.dur) { pulsos.splice(i, 1); continue; }
      const k = 1 - (p.ease === 'in' ? easeIn(p.t / p.dur) : easeOut(p.t / p.dur));
      for (const c in p.adds) if (c in obj) obj[c] += p.adds[c] * k;
    }
    /* amortiguación por canal: cada uno con su propia "inercia" */
    const medio = { temblor: .06, particulas: .12, brillo: .25, alpha: .2 };
    for (const c in cur) {
      const hl = medio[c] || .13;
      cur[c] = damp(cur[c], obj[c], hl, dt);
    }
    /* si no hay gesto, el movimiento vuelve al reposo */
    if (!gesto && !gestoPrev) {
      movimiento = Estado.durmiendo ? 'respirar' : (Estado.energia > .62 ? 'saltitos' : 'respirar');
      movSpec = { intensidad: Estado.durmiendo ? .25 : clamp(Estado.energia, .15, .8), vel: .8 + Estado.energia * .5, lado: 1 };
    }
  }
  const api = {
    tick, pulso, gestoAhora,
    canal: (k) => cur[k],
    canales: () => cur,
    setMovimiento(n, spec) { movimiento = n; if (spec) movSpec = spec; },
    get movimiento() { return movimiento; },
    get movSpec() { return movSpec; },
    get gesto() { return gestoActivo(); },
    limpiarGestos() { gesto = null; gestoPrev = null; },
    SONAR: Sonar, VIBRAR: Vibrar
  };
  return api;
})();

/* ==================================== 8. REFLEJOS Y VIDA CONSTANTE ==================================== */
/* Parpadeos irregulares, micro-saltitos, miradas a los lados, respiración. */
const Reflejos = (() => {
  let proxParpadeo = now() + 2400, parp = { t: -9, dur: .15, ojo: 'ambos', doble: false }, proxDoble = 0;
  let mirada = { x: 0, y: 0, tx: 0, ty: 0, objetivo: 'ninguno', fin: 0 };
  let proxHop = now() + rnd(4000, 9000);
  let hop = { t: -9, dur: .5, alto: 16 };
  let proxMirada = now() + 3000;
  let proxBostezo = now() + rnd(20000, 45000);
  let suspiro = now() + 12000;
  let respT = 0;

  function parpadear(ojo) {
    parp = { t: 0, dur: rnd(.1, .19), ojo: ojo || 'ambos', doble: false };
    if (chance(.16)) { parp.doble = true; }
  }
  function mirar(x, y, durMs) {
    mirada.tx = clamp(x, -1, 1); mirada.ty = clamp(y, -1, 1); mirada.fin = durMs ? now() + durMs : 0;
  }
  function tick(dt, t) {
    const s = Estado, dormido = s.durmiendo;
    const vel = dormido ? .3 : (s.energia > .3 ? 1 : .7);
    /* --- parpadeo --- */
    if (!dormido && now() > proxParpadeo) {
      parpadear(chance(.06) ? (chance(.5) ? 'I' : 'D') : 'ambos');
      proxParpadeo = now() + rnd(1800, 7000) / vel * (s.sueno > .5 ? .55 : 1);
    }
    if (parp.t >= 0) {
      parp.t += dt;
      const k = parp.dur;
      if (parp.t > k * 2) { if (parp.doble) { parp.doble = false; parp.t = -.001; } else parp.t = -9; }
    }
    /* --- micro-saltitos --- */
    if (!dormido && now() > proxHop) { hop = { t: 0, dur: rnd(.35, .7), alto: rnd(9, 20) * (.5 + s.energia) }; proxHop = now() + rnd(4500, 12000) / clamp(s.energia + .4, .4, 1.4); }
    if (hop.t >= 0) { hop.t += dt; if (hop.t > hop.dur) hop.t = -9; }
    /* --- mirada libre --- */
    if (!dormido && mirada.objetivo === 'ninguno' && now() > proxMirada) {
      mirar(rnd(-1, 1) * .8, rnd(-.4, .5) * .7, rnd(1400, 3600)); proxMirada = now() + rnd(3000, 9000);
    }
    if (mirada.fin && now() > mirada.fin) { mirada.fin = 0; mirada.objetivo = 'ninguno'; mirar(0, 0); proxMirada = now() + rnd(1500, 4000); }
    mirada.x = damp(mirada.x, mirada.tx, dormido ? 1.6 : .22, dt);
    mirada.y = damp(mirada.y, mirada.ty, dormido ? 1.6 : .26, dt);
    /* --- bostezo de aburrimiento o sueño --- */
    if (!dormido && now() > proxBostezo && (s.sueno > .45 || s.aburrimiento > .6)) {
      Anim.gestoAhora('bostezo', { texto: chance(.25) ? 'uaaaah...' : null });
      proxBostezo = now() + rnd(25000, 70000);
    }
    /* --- suspiro --- */
    if (!dormido && now() > suspiro) {
      if (chance(.45)) { Audio2.mmm(); Anim.pulso({ escala: -.03, altura: 3 }, 1.2, 'out'); }
      suspiro = now() + rnd(20000, 60000);
    }
    respT += dt;
  }
  return {
    tick, parpadear, mirar,
    get parpadeo() { return parp; },
    get hop() { return hop; },
    get mirada() { return mirada; },
    get respiracion() { return Math.sin(respT * (Estado.durmiendo ? .55 : 1.2)) * .5 + .5; },
    setObjetivoMirada(nombre) { mirada.objetivo = nombre; },
    reset() { proxParpadeo = now() + 1200; }
  };
})();

/* ==================================== 9. PARTÍCULAS Y EFECTOS (siluetas planas) ==================================== */
const FX = (() => {
  const ps = [];
  let MAX = 220;
  function add(p) { if (ps.length < MAX) ps.push(Object.assign({ t: 0, vida: 1, vx: 0, vy: 0, rot: 0, spin: 0, size: 10, color: null, tipo: 'circulo', gravedad: 0, alpha: 1 }, p)); }
  function limpiar() { ps.length = 0; }
  /* --- generadores --- */
  const G = {
    corazones: (x, y, n, c) => { for (let i = 0; i < n; i++) add({ tipo: 'corazon', x, y, vx: rnd(-40, 40), vy: rnd(-90, -40), gravedad: 12, size: rnd(8, 18), vida: rnd(1.1, 2.2), color: c, spin: rnd(-1, 1), rot: rnd(-.3, .3) }); },
    estrellas: (x, y, n, c) => { for (let i = 0; i < n; i++) add({ tipo: 'estrella', x, y, vx: rnd(-90, 90), vy: rnd(-110, -20), gravedad: 40, size: rnd(7, 15), vida: rnd(.9, 1.8), color: c, spin: rnd(-3, 3) }); },
    notas: (x, y, n, c) => { for (let i = 0; i < n; i++) add({ tipo: 'nota', x, y, vx: rnd(-30, 30), vy: rnd(-70, -30), size: rnd(10, 18), vida: rnd(1.4, 2.6), color: c, spin: rnd(-1, 1), fase: rnd(0, 6) }); },
    sudor: (x, y, n, c) => { for (let i = 0; i < n; i++) add({ tipo: 'gota', x: x + rnd(-12, 12), y, vx: rnd(-10, 10), vy: rnd(-60, -20), gravedad: 220, size: rnd(5, 10), vida: rnd(.7, 1.3), color: c }); },
    lagrimas: (x, y, n, c) => { for (let i = 0; i < n; i++) add({ tipo: 'gota', x: x + rnd(-10, 10), y: y + rnd(0, 8), vx: rnd(-6, 6), vy: rnd(40, 80), gravedad: 260, size: rnd(6, 11), vida: rnd(.8, 1.4), color: c }); },

/* ==================================== 10. BURBUJAS DE TEXTO ==================================== */
const Burbujas = (() => {
  let actual = null, cola = [];
  function decir(texto, opts) {
    opts = opts || {};
    if (!texto) return;
    if (opts.urgente) { cola = []; }                 // algo importante: se dice ya
    if (actual && !opts.urgente) { cola = cola.slice(-2); cola.push({ texto, opts }); return; }
    actual = { texto: String(texto).slice(0, 120), t: 0, dur: opts.dur || Math.max(1.8, Math.min(6, String(texto).length * .055 + 1.4)), estilo: opts.estilo || 'normal', color: opts.color || null };
  }
  function update(dt) {
    if (actual) { actual.t += dt; if (actual.t > actual.dur) { actual = null; if (cola.length) { const n = cola.shift(); decir(n.texto, n.opts); } } }
  }
  return { decir, update, get actual() { return actual; }, limpiar() { actual = null; cola = []; } };
})();

  /* ------------------ COMIDAS Y OBJETOS ------------------ */

  /* ------------------ BOCA "w" y otras ------------------ */

  /* ------------------ CEJAS ------------------ */

  /* ------------------ MEJILLAS ------------------ */

  }

  /* ------------------ PARTÍCULAS ------------------ */

    for (const p of FX.lista) {

  /* ------------------ LLUVIA ------------------ */

  /* ------------------ BURBUJA DE TEXTO ------------------ */

    ctx.save();
    ctx.font = '600 ' + fs + 'px ui-rounded, system-ui, sans-serif';

  /* ------------------ PISTOLA APUNTANDO ------------------ */
  function puntero(x, y, activo) { objetivoPuntero.x = x; objetivoPuntero.y = y; objetivoPuntero.activo = !!activo; }

  /* ------------------ PÓLAROID (la controla Foto) ------------------ */

  /* ------------------ FRAME ------------------ */
  function frame(dt, t) {
    const v = Anim.canales();
    /* fondo OLED con atenuación si duerme */
    const oscuro = Estado.durmiendo ? .35 : (contextoHora().noche ? .78 : 1);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    lluvia(dt);

    /* movimiento global */

    const hop = Reflejos.hop, hopK = hop.t >= 0 ? Math.sin(clamp(hop.t / hop.dur, 0, 1) * Math.PI) : 0;
    const resp = v.resp != null ? v.resp : Reflejos.respiracion;
    const u = escalaUI * 78;                        // unidad de dibujo: 1u = alto base del ojo
    const parp = Reflejos.parpadeo;

      if (parp.ojo === 'ambos' || parp.ojo === 'D') lidD = Math.max(lidD, cierra);
    }
    /* temblor global */
    const temblor = clamp(v.temblor, 0, 1);
    const tx = temblor * 2.6 * Math.sin(t * 42) + (Movimiento.extra.dx || 0);
    const ty = temblor * 2.6 * Math.cos(t * 39) + (Movimiento.extra.dy || 0);
    const cx = centro.x + mov.dx + tx;
    const cy = centro.y + mov.dy - hopK * hop.alto + ty + v.altura + (1 - resp) * 2.4;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mov.rot + v.giro + v.lad * .5);

    const wD = ojoU * .74 * v.ancho * (1 + v.anchoD), hD = ojoU * v.alto * 1.16 * (1 + v.altoD);
    const sep = ojoU * .82 * v.sep;

    const giroY = Reflejos.mirada.y * ojoU * .2 - v.miradaY * ojoU * .2 + v.miradaX * ojoU * .1;
    const brillo = clamp(v.brillo, 0, 1.4);

    if (brillo > .55 && Estado.energia > .2 && calidad === 'alta') {

      ctx.globalAlpha = alphaGuardado;

    // giro individual de cada ojo (tristeza, enfado)
    ctx.save();
    ctx.rotate(v.inclI * .22); ojo(-sep, 0, w, h, ojoU * v.radio, giroX, giroY, lidI, v.entorna + v.entornaI, colorOjo(), caraBase, -1); ctx.restore();

    ctx.rotate(v.inclD * .22); ojo(sep, 0, wD, hD, ojoU * v.radio, giroX, giroY, lidD, v.entorna + v.entornaD, colorOjo(), caraBase, 1); ctx.restore();

    cejas(0, 0, ojoU, v);
    mejillas(0, 0, ojoU, v);
    boca(0, ojoU * 1.02, ojoU, v, t);
    /* --- objetos: siempre salen de su bolsillo con una transición --- */
    const accGesto = Anim.gesto ? Anim.gesto.spec.acc : 'ninguno';
    const esParticula = Objetos.PARTICULAS.includes(accGesto);
    let objNombre = null, objTr = null, objSpec = null;

      objNombre = Objetos.nombre; objTr = Objetos.transform(); objSpec = Anim.gesto ? Anim.gesto.spec : null;

      const d = Objetos.destino(1);            // el mismo sitio de siempre: no aparece de la nada
      objNombre = Estado.actividadItem;
      objTr = { dx: d.dx, dy: d.dy, rot: 0, esc: 1.15, alpha: 1, pata: true };
    }
    if (objNombre) accesorio(objNombre, 0, 0, ojoU, t, objSpec, objTr);

    ctx.globalAlpha = 1;
    ctx.restore();

    /* emisión continua de los accesorios que son partículas */
    const accG = Anim.gesto && Anim.gesto.spec.acc;
    if (accG && FX.cuenta < 90) {

/* ==================================== 12. CÁMARA (un fotograma por segundo para todo) ==================================== */
/* Mientras está despierto: 160x120 a 1 fps (ráfagas de ~9 fps solo para clasificar

   fotograma y el trabajo pesado (media, varianza, piel, movimiento) en un worker. */
const Camara = (() => {
  const w = CFG.capture.w, h = CFG.capture.h;

    if (!activo || !video || video.readyState < 2) return null;
    try { fctx.drawImage(video, 0, 0, w, h); } catch (e) { return null; }

    try { img = fctx.getImageData(0, 0, w, h); } catch (e) { return null; }

    get activo() { return activo; }, get denegado() { return denegado; }, get listo() { return listo; },
    get analisis() { return analisis; }, get canvas() { return fc; },
    set intervalo(v) { intervalo = v; }, get intervalo() { return intervalo; },
    get video() { return video; }
  };
})();

/* ==================================== 13. MANOS (MediaPipe Hands, carga perezosa) ==================================== */
const Manos = (() => {
  let hands = null, cargando = false, disponible = null, ultimoEnvio = 0, resultados = null, ultimoRes = 0;

      if (typeof window.Hands !== 'function') throw new Error('sin Hands');

        locateFile: (f) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f
      });

      hands.onResults(onResultados);

    return disponible;
  }
  function cargarScript(src) {
    return new Promise((res, rej) => {
      if (document.querySelector('script[data-chispi-hand]')) return res();
      const s = document.createElement('script');
      s.src = src; s.async = true; s.dataset.chispiHand = '1';
      s.onload = () => res(); s.onerror = () => rej(new Error('cdn'));
      document.head.appendChild(s);
      setTimeout(() => res(), 4000);      // no bloqueamos si la red va lenta
    });

  /* --- geometría de los 21 puntos --- */
  const D = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function dedoExtendido(lm, tip, pip, mcp) {
    const w = lm[0];
    return D(lm[tip], w) > D(lm[pip], w) * 1.14 && D(lm[tip], lm[mcp]) > D(lm[pip], lm[mcp]) * 1.05;
  }
  function analizarMano(lm) {
    const dedos = [
      dedoExtendido(lm, 4, 3, 2), dedoExtendido(lm, 8, 6, 5), dedoExtendido(lm, 12, 10, 9),
      dedoExtendido(lm, 16, 14, 13), dedoExtendido(lm, 20, 18, 17)
    ];
    const nExt = dedos.filter(Boolean).length;
    const palma = D(lm[0], lm[9]) || .001;
    const span = D(lm[4], lm[20]) / palma;                       // apertura palma
    const pulgarSep = D(lm[4], lm[17]) / palma;
    const tipo = (lm[12].y - lm[9].y) / palma;                   // >0 dedos hacia abajo
    const cx = lm.reduce((a, p) => a + p.x, 0) / lm.length;
    const cy = lm.reduce((a, p) => a + p.y, 0) / lm.length;
    const alto = Math.abs(lm[9].y - lm[0].y) + D(lm[0], lm[12]);
    const abierta = nExt >= 4 && span > 1.35 && pulgarSep > .72 && alto > .12;
    const score = clamp((nExt - 3) / 2 * .45 + inv(span, 1.1, 2.1) * .3 + inv(pulgarSep, .55, 1.05) * .25, 0, 1);
    let gesto = 'ninguna';
    if (abierta) gesto = 'abierta';
    else if (dedos[0] && !dedos[1] && !dedos[2] && !dedos[3] && !dedos[4] && lm[4].y < lm[3].y - .02 && lm[4].y < lm[9].y) gesto = 'pulgarArriba';
    else if (dedos[1] && dedos[2] && !dedos[3] && !dedos[4] && D(lm[8], lm[12]) / palma > .45) gesto = 'paz';
    else if (nExt === 0) gesto = 'puno';
    else if (nExt >= 2 && nExt <= 3) gesto = 'media';

      while (historial.length > 26 || (historial.length && ah - historial[0].t > 2600)) historial.shift();

        if (s.telequinesis > .25) {
          /* rebote elástico: los ojos vuelven de golpe y la cara se sorprende */
          Anim.pulso({ escala: .12, alto: .35, ancho: .2, radio: .1 }, .9, 'out');

          Anim.gestoAhora(chance(.5) ? 'sorpresa' : 'mareado', { sinSonido: true });
          Audio2.tono3(900, 1500);

        s.ultimoSaludo = ah;
        setTimeout(() => { if (Estado.modo !== 'durmiendo') Saludo.saludar('mano'); }, 150);   // micro-anticipación
        historial.length = 0;
      }
      duda = false; s.gestoDuda = false;
      s.telequinesis = damp(s.telequinesis, 0, .2, .5);
      return;
    }
    if (esTele) {
      if (estadoGesto !== 'telequinesis') {
        estadoGesto = 'telequinesis'; lock.saludo = ah + 1200; ultimoTele = ah;
        Anim.gestoAhora('telequinesis', { sinSonido: false });
        Audio2.magia(); Haptica.suave();
      }

    if (g.corazon && ah > lock.tele) {

      Anim.gestoAhora('asustarse', { sinSonido: true });
      Audio2.miedo(); s.miedo = clamp(s.miedo + .25, 0, 1); historial.length = 0; estadoGesto = 'puno'; return;
    }
    if (g.gesto === 'paz' && abiertaTodo < .4 && ah > lock.tele) {
      Anim.gestoAhora('felicidad', {}); Audio2.feliz(); Haptica.alegria();
      historial.length = 0; estadoGesto = 'paz'; return;
    }
    if (g.gesto === 'pulgarArriba' && ah > lock.tele) {
      Anim.gestoAhora('orgulloso', { texto: pick(['¡bien!', '¡genial!']) }); Audio2.estrella(); Haptica.alegria();
      historial.length = 0; estadoGesto = 'pulgar'; return;
    }
    if (g.gesto === 'puno' || g.gesto === 'media') { duda = true; s.gestoDuda = true; estadoGesto = 'duda'; return; }
    if (g.gesto === 'abierta' && !esTele && !esSaludo) { duda = true; s.gestoDuda = true; estadoGesto = 'duda'; }
  }
  function tick(t) {
    const s = Estado;
    if (!disponible || !Camara.activo || !Camara.canvas) return;
    if (s.durmiendo && !s.presente) { resultados = []; return; }
    if (t - ultimoEnvio < CFG.ricon.manosCadaMs && !HistorialGesto.rafagaActiva) return;
    if (!s.presente && !HistorialGesto.rafagaActiva) return;         // solo si hay alguien delante
    ultimoEnvio = t;
    try { hands.send({ image: Camara.canvas }); } catch (e) { disponible = false; }
    setTimeout(clasificar, 60);
  }
  const HistorialGesto = { rafagaActiva: false };
  return {
    cargar, tick, clasificar,
    get disponible() { return disponible; }, get resultados() { return resultados; }, get cargando() { return cargando; },
    get gesto() { return estadoGesto; }, get duda() { return duda; }, get historial() { return historial; },
    rafaga(on) { HistorialGesto.rafagaActiva = !!on; },
    limpiar() { historial.length = 0; resultados = []; estadoGesto = 'ninguno'; duda = false; },
    /* inyección de resultados: la usan las pruebas internas (?dev=1) */
    inyectar(manos) { resultados = manos; ultimoRes = now(); },
    analizar(lm) { return analizarMano(lm); }
  };
})();

/* ==================================== 14. PERSONAS (reconocimiento local con firmas de color) ==================================== */
const Personas = (() => {
  let lista = [], cargado = false, actual = null, candidato = null;
  let ultimaPreguntaNombre = 0, pidiendoNombre = false, avisadoDesconocido = false;
  let presenciaDesde = 0, ultimaVez = {};

  async function cargarLista() {
    lista = (await DB.all('people')) || [];
    cargado = true;
  }
  async function guardar(p) { await DB.set('people', p); if (!lista.find((x) => x.id === p.id)) lista.push(p); }
  async function olvidar(nombre) {
    const n = String(nombre || '').toLowerCase().trim();
    const quien = lista.find((p) => p.nombre.toLowerCase() === n || p.nombre.toLowerCase().startsWith(n));
    if (!quien) return false;
    await DB.del('people', quien.id);
    lista = lista.filter((p) => p.id !== quien.id);
    if (actual && actual.id === quien.id) actual = null;
    Burbujas.decir('...adiós, ' + quien.nombre, { dur: 3 });
    Anim.gestoAhora('triste', { texto: null });
    Audio2.triste(); Haptica.suave();
    return true;
  }
  function mejorMatch(firma) {
    let mejor = null, d = 1;
    for (const p of lista) {
      if (!p.firma) continue;
      const dist = distancia(p.firma, firma);
      if (dist < d) { d = dist; mejor = p; }
    }
    return { persona: d < CFG.ricon.umbral ? mejor : null, dist: d };
  }
  /* distancia entre firmas (misma que usa la cámara) */
  function distancia(a, b) {
    if (!a || !b) return 1;
    let d = 0; for (let i = 0; i < 64; i++) d += Math.abs(a.bins[i] - b.bins[i]);
    d /= 2;
    const dt = Math.abs(a.tam - b.tam) * 4, da = Math.abs(a.aspecto - b.aspecto) * .35;
    return clamp(d * .78 + dt * .14 + da * .08, 0, 1);
  }
  function firmaActual() { return Camara.analisis.firma; }
  /* Foto interna de la persona nueva (solo para su firma: no se muestra ni se envía) */
  function capturarFirma() {
    return firmaActual();
  }
  function tick(t) {
    const s = Estado, an = Camara.analisis;
    if (!Camara.activo || !an.firma) { return; }
    const f = an.firma;
    if (!candidato || t - candidato.t > 2500) candidato = { firma: null, muestras: [], t };
    candidato.t = t;
    candidato.muestras.push(f);
    if (candidato.muestras.length > 3) candidato.muestras.shift();
    // firma media de las últimas muestras: mucho más estable
    const media = promediar(candidato.muestras);
    const { persona, dist } = mejorMatch(media);
    if (persona) {
      if (!actual || actual.id !== persona.id) {
        actual = persona;
        const primeraVezHoy = (persona.ultimaVez || 0) < now() - 3600000;
        persona.veces = (persona.veces || 0) + 1; persona.ultimaVez = now();
        guardar(persona);
        s.nombreVisitante = persona.nombre;
        if (primeraVezHoy && t - (ultimaVez[persona.id] || 0) > 40000) { ultimaVez[persona.id] = t; Saludo.saludar('persona', persona); }
      } else { actual.ultimaVez = now(); }
      s.nombreVisitante = persona.nombre;
      avisadoDesconocido = false;
      return;
    }
    /* persona nueva: si se queda un rato, le saca una foto y pregunta su nombre */
    if (!avisadoDesconocido && t - (presenciaDesde || (presenciaDesde = t)) > 5000) {
      if (now() - ultimaPreguntaNombre > 180000) {
        avisadoDesconocido = true;
        setTimeout(() => PreguntarNombre(promediar(candidato.muestras)), 200);
      }
    }
  }
  function promediar(muestras) {
    if (!muestras.length) return null;
    const bins = new Float32Array(64);
    let aspecto = 0, tam = 0, media = 0;
    for (const m of muestras) { for (let i = 0; i < 64; i++) bins[i] += m.bins[i] / muestras.length; aspecto += m.aspecto / muestras.length; tam += m.tam / muestras.length; media += m.media / muestras.length; }
    return { bins, aspecto, tam, media };
  }
  function resetPresencia() { presenciaDesde = 0; avisadoDesconocido = false; actual = null; }
  /* --- flujo de nombre: pregunta con voz y gesto, acepta voz o texto --- */
  async function PreguntarNombre(firma) {
    ultimaPreguntaNombre = now();
    pidiendoNombre = true;
    const vistos = lista.map((p) => p.nombre);
    Burbujas.decir(vistos.length ? '¿y tú quién eres? yo soy ' + NAME : '¡hola! ¿cómo te llamo?', { dur: 5 });
    Anim.gestoAhora('curiosidad', { texto: null });
    Audio2.quien();
    Voz.hablar(vistos.length ? '¡anda, alguien nuevo! ¿cómo te llamo?' : '¡hola! soy ' + NAME + '. ¿cómo te llamo?');
    mostrarHoja('perdona, ¿cómo te llamo?', 'nombre...', async (valor) => {
      const nombre = limpiarNombre(valor);
      if (nombre) await registrar(nombre, firma);
    }, [{ txt: 'luego', fn: () => { pidiendoNombre = false; } }]);
  }
  function limpiarNombre(v) {
    let n = String(v || '').trim().replace(/^(me llamo|soy|mi nombre es)\s+/i, '').replace(/[^\p{L}\p{N}\s-]/gu, '').trim();
    if (!n) return null;
    return n.split(/\s+/).slice(0, 2).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
  }
  async function registrar(nombre, firma) {
    pidiendoNombre = false;
    const p = {
      id: uid(), nombre: limpiarNombre(nombre) || 'amigo', firma: firma || firmaActual(),
      creado: now(), veces: 1, ultimaVez: now(),
      gustos: { comida: pick(['pizza', 'helado', 'hamburguesa', 'fruta', 'sushi', 'pastel']), actividad: pick(['jugar', 'bailar', 'leer', 'ver']), tono: pick(['cariñoso', 'jugueton', 'tranquilo']) },
      trato: 0
    };
    await guardar(p);
    actual = p; Estado.nombreVisitante = p.nombre;
    Burbujas.decir('¡encantado, ' + p.nombre + '!', { dur: 3.4 });
    Anim.gestoAhora('saludo', { texto: null });
    Audio2.saludo(); Haptica.alegria();
    Voz.hablar('¡encantado, ' + p.nombre + '!');
    return p;
  }
  return {
    cargarLista, tick, olvidar, registrar, limpiarNombre, PreguntarNombre, resetPresencia, promediar, distancia,
    get lista() { return lista; },
    get actual() { return actual; },
    get pidiendoNombre() { return pidiendoNombre; },
    nombres: () => lista.map((p) => p.nombre),
    tocar(trato) { if (actual) { actual.trato = clamp((actual.trato || 0) + trato, -5, 5); actual.ultimaVez = now(); guardar(actual); } }
  };
})();

/* ==================================== 15. SALUDO (uno solo cada cierto tiempo, variado) ==================================== */
const Saludo = (() => {
  const saludosConocido = ['¡hola {n}!', '¡{n}! ¡qué alegría!', '¡hola hola, {n}!', '¡{n}, te estaba esperando!', '¡ey, {n}!'];
  const saludosPresencia = ['¡hola!', '¡aaah, hola!', '¡te veo!', '¡hola hola!', '¡hola, humano!'];
  const saludosVuelta = ['¡has vuelto!', '¡ya estás aquí!', '¡volviste!', '¡qué bien, has vuelto!'];
  let ultimo = 0, ultimoLargo = 0;
  async function saludar(motivo, persona) {
    if (now() - ultimo < 12000) return;
    if (Estado.modo === 'durmiendo') return;
    ultimo = now();
    let texto, espect = 'saludo';
    if (persona) texto = pick(saludosConocido).replace('{n}', persona.nombre);
    else if (motivo === 'vuelta') texto = pick(saludosVuelta);
    else texto = pick(saludosPresencia);
    /* cada saludo es distinto: el sistema procedural elige la variante */
    const spec = Anim.gestoAhora('saludo', {});
    Estado.novedad = now() + 2000;
    Estado.ultimoSaludo = now();
    Burbujas.decir(texto, { dur: 2.6 });
    Audio2.saludo(); Haptica.alegria();
    if (chance(.6)) Voz.hablar(texto);
    /* saludo con la voz: además mueve la mirada y se inclina hacia ti */
    Reflejos.mirar(0, -.1, 2200);
    FX.G.estrellas(Dibujo.centro().x + rnd(-40, 40), Dibujo.centro().y - Dibujo.u * 1.1, Math.round(6 * (spec ? spec.intensidad : .6)), PALETA.feliz.acc);
    return true;
  }
  return { saludar, get ultimo() { return ultimo; } };
})();

/* ==================================== 16. PERCEPCIÓN (lo que ve, oye y siente) ==================================== */
const Percepcion = (() => {
  let sinVerDesde = 0, vistoAntes = false, ultimoSusto = 0, ultimoFlash, ultimoAvisoHora = 0, ultimaLuzAlta = 0;
  let movHist = [], quietoDesde = now(), orientHist = [], quietoTumbado = 0;
  function tick(t, dt) {
    const s = Estado, an = Camara.analisis;
    /* --- luz --- */
    if (an.t) {
      ultimoFlash = ultimoFlash == null ? an.media : ultimoFlash;
      const delta = an.media - ultimoFlash;
      ultimoFlash = lerp(ultimoFlash, an.media, .35);
      s.luz = lerp(s.luz, an.media, .4);
      s.luzOscura = an.media < .16;
      // oscuridad súbita => se asusta (solo si no duerme y hay alguien cerca)
      if (delta < -.34 && an.media < .3 && now() - ultimoSusto > 9000 && !s.durmiendo && s.presente) {
        ultimoSusto = now(); s.susto = now(); s.miedo = clamp(s.miedo + .5, 0, 1);
        Anim.gestoAhora('asustarse', {}); Audio2.miedo(); Haptica.fuerte();
        Burbujas.decir(pick(['¡ay!', '¡se ha ido la luz!', '¡uy!']), { dur: 2 });
      }
    }
    /* --- presencia --- */
    const hayPresencia = !!(an.blobs && an.blobs.length && an.blobs[0].area > CFG.ricon.minCara);
    if (hayPresencia) {
      if (!s.presente) {
        s.presente = true;
        const ausencia = now() - s.ultimaPresencia;
        s.ultimaPresencia = now();
        if (vistoAntes) {
          if (ausencia > 90000) Saludo.saludar('vuelta', null);
          else if (ausencia > 25000) { Anim.gestoAhora('curiosidad', { texto: null }); Burbujas.decir(pick(['¡ah, estás ahí!', '¡vuelves!']), { dur: 2.2 }); }
        } else { vistoAntes = true; s.novedad = now(); }
        if (s.durmiendo && s.sueno < .8) Emocion.dormir(false, 'te-he-visto');
      }
      s.ultimaPresencia = now(); sinVerDesde = 0;
      Personas.tick(t);
    } else {
      if (s.presente && !sinVerDesde) sinVerDesde = now();
      if (s.presente && now() - sinVerDesde > 12000) {
        s.presente = false; s.telequinesis = 0; Manos.limpiar();
        Personas.resetPresencia();
        if (!s.durmiendo && now() - s.ultimaPresencia > 15000) {
          Anim.gestoAhora('despedida', { texto: null });
          if (chance(.5)) Burbujas.decir(pick(['¿te vas?', '¡no te vayas!', 'te echo de menos...']), { dur: 2.6 });
        }
      }
    }
    /* --- si duerme y nota movimiento cerca, se despierta --- */
    if (s.durmiendo && an.t && an.movimiento > .16 && now() - (s.despertando || 0) > 8000) {
      s.despertando = now();
      Emocion.dormir(false, 'te-he-visto');
      Burbujas.decir(pick(['¿eh? ¿te levantas?', 'mmm... ¿ya?', 'uy, perdona']), { dur: 2.4 });
    }
    /* --- movimiento brusco => sobresalto --- */
    const mov = an.movimiento || 0;
    movHist.push(mov); if (movHist.length > 8) movHist.shift();
    const media = movHist.reduce((a, b) => a + b, 0) / (movHist.length || 1);
    if (mov > .3 && media < .09 && now() - ultimoSusto > 8000 && !s.durmiendo && s.presente) {
      ultimoSusto = now(); s.susto = now(); s.miedo = clamp(s.miedo + .35, 0, 1);
      Anim.gestoAhora('asustarse', {});
      Dibujo.Movimiento.empujar(rnd(-60, 60), rnd(-40, 0));
    }
    /* --- quietud / tumbado / sueño --- */
    if (!Camara.activo) { quietoDesde = t; s.quietoT = 0; quietoTumbado = 0; }
    else if ((an.movimiento || 0) > .05 || (an.piel || 0) > .25 && Math.random() < .02) { quietoDesde = t; quietoTumbado = 0; }
    s.quietoT = (t - quietoDesde) / 1000;
    s.tumbado = Estado.flatPhone && s.quietoT > 45 && s.luz < .35;
    if (!s.durmiendo && s.sueno > .68 && s.quietoT > 240 && !s.presente && (s.luz < .3 || contextoHora().noche)) Emocion.dormir(true, 'solo');
    /* --- hora del día --- */
    if (t - ultimoAvisoHora > 600000) {
      ultimoAvisoHora = t;
      const H = contextoHora();
      if (!s.durmiendo && !s.actividad) {
        if (H.h === 7 || H.h === 8) { if (chance(.5)) { Burbujas.decir('buenos días...', { dur: 2.6 }); Anim.gestoAhora('bostezo', {}); } }
        else if (H.h === 23 || (H.h >= 0 && H.h < 3)) { if (chance(.5)) { Burbujas.decir(pick(['qué tarde...', '¡a dormir!', 'hora de soñar']), { dur: 2.8 }); Anim.gestoAhora('bostezo', {}); } }
      }
    }
  }
  function reset() { vistoAntes = false; sinVerDesde = 0; }
  return { tick, reset, get visto() { return vistoAntes; } };
})();

/* ==================================== 16b. OBJETOS (de dónde salen las cosas) ==================================== */
/* Nada aparece de golpe: Chispi mira a su "bolsillo", saca el objeto con una
   transición elástica (rotación + escala + arco), suelta chispas y un "pop",
   y al terminar lo guarda por el mismo camino. */
const Objetos = (() => {
  const PARTICULAS = ['corazones', 'estrellas', 'notas', 'zZz', 'sudor', 'lluvia'];
  const SITIO = { x: .70, y: 1.22 };      // a un lado y por debajo de la cara: parece que lo sostiene
  const ESCALA_MANO = 1.15;               // un pelín más grande cuando lo tiene en la mano
  const destino = (lado) => ({ dx: lado * SITIO.x, dy: SITIO.y });
  let obj = null;                      // { nombre, fase: 'in' | 'on' | 'out', t0, dur, lado }
  let temporizadores = [];

  function limpiarTempos() { temporizadores.forEach((id) => clearTimeout(id)); temporizadores = []; }
  function sacar(nombre, opts) {
    opts = opts || {};
    if (!nombre || nombre === 'ninguno') { guardar(); return; }
    if (obj && obj.nombre === nombre && obj.fase !== 'out') return;
    limpiarTempos();
    obj = { nombre, fase: 'in', t0: now(), dur: opts.rapido ? .42 : .66, lado: chance(.5) ? -1 : 1 };
    /* 1) mira hacia su bolsillo y se agacha un pelín (se le ve "buscar") */
    Reflejos.mirar(obj.lado * .55, .5, 900);
    Anim.pulso({ altura: 2.5 }, .45, 'out');
    /* 2) sale: aire + chispas + pop */
    temporizadores.push(setTimeout(() => { if (obj) Audio2.whoosh(true); }, 90));
    temporizadores.push(setTimeout(() => {
      if (!obj || obj.nombre !== nombre) return;
      const c = Dibujo.centro(), u = Dibujo.u;
      FX.G.estrellas(c.x + obj.lado * u * .8, c.y + u * .9, 5, (PALETA[Emocion.actual] || PALETA.normal).acc);
      Audio2.pop();
      Anim.pulso({ parpI: 1, parpD: 1 }, .13, 'out');     // guiña al sacarlo
      Haptica.suave();
    }, opts.rapido ? 280 : 460));
    /* 3) ya en su sitio */
    temporizadores.push(setTimeout(() => { if (obj && obj.fase === 'in') obj.fase = 'on'; }, obj.dur * 1000));
  }
  function guardar() {
    if (!obj || obj.fase === 'out') return;
    limpiarTempos();
    obj.fase = 'out'; obj.t0 = now(); obj.dur = .45;
    Audio2.whoosh(false);
    temporizadores.push(setTimeout(() => {
      const c = Dibujo.centro(), u = Dibujo.u;
      if (obj) FX.G.polvo(c.x, c.y + u, 4, (PALETA[Emocion.actual] || PALETA.normal).acc);
      if (obj && obj.fase === 'out') obj = null;
    }, 470));
  }
  /* transformación de dibujo del objeto activo */
  function transform() {
    if (!obj) return null;
    const k = clamp((now() - obj.t0) / 1000 / obj.dur, 0, 1);
    const lado = obj.lado;
    const d = destino(lado);
    if (obj.fase === 'in') {
      const e = easeOutBack(k);
      return {
        dx: lerp(lado * 1.55, d.dx, e), dy: lerp(.34, d.dy, e), rot: lerp(lado * -.85, 0, e),
        esc: lerp(.22, 1, e) * ESCALA_MANO, alpha: clamp(k * 3.5, 0, 1), pata: true
      };
    }
    if (obj.fase === 'out') {
      const e = easeIn(k);
      return {
        dx: lerp(d.dx, lado * 1.5, e), dy: lerp(d.dy, .42, e), rot: lerp(0, lado * .7, e),
        esc: lerp(1, .2, e) * ESCALA_MANO, alpha: 1 - clamp((k - .45) / .55, 0, 1), pata: true
      };
    }
    /* ya colocado: respira y se balancea un poquito (nunca quieto del todo) */
    const t = now() / 1000;
    return {
      dx: d.dx + Math.sin(t * 1.4) * .022, dy: d.dy + Math.sin(t * 1.05) * .028,
      rot: Math.sin(t * .85) * .035, esc: ESCALA_MANO, alpha: 1, pata: true
    };
  }
  /* los accesorios de gesto también salen "de dentro" con un rebote corto */
  function popIn(segundos) {
    const k = clamp((segundos || 0) / .34, 0, 1);
    const e = easeOutBack(k);
    return { dx: (1 - e) * .55, dy: (1 - e) * .4, rot: (1 - e) * -.4, esc: lerp(.35, 1, e), alpha: clamp(k * 4, 0, 1) };
  }
  return {
    sacar, guardar, transform, popIn, destino, PARTICULAS,
    get nombre() { return obj ? obj.nombre : null; },
    get activo() { return !!obj; },
    get fase() { return obj ? obj.fase : null; }
  };
})();
