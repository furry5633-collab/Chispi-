    escribe('memoria: ' + Memoria.resumen());
    escribe('cámara ' + (Camara.activo ? 'on' : 'off') + ' luz ' + Estado.luz.toFixed(2) + ' px piel ' + (Camara.analisis.piel * 100).toFixed(1) + '% | manos ' + (Manos.disponible ? 'listas' : 'no') + ' | oído ' + (Voz.oidoSoportado() ? 'listo' : 'no') + ' | micro ' + Voz.micEstado + ' | escuchando ' + (Voz.quiereEscuchar ? 'sí' : 'no') + ' | ' + Voz.estadoOido());
  }
  function iniciar() {
    bar.classList.remove('hidden');
    const B = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.addEventListener('click', fn); bar.appendChild(b); };
    B('▶ todas las secuencias', pruebaTodas);
    Object.keys(SECUENCIAS).forEach((n) => B('· ' + n, () => pruebaSecuencia(n)));
    B('variantes', reporteVariantes);
    B('código…', () => Hoja.mostrar('código de variante (0–' + ESPEC.totalLibre + ')', 'p. ej. 123456', (v) => probarCodigo(v), []));
    B('emociones', cicloEmociones);
    B('foto', () => Foto.tomar());
    B('simular susto', () => { Estado.susto = now(); Estado.miedo = clamp(Estado.miedo + .6, 0, 1); Anim.gestoAhora('asustarse', {}); });
    B('simular dormir', () => Emocion.dormir(true, 'dev'));
    B('simular despertar', () => Emocion.dormir(false, 'dev'));
    B('simular batería crítica', () => { Estado.bateria = { nivel: .05, cargando: false }; Bateria.revisar(); });
    B('simular cargando', () => { Estado.bateria = { nivel: .3, cargando: true }; Bateria.revisar(); Audio2.pararAlarma(); });
    B('simular lluvia', () => Clima.aplicar(63, 2, 0, 14));
    B('simular lluvia: no', () => Clima.aplicar(0, 0, 1, 20));
    B('forget…', () => Hoja.mostrar('olvidar a alguien', 'nombre', (v) => Personas.olvidar(v), []));
    B('fps: pantalla', () => { Rendimiento.fijar(0); escribe('tasa automática (' + Rendimiento.hz + ' Hz)'); });
    B('fps: 120', () => escribe('tasa fija ' + Rendimiento.fijar(120) + ' fps (pantalla ' + Rendimiento.hz + ' Hz)'));
    B('fps: 60', () => escribe('tasa fija ' + Rendimiento.fijar(60) + ' fps'));
    B('stats', stats);
    B('sonidos', () => { ['saludo', 'feliz', 'risita', 'ronroneo', 'bostezo', 'chomp', 'asco', 'triste', 'enfado', 'miedo', 'magia', 'disparo', 'alarma'].forEach((s, i) => setTimeout(() => Audio2[s] && Audio2[s](true), i * 700)); });
    B('limpiar todo', async () => { await DB.clear('people'); await DB.clear('photos'); Memoria.limpiar(); Personas.cargarLista(); escribe('datos borrados'); });

    reporteVariantes();

  return { iniciar, pruebaSecuencia, pruebaTodas, reporteVariantes, probarCodigo, escribe, manoSimulada, SECUENCIAS };
})();

/* ==================================== 31b. RENDIMIENTO (a la tasa de la pantalla) ==================================== */
/* Objetivo: ir a los Hz que aguante el móvil (60, 90 o 120). Se mide lo que tarda
   de verdad cada fotograma; si no llega, se quitan adornos y resolución primero y
   solo al final se baja la tasa, para que nunca se vea a tirones. */
const Rendimiento = (() => {
  const PERFILES = {
    alta:  { dpr: 1.5,  particulas: 220, manos: true },
    media: { dpr: 1.25, particulas: 90,  manos: true },
    baja:  { dpr: 1,    particulas: 45,  manos: false }
  };
  const ORDEN = ['baja', 'media', 'alta'];
  const ESCALONES = [1, .75, .5, .34];       // topes de tasa, en fracción de los Hz de la pantalla
  const FPS_MIN = CFG.fpsMin;
  let nivel = 'alta', escalon = 0, libre = false;   // libre = el usuario ha fijado la tasa a mano
  let muestras = [], ultimoAjuste = 0, buenas = 0, malas = 0;
  let medidoHz = 0, arranqueT = now();

  const hz = () => Math.max(30, Estado.hz || 60);
  const topeFps = () => (libre ? Math.max(FPS_MIN, Math.round(CFG.fpsMax || hz()))
                              : Math.max(FPS_MIN, Math.min(hz(), Math.round(hz() * ESCALONES[escalon]))));
  function mediana(a) { const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1] || 16.7; }
  function aplicar() { Dibujo.setCalidad(nivel); FX.setMax(PERFILES[nivel].particulas); }
  function registro(txt) { if (DEV) DevTest.escribe(txt); }

  function tick(dtMs, t) {
    if (t - arranqueT < 4000) return;                        // los primeros segundos no cuentan (carga)
    if (dtMs > 0 && dtMs < 250) { muestras.push(dtMs); if (muestras.length > 140) muestras.shift(); }
    if (t - ultimoAjuste < 1500 || muestras.length < 20) return;
    ultimoAjuste = t;
    const m = mediana(muestras); muestras = [];
    const periodo = 1000 / topeFps();
    if (m > periodo * 1.3) { malas++; buenas = 0; }
    else if (m < periodo * 1.06) { buenas++; malas = Math.max(0, malas - 1); }
    if (malas >= 2) { malas = 0; bajar(m); }
    else if (buenas >= 3) { buenas = 0; subir(m); }
  }
  /* Para bajar: primero adornos y resolución; la tasa se toca al final, que es lo que más se nota.
     Para subir: la calidad sí vuelve sola, pero el tope de tasa NO se sube solo (un móvil que
     no llegaba a 120 no va a llegar porque sí): eso solo lo devuelve el usuario o al volver a la app. */
  function bajar(m) {
    if (nivel === 'alta') { nivel = 'media'; aplicar(); registro('bajo a media (' + m.toFixed(0) + ' ms)'); }
    else if (nivel === 'media') { nivel = 'baja'; aplicar(); registro('bajo a baja (' + m.toFixed(0) + ' ms)'); }
    else if (!libre && escalon < ESCALONES.length - 1) { escalon++; registro('tasa ' + topeFps() + ' fps (' + m.toFixed(0) + ' ms)'); }
  }
  function subir(m) {
    const k = ORDEN.indexOf(nivel);
    if (k < ORDEN.length - 1) { nivel = ORDEN[k + 1]; aplicar(); registro('subo a ' + nivel + ' (' + m.toFixed(0) + ' ms)'); }
  }
  function reiniciar() { escalon = 0; malas = 0; buenas = 0; muestras = []; ultimoAjuste = 0; arranqueT = now(); }
  /* medida honesta de la pantalla: la mediana de los huecos entre fotogramas */
  function medirPantalla() {
    return new Promise((res) => {
      const ts = []; let n = 0;
      const paso = (t) => {
        ts.push(t);
        if (++n < 45) { requestAnimationFrame(paso); return; }
        const ds = []; for (let i = 1; i < ts.length; i++) { const d = ts[i] - ts[i - 1]; if (d > 2 && d < 60) ds.push(d); }
        const m = ds.length ? mediana(ds) : 16.7;
        const est = 1000 / m;
        const comunes = [30, 48, 60, 75, 90, 120, 144, 165];
        let mejor = 60; for (const c of comunes) if (Math.abs(c - est) < Math.abs(mejor - est)) mejor = c;
        medidoHz = mejor;
        if (!CFG.fpsMax) Estado.hz = mejor;
        /* en pantallas muy rápidas (120+) se arranca con menos píxeles: así se llega a 120 de verdad
           y, si sobra potencia, el propio sistema sube la calidad solo */
        if (mejor >= 120 && nivel === 'alta' && !libre) { nivel = 'media'; aplicar(); }
        res(mejor);
      };
      requestAnimationFrame(paso);
    });
  }
  return {
    tick, aplicar, medirPantalla,
    get nivel() { return nivel; },
    get topeFps() { return topeFps(); },
    get hz() { return hz(); },
    get particulas() { return PERFILES[nivel].particulas; },
    get manos() { return PERFILES[nivel].manos && !libre; },
    /* fijar la tasa a mano (0 = automático) */
    reiniciar,
    fijar(fps) {
      const f = Math.max(0, Math.round(fps || 0));
      libre = f > 0;
      CFG.fpsMax = libre ? Math.min(f, hz()) : 0;
      escalon = 0; malas = 0; buenas = 0;
      registro(libre ? 'tasa fija ' + CFG.fpsMax + ' fps (pantalla ' + hz() + ' Hz)' : 'tasa automática (' + hz() + ' Hz)');
      return topeFps();
    },
    get automatizacion() { return !libre; }
  };
})();

/* ==================================== 32. APP (arranque, bucle y ciclo de vida) ==================================== */
const App = (() => {
  let ultimoT = 0, acumulador = 0, fpsCont = 0, fpsT = 0, visible = true, iniciado = false;
  let capturas = 0, pedidoPermisos = false, primerGestoHecho = false, quiereCamara = false;
  let tMood = 0, tPerc = 0, tPers = 0, tBat = 0, tMic = 0, tDev = 0;
  let oidoEl = null, oidoTxt = null, oidoBars = null, oidoUltimo = '', oidoClase = '';
  let modoObjetivo = 'tranquilo';

  const hudMicro = document.getElementById('microHint');
  hudMicro.addEventListener('click', async (e) => {
    e.stopPropagation();
    Audio2.ensure();
    const ahora = await Voz.alternar();
    if (ahora) { Burbujas.decir('te escucho: di «hey ' + NAME + '»', { dur: 3.4 }); Audio2.sparkle(); }
    else { Burbujas.decir('vale, no escucho', { dur: 2.4 }); Audio2.pop(); }
    if (Voz.micPermiso === false) Burbujas.decir('necesito permiso de micrófono: míralo en los ajustes del navegador', { dur: 4.6 });
  }, { passive: true });
  function esperar(ms) { return new Promise((r) => setTimeout(r, ms)); }

  /* --- pilulita del oído: texto cuando cambia, barritas cada fotograma --- */
  function pintarOido() {
    if (!oidoEl) {
      oidoEl = document.getElementById('oido');
      oidoTxt = document.getElementById('oidoTexto');
      oidoBars = document.getElementById('oidoBars');
      if (!oidoEl) return;
    }
    const estado = Voz.estadoOido();
    const clase = estado === 'llamada' ? 'llamada' : (estado === 'oyendo' ? 'oyendo' : '');
    if (clase !== oidoClase) {
      oidoEl.classList.toggle('llamada', clase === 'llamada');
      oidoEl.classList.toggle('oyendo', clase === 'oyendo');
      oidoClase = clase;
    }
    const visible = estado !== 'off';
    if (visible === oidoEl.classList.contains('hidden')) oidoEl.classList.toggle('hidden', !visible);
    if (!visible) return;
    const txt = Voz.oidoTexto();
    if (txt !== oidoUltimo) { oidoUltimo = txt; oidoTxt.textContent = txt; }
    const sp = Voz.espectro;
    for (let i = 0; i < oidoBars.children.length; i++) {
      oidoBars.children[i].style.transform = 'scaleY(' + (0.18 + (sp[i] || 0) * 1.5).toFixed(2) + ')';
    }
  }

  /* --- pedir la cámara de forma natural: primero un gesto, y si no, se intenta igual --- */
  function pedirCamaraNatural() {
    if (pedidoPermisos) return;
    pedidoPermisos = true;
    Burbujas.decir('¿me dejas verte?', { dur: 5 });
    Anim.gestoAhora('curiosidad', { texto: null });
    Audio2.quien();
    Reflejos.mirar(0, -.05, 2400);
  }
  async function abrirCamara() {
    quiereCamara = true;
    const ok = await Camara.encender();
    if (ok) {
      Burbujas.decir(pick(['¡te veo!', '¡ahí estás!', '¡qué bien, ya te veo!']), { dur: 3 });
      Anim.gestoAhora('feliz', { texto: null });
      Audio2.feliz(); Haptica.alegria();
      Personas.resetPresencia();
      /* los modelos de manos se cargan cuando haga falta: en cuanto se detecte a alguien */
      Manos.pendiente = true;
    } else {
      // sin cámara: mecánicas visuales desactivadas, con elegancia
      Estado.camaraApagada = true;
      Burbujas.decir(pick(['no pasa nada, no te veo', 'sin cámaras, ¿eh? vale', 'me quedo sin ojos... pero te oigo']), { dur: 3.4 });
      Anim.gestoAhora('triste', { texto: null });
      Audio2.triste();
    }
    return ok;
  }
  async function permisosVoz() {
    Voz.init();
    if (!Voz.oidoSoportado()) {
      Burbujas.decir('este navegador no me deja usar el micro', { dur: 3.4 });
      return false;
    }
    Burbujas.decir('¿y me dejas escucharte?', { dur: 4 });
    Anim.gestoAhora('curiosidad', { texto: null });
    const bien = await Voz.pedirPermiso();          // UNA vez; el micro se abre solo al escuchar
    if (bien) { Burbujas.decir('¡ya puedo oírte! dale al micro y dime «hey ' + NAME + '»', { dur: 4.6 }); Audio2.sparkle(); }
    else { Burbujas.decir('vale, sin micro. Si quieres, dale al botón de la esquina', { dur: 4.2 }); }
    return bien;
  }
  function primerGesto() {
    if (primerGestoHecho) return;
    primerGestoHecho = true;
    Audio2.ensure();
    Entrada.pedirSensores();
    Wake.pedir();
    if (quiereCamara || !Estado.camaraApagada) { /* ya en marcha o denegado */ } else { }
    if (!Camara.activo && !Camara.denegado) {
      abrirCamara().then(() => setTimeout(() => { if (Voz.micEstado === 'desconocido') permisosVoz(); }, 1600));
    } else {
      setTimeout(() => { if (Voz.micEstado === 'desconocido') permisosVoz(); }, 1600);
    }
  }
  /* --- arranque --- */
  async function boot() {
    if (iniciado) return;
    iniciado = true;
    Dibujo.resize();
    /* ¿60, 90 o 120 Hz? se mide mientras se presenta, y si has pedido una tasa, se respeta */
    Rendimiento.medirPantalla().then(() => { if (FPS_PEDIDOS) Rendimiento.fijar(FPS_PEDIDOS); });
    /* el bucle arranca ya: así la presentación (bostezar, mirar, saludar) se ve desde el principio */
    ultimoT = now(); acumulador = 0; requestAnimationFrame(loop);
    /* estado inicial: ojos cerrados, respirando, casi a oscuras */
    Estado.durmiendo = true; Estado.sueno = .85; Estado.energia = .3; Estado.felicidad = .5;
    Estado.modo = 'durmiendo'; Estado.luz = .5;
    Dibujo.brillo = .28;
    Emocion.inyectar('dormido', 1200);
    Anim.setMovimiento('respirar', { intensidad: .22, vel: .55, lado: 1 });
    await Personas.cargarLista();
    Bateria.init();
    Entrada.init();
    document.addEventListener('pointerdown', primerGesto, { passive: true, once: false });
    await esperar(1500);
    /* se despierta solo: bostezo, parpadeo y mira alrededor */
    Emocion.dormir(false, 'inicio');
    Reflejos.parpadear();
    await esperar(1200);
    Reflejos.mirar(-.6, .1, 1600);
    await esperar(900);
    Reflejos.mirar(.6, -.1, 1600);
    await esperar(1400);
    Burbujas.decir('¡hola! soy ' + NAME, { dur: 3.4 });
    Voz.hablar('¡hola! soy ' + NAME, 'cariñoso');
    await esperar(2600);
    pedirCamaraNatural();
    /* la voz se pide un poquito después, y solo tras el primer toque (los navegadores lo exigen) */
    /* si nadie toca la pantalla, intentamos la cámara igualmente (algunos navegadores lo permiten) */
    setTimeout(() => { if (!Camara.activo && !Camara.denegado) abrirCamara(); }, 7000);
    /* recordatorio suave si sigue sin permiso */
    setTimeout(() => { if (!Camara.activo && !Camara.denegado && !Estado.camaraApagada) pedirCamaraNatural(); }, 26000);
    if (DEV) DevTest.iniciar();
  }
  /* --- bucle con fps adaptativo --- */
  function objetivoFps() {
    if (!visible) return 1;
    const hz = Rendimiento.hz;
    const tope = Rendimiento.topeFps;                       // fps que aguanta el móvil (hasta 120)
    const base = Estado.durmiendo ? Math.max(20, Math.round(hz * CFG.fps.dormido)) : Math.round(hz * CFG.fps.tranquilo);
    return Math.min(base, tope);        // dormido puede ir más lento: es a propósito (batería)
  }
  function loop(t) {
    requestAnimationFrame(loop);
    const dtMs = Math.min(80, t - ultimoT); ultimoT = t;
    if (dtMs <= 0) return;
    Rendimiento.tick(dtMs, t);
    fpsCont++; if (t - fpsT > 1000) { fpsT = t; fpsCont = 0; }
    const fps = objetivoFps();
    const intervalo = 1000 / fps;
    acumulador += dtMs;
    if (acumulador < intervalo) return;
    const dt = Math.min(.4, acumulador / 1000);       // tiempo real transcurrido: la animación va igual de fina
    acumulador = Math.max(0, acumulador - intervalo); // se conserva el resto: no se pierde ni un fotograma
    /* --- animación siempre fluida --- */
    Anim.tick(dt, t / 1000);
    Reflejos.tick(dt, t / 1000);
    FX.update(dt);
    Burbujas.update(dt);
    Dibujo.Movimiento.tick(dt);
    Actividades.tick(t);
    Suenos.tick(t);
    Dibujo.frame(dt, t / 1000);
    Suenos.dibujar(t / 1000);
    if (Foto.polaroid) Dibujo.setPolaroid(Foto.polaroid);
    /* --- cámara y visión (a su propio ritmo) --- */
    if (visible && Camara.activo) {
      if (t - tPerc > 1000) { tPerc = t; Camara.tick(t); capturas++; Percepcion.tick(t, dt); }
      if (t - tPers > CFG.ricon.cadaMs) { tPers = t; Personas.tick(t); }
      VisionActividad.tick(t);
      Manos.tick(t);
      /* ráfaga si hay una mano abierta clara */
      const abierta = (Manos.resultados || []).find((m) => m.gesto === 'abierta' && m.score > .62);
      if (abierta && !Estado.durmiendo) { Camara.rafaga(CFG.capture.rafagaMs); Manos.rafaga(true); setTimeout(() => Manos.rafaga(false), CFG.capture.rafagaMs); }
    }
    /* --- estado, voz y módulos lentos --- */
    if (t - tMood > 340) { tMood = t; actualizarMood(dt * 3); Emocion.tick(dt); Dialogo.tick(t); }
    if (t - tMic > 400) { tMic = t; Voz.tick(t); }
    if (t - tBat > 8000) { tBat = t; Bateria.revisar(); Audio2.setNocturno(contextoHora().noche && !Estado.durmiendo ? true : Estado.durmiendo); }
    if (visible && !Estado.durmiendo) Clima.tick(t);
    if (visible && Estado.presente && Manos.disponible === null && !Manos.cargando && Rendimiento.manos) Manos.cargar();   // modelos de visión: solo con alguien delante y si el móvil va bien
    /* --- HUD --- */
    const icono = Estado.durmiendo ? 'zZ' : Voz.estadoTexto();
    /* pilulita del oído: se ve, con barritas, que te está escuchando */
    pintarOido(t);
    if (hudMicro.textContent !== icono) hudMicro.textContent = icono;
    const encendido = !!Voz.escuchando && !Estado.durmiendo;
    if (hudMicro.classList.contains('on') !== encendido) hudMicro.classList.toggle('on', encendido);
    const titulo = Voz.micEstado === 'denegado' ? 'permiso de micrófono denegado'
      : (Voz.quiereEscuchar ? 'te escucho un ratito (toca para parar)' : 'no escucho (toca para hablar conmigo)');
    if (hudMicro.title !== titulo) hudMicro.title = titulo;
    if (DEV && t - tDev > 8000) { tDev = t; DevTest.escribe('fps ' + fpsCont + '/' + objetivoFps() + ' | pantalla ' + Rendimiento.hz + ' Hz | ' + Rendimiento.nivel + (Rendimiento.automatizacion ? '' : ' (tasa fija)') + ' | modo ' + Emocion.actual); }
  }
  /* --- ciclo de vida --- */
  function ocultar() {
    visible = false;
    Voz.escuchar(false);
    Audio2.ronroneo(false);
    Audio2.pararAlarma();
    Camara.apagar();
    Manos.limpiar();
  }
  function volver() {
    visible = true;
    if (quiereCamara && !Camara.denegado) Camara.encender();
    Voz.tick(now());                      // retoma el micro crudo (soplido) sin arrancar el reconocedor
    Rendimiento.reiniciar();              // y se vuelve a intentar la tasa máxima de la pantalla
    if (Estado.modo === 'emergencia') Bateria.revisar();
    Personas.resetPresencia();
  }
  return {
    boot, loop, ocultar, volver, pedirCamaraNatural, abrirCamara,
    get fps() { return fpsCont; }, get capturas() { return capturas; }
  };
})();

/* ==================================== 33. ARRANQUE Y SERVICE WORKER ==================================== */
(function arrancar() {
  /* evitar el zoom/rebote y el menú contextual en móvil */
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  /* guardar memoria al salir */
  window.addEventListener('pagehide', () => { LS.set('memoria', LS.get('memoria', [])); });
  /* en modo dev, cualquier fallo se ve en pantalla */
  window.addEventListener('error', (e) => { try { if (DEV) DevTest.escribe('⚠ ' + (e.message || 'error')); } catch (x) {} });
  window.addEventListener('unhandledrejection', (e) => {
    try { if (DEV) DevTest.escribe('⚠ promesa: ' + ((e.reason && (e.reason.message || e.reason)) || '?')); } catch (x) {}
  });
  /* registrar el service worker (offline) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
        if (DEV) DevTest.escribe('sw registrado: ' + (reg.active ? 'activo' : 'instalando'));
        reg.addEventListener('updatefound', () => {});
      }).catch(() => {});
      /* al volver a la pestaña, buscamos actualizaciones */
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
      });
    });
  }
  /* ¡vamos! */
  App.boot();
})();
</script>
