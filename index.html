    let opciones = d.item.slice();
    if (d.comida) {
      opciones = opciones.filter((i) => !gustos.asco.includes(i));      // nunca elige lo que le da asco
      if (chance(.7)) opciones = gustos.encantan.filter((i) => d.item.includes(i)).concat(opciones);
    }
    return pick(opciones.length ? opciones : d.item);
  }
  function gradoGusto(nombre, item) {
    if (!DEF[nombre] || !DEF[nombre].comida) return 1;
    if (gustos.encantan.includes(item)) return 1.6;
    if (gustos.asco.includes(item)) return -1;
    return .8;
  }
  function empezar(nombre, opts) {
    opts = opts || {};
    const s = Estado;
    if (!DEF[nombre]) return false;
    if (s.durmiendo) Emocion.dormir(false, 'actividad');
    if (s.actividad === nombre && !s.actividadPausada) { s.actividadDur = Math.max(s.actividadDur, DEF[nombre].dur * .6); return true; }
    const item = opts.item || elegirItem(nombre);
    s.actividad = nombre; s.actividadItem = item; s.actividadDur = opts.dur || DEF[nombre].dur;
    s.actividadGusto = gradoGusto(nombre, item);
    s.actividadPausada = false;
    s.actividadAuto = !!opts.auto;
    Objetos.sacar(item, { rapido: !!opts.auto });      // lo saca de su bolsillo con transición
    animar(nombre, item, true);
    if (nombre === 'comer') { s.ultimaComida = now(); s.saciedad = clamp(s.saciedad + .6, 0, 1); }
    if (nombre === 'beber') s.ultimaBebida = now();
    if (nombre === 'jugar') s.ultimoJuego = now();
    s.aburrimiento = 0;
    Memoria.apuntar('hice algo', { actividad: nombre });
    if (!opts.silencioso) Burbujas.decir(opts.texto || pick(['¡vamos allá!', '¡me apunto!', '¡mmm, qué rico!', '¡a jugar!', 'me pongo']), { dur: 2.2 });
    return true;
  }
  function animar(nombre, item, primera) {
    const d = DEF[nombre];
    if (d.comida && gradoGusto(nombre, item) < 0 && primera) {
      // le da asco
      Anim.gestoAhora('asco' in ESPEC.CAT ? 'triste' : 'triste', { texto: null });
      Burbujas.decir(pick(['¡puaj!', 'eso no me gusta', '¡qué asco!']), { dur: 2.4 });
      Audio2.asco(); Haptica.doble();
      Estado.felicidad = clamp(Estado.felicidad - .12, 0, 1);
      return;
    }
    if (d.comida && gradoGusto(nombre, item) > 1.2 && primera) {
      Burbujas.decir(pick(['¡mi favorito!', '¡mmmm!', '¡siii!']), { dur: 2.2 });
      Audio2.gorgorito(); Haptica.alegria();
    }
    if (primera) { Audio2.zoom(); }
    Anim.gestoAhora(d.cat, { texto: null, acc: 'ninguno' });   // el objeto lo dibuja Objetos (con su transición)
    if (nombre === 'ver' && chance(.3)) Burbujas.decir(pick(['¿qué vemos?', 'shhh, que empieza', '¡qué capítulo!']), { dur: 2.4 });
    if (nombre === 'jugar' && chance(.3)) Burbujas.decir(pick(['¡te gano!', '¡otra ronda!', '¡vamos!']), { dur: 2.2 });
  }
  function terminar(motivo) {
    const s = Estado;
    if (!s.actividad) return;
    Objetos.guardar();                                  // lo guarda por donde lo sacó
    const eraComida = DEF[s.actividad] && DEF[s.actividad].comida;
    s.actividad = null; s.actividadItem = null; s.actividadPausada = false;
    Anim.limpiarGestos();
    if (motivo === 'tu-orden') {
      Anim.gestoAhora(eraComida ? 'triste' : 'despedida', { texto: null });
      Burbujas.decir(eraComida ? pick(['...vale, paro', 'bueno... si tú lo dices']) : pick(['vale, lo dejo', '¡ya paro!']), { dur: 2.2 });
      Audio2.triste();
      s.felicidad = clamp(s.felicidad - (eraComida ? .2 : .06), 0, 1);
    } else if (motivo === 'tiempo') {
      Anim.gestoAhora(chance(.5) ? 'bostezo' : 'normal', { texto: null });
    }
    Memoria.apuntar('dejé de hacer algo', { actividad: motivo });
  }
  /* Cuidado: al pedir que deje de comer se pone triste; al decirle que puede comer, feliz. */
  function permitir(nombre) {
    Estado.felicidad = clamp(Estado.felicidad + .3, 0, 1);
    Estado.energia = clamp(Estado.energia + .1, 0, 1);
    Estado.orgullo = now();
    Anim.gestoAhora('felicidad', { texto: null });
    Burbujas.decir(pick(['¡¡bien!!', '¡siii, gracias!', '¡qué felicidad!']), { dur: 2.4 });
    Audio2.chillido(); Haptica.alegria();
    FX.G.corazones(Dibujo.centro().x, Dibujo.centro().y, 10, PALETA.amor.acc);
    if (nombre) setTimeout(() => empezar(nombre, { texto: '¡voy a por ello!' }), 900);
  }
  function tick(t) {
    const s = Estado;
    if (!s.actividad || s.actividadPausada) return;
    const d = DEF[s.actividad];
    if (!ultimaCadencia) ultimaCadencia = t;
    if (t - ultimaCadencia > d.cadencia * 1000) {
      ultimaCadencia = t;
      animar(s.actividad, s.actividadItem, false);
      if (d.comida && chance(.5)) FX.G.chispitas(Dibujo.centro().x + rnd(-20, 20), Dibujo.centro().y + Dibujo.u * 1.2, 2, PALETA.feliz.acc);
    }
    if (s.actividad === 'ver' && chance(.002)) FX.G.estrellas(Dibujo.centro().x + rnd(-60, 60), Dibujo.centro().y - Dibujo.u, 1, PALETA.sorpresa.acc);
    if (s.actividad === 'ejercicio' && chance(.004)) Dibujo.Movimiento.empujar(rnd(-30, 30), -40);
  }
  return {
    DEF, empezar, terminar, permitir, tick, gustos,
    get nombre() { return Estado.actividad ? DEF[Estado.actividad].nombre : null; },
    estaHaciendo: (n) => Estado.actividad === n,
    /* si ve la actividad en dos fotogramas seguidos, la imita; si deja de verla, la termina */
    detectar(actividad) {
      const s = Estado;
      s.actividadVisto = (s.actividadVisto || 0) + 1;
      if (s.actividad === actividad) { s.actividadDur = Math.max(s.actividadDur, DEF[actividad].dur * .5); return; }
      if (s.actividadVisto >= 2) empezar(actividad, { texto: pick(['¡yo también!', 'te copio', '¡me uno!']) });
      setTimeout(() => { s.actividadVisto = 0; }, 2400);
    },
    /* si no se ve en el siguiente fotograma, termina con su animación de salida */
    perdida() {
      if (Estado.actividad && !Estado.actividadPausada) terminar('visto');
    }
  };
})();

/* ==================================== 17b. TE VEO HACER ALGO (heurística baratita) ==================================== */
/* Con 1 fps y un blob no se puede saber si comes o bailas, pero sí ver si hay
   vaivén pequeño cerca de la cabeza, movimiento amplio del cuerpo o quietud.
   Si la pauta se repite en dos fotogramas seguidos la imita; si desaparece, lo deja. */
const VisionActividad = (() => {
  let hist = [], candidato = null, contador = 0, ultimoCambio = 0, sinVer = 0, ultimaImitacion = 0;
  function tick(t) {
    const s = Estado, an = Camara.analisis;
    if (s.durmiendo) { hist.length = 0; return; }
    if (!s.presente || !an.centro || an.media < .13 || (an.piel || 0) < .1) {
      hist.length = 0; candidato = null; contador = 0;
      /* si lo había imitado y ya no te ve, termina con su animación de salida */
      if (s.actividad && s.actividadAuto) { sinVer++; if (sinVer >= 4) { sinVer = 0; Actividades.terminar('visto'); } }
      return;
    }
    sinVer = 0;
    if (s.actividad && !s.actividadAuto) return;          // lo que le pediste tú manda
    hist.push({ t, y: an.centro.y, x: an.centro.x, m: an.movimiento || 0 });
    if (hist.length > 9) hist.shift();
    if (hist.length < 4) return;
    const ys = hist.map((h) => h.y);
    const rangoY = Math.max.apply(null, ys) - Math.min.apply(null, ys);
    const mov = hist.reduce((a, h) => a + h.m, 0) / hist.length;
    let act = null;
    if (rangoY > .17 && mov > .06) act = 'ejercicio';
    else if (rangoY > .045 && rangoY <= .17 && mov > .05) act = an.centro.y < .5 ? 'comer' : 'beber';
    else if (rangoY < .022 && mov < .03 && t - ultimoCambio > 8000) act = 'ver';
    if (!act) { candidato = null; contador = 0; return; }
    if (act !== candidato) { candidato = act; contador = 1; return; }
    contador++;
    if (contador < 3) return;                             // tres fotogramas seguidos: entonces sí, sin dudas
    if (t - ultimaImitacion < 60000) return;              // y como mucho una vez por minuto
    ultimaImitacion = t;
    contador = 0; ultimoCambio = t;
    if (s.actividad === act) { s.actividadDur = Math.max(s.actividadDur, 11); return; }
    if (s.actividad) return;
    Actividades.empezar(act, { auto: true, silencioso: chance(.5), texto: pick(['¡yo también!', 'te copio', '¡me apunto!']) });
    s.actividadAuto = true;
  }
  return { tick, limpiar() { hist.length = 0; candidato = null; } };
})();

/* ==================================== 18. FOTO INSTANTÁNEA (polaroid) ==================================== */
const Foto = (() => {
  let fase = 'quieto', pol = null, guardada = false, pidiendoGuardar = false;
  function esperar(ms) { return new Promise((res) => setTimeout(res, ms)); }
  async function tomar(opts) {
    if (fase !== 'quieto') return false;
    const s = Estado;
    if (s.durmiendo) Emocion.dormir(false, 'foto');
    fase = 'preparando';
    Anim.gestoAhora('foto', { texto: null });
    Audio2.zoom();
    Burbujas.decir(pick(['¡mira!', '¡una foto!', 'sonríe... o no']), { dur: 1.8 });
    await esperar(500);
    /* 1) cámara plana delante */
    Anim.gestoAhora('foto', { spec: ESPEC.generar('foto', { acc: 'camara', son: 'ninguno', mov: 'quieto', dur: 3.4 }) });
    await esperar(650);
    /* 2) flash + obturador */
    Dibujo.destello('#bff3ff', 320); Audio2.shot(); Haptica.disparo();
    const foto = capturar();
    /* 3) la cámara escupe la polaroid */
    pol = { x: Dibujo.W / 2, y: Dibujo.H * .62, rot: -.06, salto: 40, revelado: 0, foto, pie: NAME + ' · ' + fmtHora() };
    Dibujo.setPolaroid(pol);
    await esperar(280);
    Audio2.tono3(300, 700);
    /* 4) el robot la golpea con los ojos y la sacude */
    for (let i = 0; i < 4; i++) {
      Anim.pulso({ dy: 0, alto: .12 }, .28, 'out');
      Dibujo.Movimiento.empujar(rnd(-20, 20), 20);
      Haptica.suave();
      pol.salto += rnd(6, 14);
      await esperar(230);
    }
    fase = 'revelando';
    /* 5) se revela despacio */
    const t0 = now();
    await new Promise((res) => {
      const paso = () => {
        pol.revelado = clamp((now() - t0) / 4000, 0, 1);
        if (pol.revelado < 1) requestAnimationFrame(paso); else res();
      };
      paso();
    });
    if (!pol) return false;
    fase = 'preguntando';
    Burbujas.decir('¿la guardo?', { dur: 4 });
    Dialogo.decir('¿la guardo de recuerdo?', { tono: 'cariñoso' });
    await new Promise((res) => {
      pidiendoGuardar = true;
      mostrarHoja('¿guardo la foto?', 'sí / no / descargar', (v) => { resolverGuardar(v, res); }, [
        { txt: 'sí, guárdala', fn: () => resolverGuardar('sí', res) },
        { txt: 'no', fn: () => resolverGuardar('no', res) },
        { txt: 'descargar', fn: () => resolverGuardar('descargar', res) }
      ]);
      setTimeout(() => { Hoja.cerrar(); resolverGuardar(null, res); }, 14000);   // si no responde, sigue a lo suyo
    });
    return true;
  }
  function capturar() {
    const w = 480, h = 600;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#050a0d'; g.fillRect(0, 0, w, h);
    const v = Camara.video;
    if (v && v.videoWidth) {
      // recorte central con la proporción de la polaroid
      const vw = v.videoWidth, vh = v.videoHeight;
      const esc = Math.max(w / vw, h / vh);
      const dw = vw * esc, dh = vh * esc;
      g.save(); g.translate((w - dw) / 2, (h - dh) / 2); g.scale(-1, 1); g.drawImage(v, -dw, 0, dw, dh); g.restore();
      g.globalAlpha = .16; g.fillStyle = '#0a2230'; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
    } else {
      // sin cámara: dibujamos un autorretrato plano de Chispi
      g.fillStyle = PALETA.normal.ojo;
      for (const x of [w * .34, w * .66]) { g.beginPath(); g.arc(x, h * .45, 46, 0, TAU); g.fill(); }
      g.fillStyle = PALETA.normal.acc; g.font = '600 26px system-ui'; g.textAlign = 'center';
      g.fillText('(sin cámara)', w / 2, h * .78);
    }
    return c;
  }
  function resolverGuardar(v, res) {
    if (!pidiendoGuardar) return;                 // evita dobles respuestas
    pidiendoGuardar = false;
    const val = String(v || '').toLowerCase();
    const siono = val === 'sí' || val === 'si' || val === 's' || val === 'yes' || /guárd|guard/.test(val);
    const descargar = val === 'descargar' || /download|archivo/.test(val);
    const no = !siono && !descargar;
    if (!v) {
      Burbujas.decir('ya decidirás luego', { dur: 2.4 });
      const p = pol; pol = null;
      setTimeout(() => { if (!pol) Dibujo.setPolaroid(null); }, 2600);
    }
    if (no && v) {
      // la tira con una animación graciosa
      Anim.gestoAhora('picaro', { texto: null }); Audio2.gorgojo();
      const p = pol; pol = null;
      if (p) {
        let t = 0;
        const anim = () => {
          t += .016; p.x += 12; p.y -= 9; p.rot += .22; p.salto = -t * 4;
          if (p.x < Dibujo.W + 300) requestAnimationFrame(anim); else Dibujo.setPolaroid(null);
        };
        Dibujo.setPolaroid(p); anim();
      }
      Burbujas.decir(pick(['¡fuera!', '¡adiós foto!']), { dur: 2 });
    } else if (siono || descargar) {
      guardar(pol, descargar);
    }
    if (res) setTimeout(res, 300);
    setTimeout(() => { fase = 'quieto'; }, 900);
  }
  async function guardar(p, descargar) {
    if (!p || !p.foto) { fase = 'quieto'; return; }
    try {
      const blob = await new Promise((res) => p.foto.toBlob(res, 'image/png', .92));
      if (blob) {
        // 1) dentro de la app (IndexedDB)
        await DB.set('photos', { id: uid(), creado: now(), pie: p.pie, blob, quien: Estado.nombreVisitante || null });
        Estado.orgullo = now();
        Burbujas.decir('¡guardada en mi álbum!', { dur: 2.8 });
        Anim.gestoAhora('orgulloso', { texto: null }); Audio2.estrella(); Haptica.alegria();
        Memoria.apuntar('me hizo una foto', {});
        // 2) a la galería del móvil, como se pueda
        await aGaleria(blob, p.pie, descargar);
      }
    } catch (e) { Burbujas.decir('uy, no he podido...', { dur: 2.4 }); Anim.gestoAhora('verguenza', { texto: null }); }
    Dibujo.setPolaroid(null); pol = null;
    setTimeout(() => { fase = 'quieto'; }, 1200);
  }
  async function aGaleria(blob, pie, forzar) {
    const nombre = (NAME + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.png');
    const file = new File([blob], nombre, { type: 'image/png' });
    // File System Access (Chrome/Android)
    if (window.showSaveFilePicker && forzar) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: nombre, types: [{ description: 'PNG', accept: { 'image/png': ['.png'] } }] });
        const w = await h.createWritable(); await w.write(blob); await w.close();
        Burbujas.decir('¡y a tu galería!', { dur: 2.2 }); return;
      } catch (e) {}
    }
    // Web Share (iOS y Android)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: NAME, text: pie || '' }); Burbujas.decir('¡compartida!', { dur: 2 }); return; } catch (e) {}
    }
    // Descarga directa como último recurso
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {}
  }
  async function album() {
    const fotos = await DB.all('photos');
    if (!fotos.length) { Burbujas.decir('no tengo fotos todavía', { dur: 2.6 }); Anim.gestoAhora('triste', { texto: null }); return 0; }
    Burbujas.decir('tengo ' + fotos.length + (fotos.length === 1 ? ' foto' : ' fotos') + ' guardadas', { dur: 3.2 });
    Anim.gestoAhora('orgulloso', { texto: null });
    return fotos.length;
  }
  return { tomar, capturar, guardar, album, get fase() { return fase; }, get polaroid() { return pol; }, resolverGuardar, get preguntando() { return pidiendoGuardar; } };
})();

/* ==================================== 19. BATERÍA ==================================== */
const Bateria = (() => {
  let bat = null, cont = null, avisado20 = false, avisado8 = false, ultimoAviso = 0;
  const el = document.getElementById('battery'), fill = document.getElementById('batFill'), pct = document.getElementById('batPct');
  function pintar() {
    if (!bat) return;
    const n = clamp(bat.level, 0, 1);
    el.classList.add('on');
    el.classList.toggle('low', n <= .2 && !bat.charging);
    el.classList.toggle('verylow', n <= .08 && !bat.charging);
    el.classList.toggle('charging', bat.charging);
    fill.setAttribute('width', (23 * n).toFixed(1));
    pct.textContent = Math.round(n * 100) + '%' + (bat.charging ? ' ⚡' : '');
  }
  async function init() {
    if (!navigator.getBattery) return false;      // si no existe, sin icono
    try {
      bat = await navigator.getBattery();
      Estado.bateria = { nivel: bat.level, cargando: bat.charging };
      Estado.cargando = bat.charging;
      pintar();
      bat.addEventListener('levelchange', () => { Estado.bateria.nivel = bat.level; pintar(); revisar(); });
      bat.addEventListener('chargingchange', () => {
        Estado.bateria.cargando = bat.charging; Estado.cargando = bat.charging; pintar();
        if (bat.charging) alCargar(); else revisar();
      });
      cont = true;
      return true;
    } catch (e) { return false; }
  }
  function revisar() {
    if (!bat) return;
    const n = bat.level, ahora = now();
    if (bat.charging) return;
    if (n <= .2 && !avisado20) { avisado20 = true; avisar20(); }
    if (n > .25) avisado20 = false;
    if (n <= .08) {
      if (ahora - ultimoAviso > 60000) { ultimoAviso = ahora; emergencia(); }
      Estado.modo = 'emergencia';
    } else if (Estado.modo === 'emergencia' && n > .12) {
      Estado.modo = 'despierto';
      Audio2.pararAlarma();
    }
  }
  function avisar20() {
    if (Estado.durmiendo) return;
    Anim.gestoAhora('preocupadoBAJO' in ESPEC.CAT ? 'nervioso' : 'curiosidad', { texto: null });
    Burbujas.decir(pick(['me queda poca pila...', 'eh, ¿me enchufas?', '¡me estoy apagando!']), { dur: 3 });
    Audio2.bajaBat(); Haptica.doble();
    Reflejos.mirar(.9, -.8, 2000);          // mira al indicador de batería
  }
  /* Batería muy baja: si el móvil se apaga, él "muere". Nervioso, sudor, temblor, alarma suave. */
  function emergencia() {
    const s = Estado;
    if (s.durmiendo) Emocion.dormir(false, 'peligro');
    s.miedo = clamp(s.miedo + .5, 0, 1); s.modo = 'emergencia';
    Anim.gestoAhora('emergencia', { texto: null });
    Audio2.alarma(true);
    Haptica.alarma();
    Burbujas.decir(pick(['¡no me dejes morir!', '¡enchúfame, por favor!', '¡me muero, me muero!']), { dur: 3.4 });
    Reflejos.mirar(.85, -.75, 2400);
    FX.G.sudor(Dibujo.centro().x - Dibujo.u * .8, Dibujo.centro().y - Dibujo.u, 4, PALETA.miedo.acc);
    const id = setInterval(() => {
      if (!bat || bat.charging || bat.level > .12) { clearInterval(id); return; }
      Anim.pulso({ temblor: .3, cejaY: .4 }, .5, 'out');
      FX.G.sudor(Dibujo.centro().x + rnd(-60, 60), Dibujo.centro().y - Dibujo.u * 1.2, 2, PALETA.miedo.acc);
      Reflejos.mirar(.85, -.75, 1200);
      Haptica.temblor();
    }, 6000);
  }
  function alCargar() {
    Audio2.pararAlarma();
    Estado.modo = 'despierto';
    Estado.miedo = 0; Estado.orgullo = now();
    Estado.felicidad = clamp(Estado.felicidad + .35, 0, 1);
    Anim.gestoAhora('felicidad', { texto: null });
    Burbujas.decir(pick(['¡¡vivo!!', '¡gracias! ¡estoy cargando!', '¡qué alivio!']), { dur: 3.2 });
    Audio2.cargando(); Haptica.alegria();
    FX.G.corazones(Dibujo.centro().x, Dibujo.centro().y, 8, PALETA.feliz.acc);
    Memoria.apuntar('me enchufó', {});
    Personas.tocar(.3);
  }
  return { init, revisar, get bat() { return bat; } };
})();

/* ==================================== 20. CLIMA Y LLUVIA ==================================== */
const Clima = (() => {
  let ultima = 0, pedido = false, permiso = null, micLluvia = 0;
  async function porUbicacion() {
    if (!navigator.geolocation) return false;
    return new Promise((res) => {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const { latitude: la, longitude: lo } = pos.coords;
          const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + la.toFixed(3) + '&longitude=' + lo.toFixed(3) + '&current=weather_code,is_day,precipitation,temperature_2m,wind_speed_10m&timezone=auto');
          const j = await r.json();
          const w = j && j.current; if (!w) { res(false); return; }
          aplicar(w.weather_code, w.precipitation, w.is_day, w.temperature_2m);
          res(true);
        } catch (e) { res(false); }
      }, () => { permiso = false; res(false); }, { maximumAge: 600000, timeout: 8000 });
    });
  }
  function aplicar(code, precip, isDay, temp) {
    let desc = 'despejado';
    if (code == null) return;
    if (code >= 95) desc = 'tormenta';
    else if (code >= 80) desc = 'chubascos';
    else if (code >= 61) desc = 'lluvia';
    else if (code >= 51) desc = 'llovizna';
    else if (code >= 45) desc = 'niebla';
    else if (code >= 1) desc = 'nubes';
    if (code >= 71 && code <= 77) desc = 'nieve';
    const llueve = /lluvia|chubascos|tormenta/.test(desc);
    const cambio = llueve !== Estado.llueve;
    Estado.llueve = llueve; Estado.climaDescrito = desc;
    Dibujo.lluvia(llueve, desc === 'tormenta' ? .95 : .6);
    Audio2.lluvia(llueve, desc === 'tormenta' ? .9 : .55);
    if (llueve && cambio && !Estado.durmiendo) {
      Anim.gestoAhora(pick(['asustarse', 'lluvia']), { texto: null });
      Burbujas.decir(desc === 'tormenta' ? pick(['¡ay, tormenta!', '¡uf, qué miedo!']) : pick(['está lloviendo...', 'me mojo...', '¿oigo lluvia?']), { dur: 3 });
      Audio2.susurro(); Haptica.suave();
      Memoria.apuntar('llovía', {});
      if (desc === 'tormenta' && chance(.5)) { Audio2.miedo(); Estado.miedo = clamp(Estado.miedo + .35, 0, 1); }
    }
    if (!llueve && cambio) Dibujo.lluvia(false, 0);
  }
  /* Lluvia por micrófono: ruido ancho y sostenido (heurística suave) */
  function porMicro(energiaAncha, planitud) {
    if (energiaAncha > .22 && planitud > .55) micLluvia = clamp(micLluvia + .25, 0, 1);
    else micLluvia = clamp(micLluvia - .1, 0, 1);
    if (micLluvia > .8 && !Estado.llueve && Estado.luz < .5) {
      Estado.llueve = true; Estado.climaDescrito = 'lluvia (la oigo)';
      Dibujo.lluvia(true, .6); Audio2.lluvia(true, .5);
      if (!Estado.durmiendo) { Anim.gestoAhora('lluvia', { texto: null }); Burbujas.decir('¿oigo lluvia?', { dur: 2.6 }); }
      micLluvia = .3;
    } else if (micLluvia < .1 && Estado.climaDescrito === 'lluvia (la oigo)') {
      Estado.llueve = false; Dibujo.lluvia(false, 0); Audio2.lluvia(false, 0);
    }
  }
  async function tick(t) {
    if (t - ultima < 15 * 60000) return;
    ultima = t;
    if (permiso === false) return;
    const ok = await porUbicacion();
    if (!ok) permiso = permiso === null ? false : permiso;
  }
  return { tick, aplicar, porMicro, get desc() { return Estado.climaDescrito; } };
})();

/* ==================================== 21. MEMORIA (breve, en el dispositivo) ==================================== */
const Memoria = (() => {
  let hoy = LS.get('memoria', []);        // {t, tipo, texto}
  let conversacion = [];                   // últimos turnos de diálogo (para el contexto de la IA)
  function apuntar(tipo, datos) {
    hoy.push({ t: now(), tipo, datos: datos || {} });
    if (hoy.length > CFG.memoriaMax) hoy = hoy.slice(-CFG.memoriaMax);
    LS.set('memoria', hoy);
  }
  function resumen() {
    const hoyMs = Date.now() - 86400000;
    const ult = hoy.filter((h) => new Date(h.t).getTime() > 0).slice(-14);
    const palabras = ult.map((h) => {
      if (h.tipo === 'hice algo') return 'hice ' + (h.datos.actividad || 'algo');
      if (h.tipo === 'dejé de hacer algo') return 'dejé ' + (h.datos.actividad || 'algo');
      if (h.tipo === 'me hizo una foto') return 'me hizo una foto';
      if (h.tipo === 'me enchufó') return 'me enchufó';
      if (h.tipo === 'caricias') return 'me acarició';
      if (h.tipo === 'me habló') return 'hablamos de ' + String(h.datos.texto || '').slice(0, 40);
      if (h.tipo === 'llovía') return 'llovía';
      if (h.tipo === 'me olvidó') return 'olvidó a ' + (h.datos.nombre || 'alguien');
      return null;
    }).filter(Boolean);
    return palabras.slice(-6).join(', ') || 'nada todavía';
  }
  function turno(quien, texto) {
    conversacion.push({ quien, texto: String(texto || '').slice(0, 140) });
    if (conversacion.length > 12) conversacion = conversacion.slice(-12);
  }
  return { apuntar, resumen, turno, get conversacion() { return conversacion; }, limpiar() { hoy = []; LS.set('memoria', []); } };
})();

/* ==================================== 22. VOZ (oído propio: micrófono + servidor) ==================================== */
/* AQUÍ NO SE USA SpeechRecognition (ni webkitSpeechRecognition). Ese servicio del
   navegador era lo que hacía saltar el aviso "Reconocimiento y síntesis de voz de
   Google cannot record now...". Ahora el oído es nuestro de principio a fin:
     1) se abre el micrófono con getUserMedia SOLO mientras escucha;
     2) se mide el nivel de voz (y el soplido) con un analizador;
     3) cuando hablas, se graba un trocito y se manda a /api/escuchar, que transcribe
        en el servidor (la clave de IA nunca sale de ahí);
     4) si no dices nada, no se manda nada y no pasa absolutamente nada.
   El permiso se pide una única vez y el micrófono se cierra en cuanto se apaga. */
const Voz = (() => {
  const OIDO_URL = '/api/escuchar';
  const UMBRAL_VOZ = .05;          // a partir de aquí se considera que hablas
  const UMBRAL_FIN = .025;         // por debajo: silencio
  const SILENCIO_MS = 800;         // silencio para cerrar el trocito
  const MAX_TROZO_MS = 7000;       // trocito máximo
  const MIN_BYTES = 1500;          // trocitos más pequeños ni se envían

  let quiero = false;              // el botón del micro está encendido
  let estadoMic = 'desconocido';   // desconocido | concedido | denegado
  let sesionHasta = 0;             // fin del "ratito" de escucha
  let stream = null, abriendo = false, ac = null, fuente = null, analizador = null, buf = null;
  let nivel = 0, nivelSuave = 0, espectro5 = [0, 0, 0, 0, 0];
  let grabador = null, trozos = [], grabando = false, tTrozo = 0, ultimaVozMs = 0, ultimoEnvio = 0;
  let enviando = false, transcribiendo = false, ultimaOida = 0, ultimoTextoOido = '';
  let hablando = false, pausaHasta = 0, vozElegida = null, ttsToken = 0;
  let ultimoAnalisis = 0, ultimaEnergia = 0, ultimoBlow = 0, avisadoSilencio = false, avisadoSinIA = false;
  let ultimoFallo = 0, fallos = 0;

  const hayGrabadora = () => typeof window.MediaRecorder !== 'undefined';
  const hayMicro = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const oidoSoportado = () => hayMicro() && hayGrabadora();
  const reconocimientoSoportado = () => oidoSoportado();   // nombre antiguo, mismo significado
  const soportado = () => oidoSoportado() || !!(window.AudioContext || window.webkitAudioContext);
  const pausado = () => now() < pausaHasta || hablando;

  /* ---------------- permiso: UNA sola vez ---------------- */
  async function pedirPermiso() {
    if (estadoMic === 'concedido') return true;
    if (estadoMic === 'denegado') return false;
    if (!hayMicro()) { estadoMic = 'denegado'; return false; }
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach((t) => t.stop());       // soltamos el micro: se abrirá solo al escuchar
      estadoMic = 'concedido';
      return true;
    } catch (e) { estadoMic = 'denegado'; return false; }
  }

  /* ---------------- abrir / cerrar el micrófono ---------------- */
  async function abrirMicro() {
    if (stream || abriendo || estadoMic === 'denegado' || !hayMicro()) return;
    abriendo = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      ac = Audio2.ensure();
      if (ac) {
        try {
          fuente = ac.createMediaStreamSource(stream);
          analizador = ac.createAnalyser();
          analizador.fftSize = 512; analizador.smoothingTimeConstant = .55;
          fuente.connect(analizador);
          buf = new Uint8Array(analizador.frequencyBinCount);
        } catch (e) { analizador = null; }
      }
      estadoMic = 'concedido';
    } catch (e) {
      stream = null;
      const n = String((e && e.name) || '');
      if (n === 'NotAllowedError' || n === 'SecurityError') {
        estadoMic = 'denegado'; quiero = false;
        Burbujas.decir('me has dicho que no al micro. Si cambias de idea, dale al botón de la esquina', { dur: 4 });
      } else if (n === 'NotReadableError') {
        Burbujas.decir('tu micro está ocupado por otra aplicación', { dur: 3 });
      }
    }
    abriendo = false;
  }
  function cerrarMicro() {
    try { if (grabador) { grabando = false; grabador.stop(); } } catch (e) {}
    grabador = null; trozos = []; grabando = false;
    try { if (fuente) fuente.disconnect(); } catch (e) {}
    try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    stream = null; fuente = null; analizador = null; buf = null;
    nivel = 0; nivelSuave = 0; espectro5 = [0, 0, 0, 0, 0];
  }

  /* ---------------- analizar: nivel, espectro y soplido ---------------- */
  function analizarMic() {
    if (!analizador || !buf) return null;
    analizador.getByteFrequencyData(buf);
    const n = buf.length;
    let baja = 0, alta = 0, total = 0, log = 0;
    /* 5 barritas para la pilulita: repartidas por la banda de la voz */
    const cubos = [0, 0, 0, 0, 0], cuboN = [0, 0, 0, 0, 0];
    for (let i = 0; i < n; i++) {
      const v = buf[i] / 255;
      total += v;
      if (i < n * .18) baja += v; else if (i > n * .45) alta += v;
      log += Math.log(v + .001);
      if (i < n * .55) {
        const k = Math.min(4, Math.floor((i / (n * .55)) * 5));
        cubos[k] += v; cuboN[k]++;
      }
    }
    const energia = total / n;
    const planitud = Math.exp(log / n) / (energia + .0001);
    nivel = clamp(energia, 0, 1);
    nivelSuave = nivelSuave * .7 + nivel * .3;
    espectro5 = cubos.map((c, i) => clamp((c / Math.max(1, cuboN[i])) * 2.1, 0, 1));

    /* soplido: agudos muy por encima de los graves, con subida brusca */
    const soplido = alta / (baja + .05) > 2.1 && energia > .12 && energia > ultimaEnergia * 1.35;
    ultimaEnergia = energia;
    if (soplido && now() - ultimoBlow > 3500 && energia < .55) {
      ultimoBlow = now();
      if (Estado.durmiendo) {
        Emocion.dormir(false, 'soplido');
        Burbujas.decir(pick(['¡fiuuu! ¿me has soplado?', '¡uy, qué vientooo!', '¿me despeinas?']), { dur: 2.8, urgente: true });
        Audio2.whoosh(true); Audio2.sorpresa();
      } else {
        Anim.gestoAhora('sorpresa', { texto: null });
        Anim.pulso({ escala: .08, temblor: .25 }, .7, 'out');
        Burbujas.decir(pick(['¡me despeinas!', '¡fiuuu!', '¡qué viento!', '¡uy, sopla!']), { dur: 2.4 });
        Audio2.whoosh(true); Audio2.hipo(); Haptica.suave();
        Estado.susto = now(); Estado.novedad = now();
        FX.G.polvo(Dibujo.centro().x, Dibujo.centro().y, 8, PALETA.curioso.acc);
      }
    }
    Clima.porMicro(energia, planitud);
    return { energia, planitud };
  }

  /* ---------------- grabar un trocito y mandarlo a transcribir ---------------- */
  function mimeBueno() {
    if (!hayGrabadora()) return '';
    const opciones = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    for (const m of opciones) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
    return '';
  }
  function empezarTrozo() {
    if (grabando || !stream || !hayGrabadora() || enviando || transcribiendo) return;
    if (now() - ultimoEnvio < 700) return;
    let g = null;
    try {
      const m = mimeBueno();
      g = m ? new MediaRecorder(stream, { mimeType: m, audioBitsPerSecond: 32000 }) : new MediaRecorder(stream);
    } catch (e) { g = null; }
    if (!g) return;
    grabador = g; trozos = [];
    g.ondataavailable = (e) => { if (e.data && e.data.size) trozos.push(e.data); };
    g.onstop = () => {
      const tipo = (g && g.mimeType) || 'audio/webm';
      const blob = new Blob(trozos, { type: tipo });
      grabador = null; trozos = [];
      mandarTrozo(blob);
    };
    try { g.start(); } catch (e) { grabador = null; return; }
    grabando = true; tTrozo = now(); ultimaVozMs = now();
  }
  function cerrarTrozo() {
    if (!grabando || !grabador) return;
    grabando = false; ultimoEnvio = now();
    try { grabador.stop(); } catch (e) {}
  }
  function aBase64(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1] || '');
      fr.onerror = () => rej(new Error('lectura'));
      fr.readAsDataURL(blob);
    });
  }
  async function mandarTrozo(blob) {
    if (!blob || blob.size < MIN_BYTES) return;            // nada de mandar silencio
    if (document.hidden) return;
    transcribiendo = true;
    try {
      const b64 = await aBase64(blob);
      if (b64.length > 3.4 * 1024 * 1024) return;
      const r = await fetch(OIDO_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ audio: b64, mime: blob.type || 'audio/webm' })
      });
      const j = await r.json().catch(() => null);
      if (j && j.ok) {
        fallos = 0;
        recibido(j.texto, !!j.llamada, !!j.ruido);
      } else if (j && (j.error === 'no_key' || j.error === 'sin_oido')) {
        if (!avisadoSinIA) {
          avisadoSinIA = true;
          Burbujas.decir('te oigo, pero mi servidor no tiene clave de IA para entender palabras', { dur: 4.4 });
        }
      } else {
        fallos++; ultimoFallo = now();
      }
    } catch (e) {
      fallos++; ultimoFallo = now();
      if (fallos === 3) Burbujas.decir('no consigo oírte bien con esta conexión', { dur: 3 });
    }
    transcribiendo = false;
  }
  /* lo que ha dicho, ya en texto */
  function recibido(texto, llamada, ruido) {
    ultimoTextoOido = String(texto || '');
    if (ruido || !ultimoTextoOido) return;                 // ruido: no pasa nada, ni una burbuja
    const estaba = Dialogo.activo;
    /* si ha hablado, se le sigue escuchando un ratito más */
    sesionHasta = Math.max(sesionHasta, now() + 9000);
    avisadoSilencio = false;
    Dialogo.oir(ultimoTextoOido, true);
    const esLlamada = llamada || !estaba && Dialogo.activo;
    if (esLlamada) {
      /* ¡te ha llamado! aquí el "¡ostias, me está escuchando!" */
      ultimaOida = now();
      sesionHasta = now() + 20000;
      Audio2.sparkle(); Audio2.estrella();
      Anim.gestoAhora('curiosidad', { texto: null });
      Anim.pulso({ escala: .07, parpI: 1, parpD: 1 }, .5, 'out');
      Reflejos.mirar(0, -.25, 900);
      const c = Dibujo.centro();
      FX.G.estrellas(c.x, c.y, 7, (PALETA[Emocion.actual] || PALETA.normal).acc);
      Haptica.suave();
    }
  }

  /* ---------------- hablar (voz aguda y tierna) ---------------- */
  function elegirVoz() {
    if (vozElegida) return vozElegida;
    try {
      const voces = speechSynthesis.getVoices() || [];
      const es = voces.filter((v) => /^es/i.test(v.lang));
      const pref = [/mónica|monica|helena|female|mujer|marisol|elvira|lucía|lucia|paulina|sabina/i];
      vozElegida = es.find((x) => pref.some((r) => r.test(x.name))) || es.find((x) => /es-ES/i.test(x.lang)) || es[0] || null;
    } catch (e) { vozElegida = null; }
    return vozElegida;
  }
  if ('speechSynthesis' in window) {
    try { speechSynthesis.onvoiceschanged = () => { vozElegida = null; elegirVoz(); }; } catch (e) {}
    elegirVoz();
  }
  function hablar(texto, tono, opts) {
    if (!texto) return;
    tono = tono || 'neutral';
    const cfg = {
      neutral:    { p: 1.55, r: 1.03, v: .95 },
      cariñoso:   { p: 1.62, r: .98,  v: .9 },
      jugueton:   { p: 1.75, r: 1.12, v: 1 },
      enfadado:   { p: 1.25, r: 1.12, v: 1 },
      triste:     { p: 1.35, r: .9,   v: .8 },
      emocionado: { p: 1.85, r: 1.16, v: 1 },
      susurro:    { p: 1.5,  r: .92,  v: .45 }
    }[tono] || { p: 1.55, r: 1.03, v: .95 };
    parloteo(texto, tono);
    if (!('speechSynthesis' in window) || (opts && opts.mudo)) return;
    try {
      pausar(400);                              // mientras habla, no se escucha a sí mismo
      try { speechSynthesis.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(String(texto).slice(0, 220));
      const v = elegirVoz(); if (v) u.voice = v;
      u.lang = LANG;
      u.pitch = clamp(cfg.p + rnd(-.05, .05), .1, 2);
      u.rate = clamp(cfg.r + rnd(-.03, .03), .5, 1.8);
      u.volume = cfg.v * (contextoHora().noche ? .7 : 1);
      u.onstart = () => { hablando = true; };
      u.onend = () => { hablando = false; pausaHasta = now() + 420; };
      u.onerror = () => { hablando = false; pausaHasta = now() + 420; };
      speechSynthesis.speak(u);
    } catch (e) { hablando = false; }
  }
  /* animación de boca mientras "habla" (sirve también si no hay TTS) */
  function parloteo(texto, tono) {
    const token = ++ttsToken;
    const silabas = Math.max(2, Math.round(String(texto).split(/\s+/).length * 2.2));
    let i = 0;
    const paso = () => {
      if (token !== ttsToken) return;
      const alto = tono === 'susurro' ? .18 : rnd(.25, .8);
      Anim.pulso({ bocaA: alto, boca: .1 }, rnd(.09, .16), 'out');
      if (chance(.18)) Audio2.nya(rnd(700, 1100), 0, .06);
      i++;
      if (i < silabas) setTimeout(paso, rnd(70, 130));
    };
    paso();
  }
  function pausar(ms) { pausaHasta = Math.max(pausaHasta, now() + (ms || 1200)); }

  /* ---------------- encender / apagar la escucha ---------------- */
  async function escuchar(on) {
    quiero = !!on;
    if (quiero) {
      const ok = await pedirPermiso();
      if (!ok) { quiero = false; return false; }
      sesionHasta = now() + (CFG.voz.sesion || 20000);
      avisadoSilencio = false;
      abrirMicro();
      return true;
    }
    sesionHasta = 0;
    cerrarMicro();
    return true;
  }
  function alternar() { return escuchar(!quiero); }

  /* ---------------- latido ---------------- */
  function tick(t) {
    if (!quiero && !Estado.durmiendo) {
      if (stream) cerrarMicro();
      return;
    }
    /* 0) se acabó el ratito: se apaga solo y sin ruido */
    if (quiero && sesionHasta && t > sesionHasta && !grabando && !transcribiendo) {
      escuchar(false);                    // se apaga en silencio: si no dices nada, no pasa nada
      avisadoSilencio = true;
      return;
    }
    /* 1) el micro se abre solo cuando hace falta (escucha, o dormido para el soplido) */
    const dormidoSoplido = Estado.durmiendo && Estado.soplidoActivo !== false && estadoMic === 'concedido';
    if (!stream && !abriendo && (quiero || dormidoSoplido)) abrirMicro();
    if (!stream) return;
    /* 2) analizar el nivel */
    const cada = quiero ? 110 : 400;
    if (t - ultimoAnalisis < cada) return;
    ultimoAnalisis = t;
    analizarMic();
    /* si te oye la voz, sigue escuchando otro poquito: no se corta a mitad de frase */
    if (nivelSuave > UMBRAL_VOZ) sesionHasta = Math.max(sesionHasta, t + 6000);
    if (!quiero || document.hidden || pausado()) return;
    /* 3) abrir y cerrar trocitos según la voz */
    if (!grabando) {
      if (nivelSuave > UMBRAL_VOZ && t - ultimoEnvio > 700) empezarTrozo();
      return;
    }
    if (nivelSuave > UMBRAL_VOZ) ultimaVozMs = t;
    const callado = nivelSuave < UMBRAL_FIN && t - ultimaVozMs > SILENCIO_MS;
    if (callado || t - tTrozo > MAX_TROZO_MS) cerrarTrozo();
  }

  /* ---------------- lo que se ve en la pilulita ---------------- */
  function estadoOido() {
    if (Estado.durmiendo) return 'dormido';
    if (!quiero) return 'off';
    if (now() - ultimaOida < 3000) return 'llamada';     // ¡te ha llamado! esto manda sobre todo lo demás
    if (transcribiendo) return 'pensando';
    if (grabando || nivelSuave > UMBRAL_VOZ) return 'oyendo';
    return 'escucho';
  }
  function oidoTexto() {
    return {
      dormido: 'zZ · sopla para despertarme',
      escucho: 'te estoy escuchando… di «hey ' + NAME + '»',
      oyendo: '¡te oigo! sigue hablando',
      pensando: 'a ver qué me has dicho…',
      llamada: '¡te he oído! dime, te escucho',
      off: ''
    }[estadoOido()] || '';
  }
  function estadoTexto() {
    if (estadoMic === 'denegado') return '⊘';
    if (transcribiendo) return '…';
    if (quiero) return '♪';
    return '⊘';
  }
  function init() { return oidoSoportado(); }

  return {
    init, escuchar, alternar, hablar, parloteo, pausar, analizarMic, pedirPermiso, tick,
    estadoTexto, oidoTexto, estadoOido, oidoSoportado, soportado, reconocimientoSoportado, elegirVoz,
    get escuchando() { return quiero && !!stream; },
    get hablando() { return hablando; },
    get transcribiendo() { return transcribiendo; },
    get escuchandoAhora() { return grabando; },
    get micPermiso() { return estadoMic === 'concedido' ? true : (estadoMic === 'denegado' ? false : null); },
    get micEstado() { return estadoMic; },
    get quiereEscuchar() { return quiero; },
    get nivel() { return nivelSuave; },
    get espectro() { return espectro5; },
    get ultimoOido() { return ultimoTextoOido; },
    get crudoActivo() { return !!stream; }
  };
})();

/* ==================================== 23. IA (proxy del servidor + respaldo local) ==================================== */
const IA = (() => {
  let peticiones = 0, ultimaFallo = 0, servidorOk = null, enCurso = false;
  const LOCALES = {
    positivo: ['¡qué bien!', 'me alegro un montón', '¡eso es genial!', '¡bien hecho!', 'me encanta oírlo'],
    negativo: ['vaya...', 'lo siento mucho', 'uy, qué pena', '¿quieres un abrazo?', 'yo estoy aquí contigo'],
    pregunta: ['mmm, buena pregunta', 'déjame pensar... no sé', '¡uf! ni idea, pero suena interesante'],
    insulto:  ['¡eh! eso no se dice', 'me has herido los sentimientos', 'no me hables así...'],
    carino:   ['¡ayyy! yo también te quiero', '¡me haces muy feliz!', '¡qué cosquillas en el corazón!'],
    neutro:   ['¡mmm!', 'cuéntame más', '¿y luego?', 'te escucho', '¡interesante!', 'ajá...']
  };
  const MALAS = /tonto|idiota|imb[eé]cil|est[uú]pido|feo|in[uú]til|odio|asco|callate|c[aá]llate|pendejo|gilipollas/i;
  const BUENAS = /te quiero|gracias|mono|adorable|bonito|guapo|buena|bien hecho|genial|perfecto|jaja|jeje/i;
  const TRISTES = /mal|triste|fatal|problema|duele|enfermo|no puedo|perdí|perdi|solo|sola/i;
  function clasificarTexto(t) {
    const x = String(t || '').toLowerCase();
    if (MALAS.test(x)) return 'insulto';
    if (BUENAS.test(x)) return 'carino';
    if (TRISTES.test(x)) return 'negativo';
    if (/[?¿]/.test(x)) return 'pregunta';
    if (/bien|genial|contento|feliz|logré|logre|aprobé|aprobe|gané|gane/.test(x)) return 'positivo';
    return 'neutro';
  }
  function local(texto) {
    const tipo = clasificarTexto(texto);
    const emoc = { positivo: 'feliz', negativo: 'triste', pregunta: 'curioso', insulto: 'enfadado', carino: 'amor', neutro: 'normal' }[tipo];
    const act = tipo === 'carino' ? 'brincar' : (tipo === 'insulto' ? 'parar' : 'ninguna');
    return { ok: true, local: true, text: pick(LOCALES[tipo]), emotion: emoc, action: act, duration: 5, intensity: .6, tone: tipo === 'insulto' ? 'enfadado' : (tipo === 'carino' ? 'cariñoso' : 'neutral') };
  }
  function contexto() {
    const s = Estado, H = contextoHora();
    return {
      who: s.nombreVisitante || 'alguien', people: Personas.nombres(), emotion: Emocion.actual,
      energy: +s.energia.toFixed(2), activity: Actividades.nombre || 'nada', hour: String(H.h),
      memory: Memoria.resumen(), likes: Actividades.gustos.encantan, hates: Actividades.gustos.asco,
      history: Memoria.conversacion.slice(-6).map((c) => (c.quien === 'yo' ? 'Chispi: ' : 'Tú: ') + c.texto)
    };
  }
  async function pedir(texto) {
    if (enCurso) return local(texto);
    enCurso = true;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 7000);
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: texto, context: contexto() }), signal: ctrl.signal
      });
      const j = await r.json();
      servidorOk = !!(j && j.ok);
      if (j && j.ok) { peticiones++; return j; }
      /* en modo dev te contamos por qué la IA no ha contestado (clave, cuota, red...) */
      if (DEV) DevTest.escribe('IA dice: ' + (j && j.error ? j.error : 'sin respuesta') + ' → uso respuestas locales');
      if (j && j.error === 'clave_no_valida') servidorOk = false;
      return local(texto);
    } catch (e) {
      servidorOk = false; ultimaFallo = now();
      return local(texto);
    } finally { clearTimeout(to); enCurso = false; }
  }
  return { pedir, local, clasificarTexto, contexto, get servidorOk() { return servidorOk; }, get peticiones() { return peticiones; } };
})();

    { id: 'feliz',   pat: ['ponte contento', 'ponte feliz', 'alegrate', 'ponte alegre', 'sonrie'], decir: ['¡¡yupi!!', '¡qué contento estoy!'] },
    { id: 'enfadado', pat: ['ponte enfadado', 'enfadate', 'ponte furioso'], decir: ['¡grrrr!', '¡me has enfadado!'] },

    { id: 'querer',  pat: ['te quiero', 'te aprecio', 'eres mi robot favorito', 'te adoro'], decir: ['¡ayyy! yo también', '¡me haces feliz!'] },
    { id: 'gracias', pat: ['gracias', 'muchas gracias', 'gracias chispi'], decir: ['¡de nada!', '¡para eso estoy!'] },
    { id: 'quien',   pat: ['quien soy', 'como me llamo', 'me conoces', 'quienes son mi familia'], decir: null },
    { id: 'olvidar', pat: ['olvida a', 'olvidate de', 'borra a', 'quien es'], decir: null },
    { id: 'hora',    pat: ['que hora es', 'dime la hora', 'la hora'], decir: null },
    { id: 'clima',   pat: ['que tiempo hace', 'esta lloviendo', 'el tiempo', 'va a llover'], decir: null },
    { id: 'ayuda',   pat: ['que puedes hacer', 'que sabes hacer', 'ayuda', 'comandos'], decir: ['puedo comer, jugar, hacer fotos, bailar... ¡pídeme lo que quieras!'] },
    { id: 'interruptor', pat: ['apagate', 'duerme para siempre', 'haz como si no estuviera'], decir: ['me quedo quietecito'] },
    { id: 'ruido',   pat: ['shhh', 'silencio', 'calla', 'no hables'], decir: null }

  function detectar(texto) {

    for (const r of REGLAS) if (hay(x, r.pat)) return { regla: r, texto: x };

  /* Ejecuta el comando local. Devuelve true si lo ha gestionado. */

      case 'jugar': Actividades.empezar('jugar', {}); decir('¡a jugar!'); return true;
      case 'leer': Actividades.empezar('leer', {}); decir('me pongo a leer'); return true;
      case 'ejercicio': Actividades.empezar('ejercicio', {}); decir('¡uno, dos!'); return true;
      case 'bailar': Actividades.empezar('bailar', {}); decir('¡a bailar!'); return true;

/* ==================================== 25. DIÁLOGO (palabra de activación, conversación y tono) ==================================== */
const Dialogo = (() => {
  let activo = false, desde = 0, ultimaFrase = 0, esperandoRespuesta = false, ultimoInterim = 0;
  const VENTANA = 9000, GRACIA = 2500;
  function despertar(frase) {
    if (Estado.durmiendo) { Emocion.dormir(false, 'voz'); }
    activo = true; desde = now(); ultimaFrase = now();
    Audio2.saludo(); Haptica.doble();
    Anim.gestoAhora('curiosidad', { texto: null });
    const nombre = Personas.actual ? Personas.actual.nombre : null;
    const dicho = pick(['¿sí?', '¿dime?', '¿qué pasa?', 'cuéntame', 'aquí estoy', '¿me hablas?']);
    Burbujas.decir(dicho, { dur: 1.8 });
    Voz.hablar(nombre && chance(.5) ? '¿sí, ' + nombre + '?' : dicho, 'cariñoso');
    Reflejos.mirar(0, -.05, 1800);
    Estado.modo = 'conversando';
    return true;
  }
  function esPalabraActivacion(texto) {
    return wakeRe.some((r) => r.test(texto));
  }
  /* Cada fragmento reconocido pasa por aquí (interino y final) */
  function oir(texto, esFinal) {
    if (!texto) return;
    const x = texto.toLowerCase().trim();
    Estado.vozReciente = Date.now();
    if (!esFinal) return;
    /* si está esperando una respuesta concreta, la voz vale como respuesta */
    if (Foto.preguntando) {
      const si = ['sí', 'si', 'vale', 'claro', 'guarda', 'guárdala', 'guardala', 'ok', 'yes', 'sisi', 'sii', 'siiii'];
      const no = ['no', 'nope', 'paso', 'tírala', 'tirala', 'quítala', 'quit', 'bah'];
      const ini = (lista) => lista.some((k) => x === k || x.startsWith(k + ' ') || x.startsWith(k + ','));
      if (ini(si)) { Foto.resolverGuardar('sí'); return; }
      if (ini(no)) { Foto.resolverGuardar('no'); return; }
      if (x.indexOf('descarg') >= 0) { Foto.resolverGuardar('descargar'); return; }
    }
    if (Personas.pidiendoNombre) {
      const m = x.match(/(?:me llamo|soy|mi nombre es|ll[aá]mame)\s+(.+)/);
      const nombre = Personas.limpiarNombre(m ? m[1] : x);
      if (nombre) { Personas.registrar(nombre, null); return; }
    }
    if (!activo) {
      if (esPalabraActivacion(x)) {
        despertar(x);
        /* si en la misma frase ya le pides algo, se atiende sin tener que repetir */
        let resto = x;
        for (const r of wakeRe) resto = resto.replace(r, ' ').trim();
        resto = resto.replace(/^[\s,.:;¡!¿?]+|[\s,.:;¡!¿?]+$/g, '');
        if (resto.length > 2) {
          if (!ejecutarComando(resto)) hablarCon(resto);
        }
        return;
      }
      if (esFinal && Comandos.detectar(x)) {
        /* comandos sin decir "hey": los entiende igual si son claros */
        ejecutarComando(x);
      }
      return;
    }
    ultimaFrase = now();
    let limpio = x;
    /* quitamos la palabra de activación si va delante */
    for (const r of wakeRe) limpio = limpio.replace(r, '').trim();
    if (!limpio) return;
    hablarCon(limpio);
  }
  function ejecutarComando(x) {
    const ok = Comandos.ejecutar(x, {});
    if (ok) { activo = true; desde = now(); ultimaFrase = now(); Memoria.turno('yo', x); return true; }
    return false;
  }
  async function hablarCon(texto) {
    Memoria.turno('tu', texto);
    Memoria.apuntar('me habló', { texto });
    Personas.tocar(0);
    /* tono con el que me habla: influye en la reacción */
    const tipo = IA.clasificarTexto(texto);
    const tono = { insulto: 'enfadado', carino: 'cariñoso', negativo: 'triste', positivo: 'emocionado', pregunta: 'neutral', neutro: 'neutral' }[tipo];
    if (tipo === 'insulto') { Estado.enfado = clamp(Estado.enfado + .5, 0, 1); Estado.memoriaTrato = -1; Emocion.inyectar('enfadado', 2500); }
    if (tipo === 'carino') { Estado.carino = clamp(Estado.carino + .4, 0, 1); Estado.memoriaTrato = 1; }
    /* comando local primero: respuesta inmediata y gratis */
    if (ejecutarComando(texto)) { if (chance(.5)) Reflejos.mirar(0, 0, 1500); return; }
    /* si no, IA */
    esperandoRespuesta = true;
    const t0 = now();
    const res = await IA.pedir(texto);
    esperandoRespuesta = false;
    if (!res) return;
    /* no deja lo que hace: atiende con los ojos y el gesto, pero sigue */
    const ocupado = !!Estado.actividad && !Estado.actividadPausada;
    aplicarRespuesta(res, { ocupado });
    /* reacción espejo al tono del usuario además de la emoción de la IA */
    if (tipo === 'negativo' && chance(.6)) { Estado.felicidad = clamp(Estado.felicidad - .06, 0, 1); }
    ultimaFrase = now();
  }
  function aplicarRespuesta(res, opts) {
    opts = opts || {};
    const s = Estado;
    Voz.hablar(res.text, res.tone || 'neutral');
    Burbujas.decir(res.text, { dur: Math.max(2.2, Math.min(5, res.text.length * .06 + 1.6)) });
    if (res.emotion) {
      Emocion.inyectar(res.emotion, Math.max(1500, (res.duration || 5) * 400));
      if (res.emotion === 'enfadado') s.enfado = clamp(s.enfado + .3, 0, 1);
      if (res.emotion === 'triste') s.felicidad = clamp(s.felicidad - .1, 0, 1);
      if (res.emotion === 'feliz' || res.emotion === 'amor') s.felicidad = clamp(s.felicidad + .12, 0, 1);
      if (res.emotion === 'miedo') s.miedo = clamp(s.miedo + .3, 0, 1);
    }
    /* acciones: si está ocupado y la acción no es fuerte, atiende sin dejar lo suyo */
    const accion = res.action;
    const fuertes = ['comer', 'beber', 'ver', 'jugar', 'leer', 'ejercicio', 'bailar', 'dormir', 'foto', 'cancion', 'brincar', 'cosquillas'];
    if (accion && accion !== 'ninguna') {
      if (accion === 'saludar') Saludo.saludar('orden');
      else if (accion === 'foto') { if (!opts.ocupado) Foto.tomar(); else { Burbujas.decir('ahora mismo no, que estoy liado', { dur: 2.4 }); } }
      else if (accion === 'dormir') Emocion.dormir(true, 'orden');
      else if (accion === 'despertar') Emocion.dormir(false, 'orden');
      else if (accion === 'parar') { Actividades.terminar('tu-orden'); }
      else if (accion === 'pensar') Anim.gestoAhora('pensar', { texto: null });
      else if (accion === 'cosquillas') Anim.gestoAhora('cosquillas', { texto: null });
      else if (fuertes.includes(accion) && !opts.ocupado) Actividades.empezar(accion, {});
      else if (fuertes.includes(accion) && opts.ocupado) { Anim.pulso({ entorna: .2 }, .6, 'out'); }
    } else if (opts.ocupado) {
      /* un gestito de atención mientras sigue con lo suyo */
      Anim.pulso({ cejaY: .25, entorna: .12 }, .7, 'out');
    }
  }
  /* Ventanas de escucha: 5 s sin hablar deja de escuchar; 2 s de gracia al activarse */
  function tick(t) {
    const s = Estado;
    if (s.durmiendo && activo) { activo = false; }
    if (!activo) { if (Estado.modo === 'conversando') Estado.modo = 'despierto'; return; }
    const sinHablar = now() - ultimaFrase;
    if (esperandoRespuesta) return;
    if (sinHablar > VENTANA) { activo = false; Estado.modo = s.durmiendo ? 'durmiendo' : 'despierto'; return; }
    if (sinHablar > GRACIA && sinHablar < VENTANA && now() - desde > GRACIA * 2.2 && chance(.0009 * (t / 1000) * 6)) {
      /* sigue atento, sin decir nada, con un gestito */
      Anim.pulso({ cejaY: .3 }, .5, 'out');
      if (chance(.2)) Burbujas.decir(pick(['...', 'te escucho', '¿y?']), { dur: 1.6 });
    }
  }
  return {
    oir, tick, hablarCon, aplicarRespuesta, esPalabraActivacion, despertar,
    get activo() { return activo; }, get escuchando() { return activo; },
    decir(texto, opts) { Voz.hablar(texto, (opts && opts.tono) || 'cariñoso'); Burbujas.decir(texto, {}); },
    mirarAlUsuario(ms) { Reflejos.mirar(0, -.05, ms || 2000); }
  };
})();

/* ==================================== 27. ENTRADA (tacto, sensores, caricias) ==================================== */
const Entrada = (() => {
  const cv = Dibujo.cv;
  let abajo = false, inicio = { x: 0, y: 0, t: 0 }, ultimo = { x: 0, y: 0, t: 0 };
  let movido = 0, velocidad = 0, cariciasActivas = false, ultimaCariciaTick = 0;
  let toquesOjo = [], ultimoToque = 0, esperandoDoble = null, pulsacion = null;
  let sacudidas = 0, ultimaSacudida = 0, inclinacion = { beta: 0, gamma: 0 }, ultimoOrient = 0;
  let enPantalla = true;

  function enAreaOjo(x, y) {
    const c = Dibujo.centro(), u = Dibujo.u;
    const dx = Math.abs(x - c.x), dy = Math.abs(y - c.y);
    return dx < u * 1.4 && dy < u * 1.1;
  }
  function enAreaBoca(x, y) {
    const c = Dibujo.centro(), u = Dibujo.u;
    return Math.abs(x - c.x) < u * .7 && Math.abs(y - (c.y + u * .95)) < u * .6;
  }
  /* --- caricias --- */
  function empezarCaricia() {
    if (cariciasActivas) return;
    cariciasActivas = true;
    Estado.caricia.activo = true;
    Estado.caricia.fuerza = 0;
    Audio2.ronroneo(true);
    if (Estado.durmiendo) Emocion.dormir(false, 'caricia');
    Anim.gestoAhora('caricias', { sinSonido: true });
  }
  function finCaricia(pago) {
    if (!cariciasActivas) return;
    cariciasActivas = false;
    Estado.caricia.activo = false;
    Audio2.ronroneo(false);
    if (pago) {
      const s = Estado;
      s.felicidad = clamp(s.felicidad + .12, 0, 1);
      s.carino = clamp(s.carino + .18, 0, 1);
      s.memoriaTrato = clamp(s.memoriaTrato + .6, -1, 1);
      s.ultimaCaricia = now();
      Memoria.apuntar('caricias', {});
      Personas.tocar(.4);
      Burbujas.decir(pick(['mmmm...', '¡más!', 'me gusta eso', '¡qué a gusto!']), { dur: 1.8 });
      Audio2.risita();
    }
  }
  /* --- toques en los ojos: se queja, cierra un ojo y, si insistes, se enfada y dispara --- */
  function golpecitoOjo(x, y) {
    const s = Estado;
    if (s.durmiendo) { Emocion.dormir(false, 'toque'); return; }
    toquesOjo = toquesOjo.filter((t) => now() - t < 2400);
    toquesOjo.push(now());
    Anim.pulso({ parpI: 1, parpD: 1 }, .18, 'out');
    Reflejos.mirar((x - Dibujo.centro().x) / (Dibujo.W * .4), (y - Dibujo.centro().y) / (Dibujo.H * .4), 1200);
    if (toquesOjo.length === 1) {
      Audio2.gorgojo(); Haptica.suave();
      Anim.gestoAhora('sorpresa', { texto: null });
      if (chance(.4)) Burbujas.decir(pick(['¡eh!', '¡ay, mi ojo!', '¿qué haces?']), { dur: 1.6 });
    } else if (toquesOjo.length === 2) {
      Anim.gestoAhora('picaro', { sinSonido: true });
      Audio2.hipo(); Haptica.doble();
      Burbujas.decir(pick(['¡otra vez!', 'ya vale...', '¡me haces cosquillas!']), { dur: 1.6 });
    } else {
      enfadarYDisparar({ x, y });
    }
  }
  let ultimaRafagaDisparos = 0;
  function enfadarYDisparar(punto) {
    const s = Estado;
    if (now() - ultimaRafagaDisparos < 3000) return;
    ultimaRafagaDisparos = now();
    s.enfado = clamp(s.enfado + .85, 0, 1);
    s.miedo = 0;
    Emocion.inyectar('enfadado', 2600);
    s.memoriaTrato = clamp(s.memoriaTrato - 1.2, -1, 1);
    Personas.tocar(-.6);
    Anim.limpiarGestos();
    Anim.gestoAhora('disparar', {});
    Burbujas.decir(pick(['¡¡basta ya!!', '¡te aviso!', '¡grrrrr!', '¡PUM PUM!']), { dur: 2 });
    Audio2.enfado(); Haptica.fuerte();
    if (Estado.durmiendo) Emocion.dormir(false, 'enfado');
    Dibujo.puntero(punto ? punto.x : Dibujo.W / 2, punto ? punto.y : Dibujo.H / 2, true);
    let n = 0;
    const id = setInterval(() => {
      const objetivo = { x: Dibujo.W / 2 + rnd(-90, 90), y: Dibujo.H * .72 + rnd(-40, 40) };
      if (punto) { objetivo.x = punto.x + rnd(-30, 30); objetivo.y = punto.y + rnd(-30, 30); }
      Dibujo.puntero(objetivo.x, objetivo.y, true);
      const c = Dibujo.centro();
      FX.G.bala(c.x + (n % 2 ? 60 : -60), c.y + 20, objetivo.x, objetivo.y, PALETA.enfadado.acc);
      Audio2.disparo(); Haptica.disparo();
      Anim.pulso({ sacudida: 1, cejaY: .3 }, .25, 'out');
      n++;
      if (n > 7) { clearInterval(id); Dibujo.puntero(0, 0, false); }
    }, 260);
    /* luego se calma poco a poco (el enfado decae solo) */
    setTimeout(() => { if (chance(.7)) Burbujas.decir(pick(['...bueno, ya', 'uf, perdón', 'me has asustado']), { dur: 2.2 }); }, 5200);
  }
  /* --- eventos --- */
  function pos(e) { return { x: e.clientX, y: e.clientY, t: now() }; }
  function down(e) {
    const p = pos(e);
    abajo = true; inicio = p; ultimo = p; movido = 0; velocidad = 0;
    enPantalla = true;
    Audio2.ensure();                                    // el primer gesto habilita el sonido
    Wake.despertarPantalla();
    if (enAreaBoca(p.x, p.y)) {
      // tocar la boca: cosquillas y sorpresa
      Anim.gestoAhora('cosquillas', { texto: null });
      Audio2.risita(); Haptica.doble();
      Burbujas.decir(pick(['¡jijiji!', '¡mi boca!', '¡qué cosquillas!']), { dur: 1.8 });
      Estado.novedad = now(); Estado.felicidad = clamp(Estado.felicidad + .06, 0, 1);
      pulsacion = null; return;
    }
    /* pulsación larga programada */
    pulsacion = setTimeout(() => {
      pulsacion = null;
      if (!abajo || movido > 18) return;
      // mimos largos: ojos cerrados, ronroneo y amor
      Anim.gestoAhora('amor', { sinSonido: true });
      Audio2.ronroneo(true);
      Estado.caricia.activo = true; Estado.caricia.fuerza = .8;
      Haptica.caricias();
      Burbujas.decir(pick(['mmmm...', 'qué a gustito', 'no pares']), { dur: 2.4 });
      Estado.carino = clamp(Estado.carino + .3, 0, 1);
      setTimeout(() => { if (abajo) return; Audio2.ronroneo(false); Estado.caricia.activo = false; }, 2600);
    }, 750);
  }
  function move(e) {
    if (!abajo) return;
    const p = pos(e);
    const d = Math.hypot(p.x - ultimo.x, p.y - ultimo.y);
    movido += d;
    velocidad = d / Math.max(8, p.t - ultimo.t);
    /* sigue el dedo con la mirada */
    Reflejos.mirar((p.x - Dibujo.centro().x) / (Dibujo.W * .38), (p.y - Dibujo.centro().y) / (Dibujo.H * .38), 900);
    ultimo = p;
    if (movido > 34 && !cariciasActivas) {
      if (pulsacion) { clearTimeout(pulsacion); pulsacion = null; }
      empezarCaricia();
    }
    if (cariciasActivas) {
      Estado.caricia.fuerza = clamp(Estado.caricia.fuerza + d * .0022, 0, 1);
      Estado.caricia.lado = p.x > Dibujo.centro().x ? 1 : -1;
      if (now() - ultimaCariciaTick > 420) {
        ultimaCariciaTick = now();
        Haptica.caricias();
        FX.G.corazones(p.x, p.y - 20, 1, PALETA.amor.acc);
        Estado.felicidad = clamp(Estado.felicidad + .012, 0, 1);
      }
      if (velocidad > 3.2 && now() - ultimaCariciaTick > 250) { Audio2.gorgojo(); }
    }
    /* arrastre rápido y repetido = mareo */
    if (velocidad > 4.6) {
      Estado.mareo = now(); Estado.novedad = now();
      Dibujo.Movimiento.empujar((p.x - ultimo.x) * 6, (p.y - ultimo.y) * 6);
      if (chance(.25)) { Anim.gestoAhora('mareado', { sinSonido: true }); Audio2.hipo(); }
    }
  }
  function up(e) {
    if (!abajo) return;
    abajo = false;
    const p = pos(e);
    const dur = p.t - inicio.t;
    const dist = Math.hypot(p.x - inicio.x, p.y - inicio.y);
    if (pulsacion) { clearTimeout(pulsacion); pulsacion = null; }
    finCaricia(true);
    if (dist < 22 && dur < 400) {
      /* toque limpio */
      const t = now();
      if (esperandoDoble) {
        clearTimeout(esperandoDoble);
        esperandoDoble = null;
        if (enAreaOjo(p.x, p.y)) { golpecitoOjo(p.x, p.y); golpecitoOjo(p.x, p.y); return; }   // insistes en el ojo: se queja
        /* doble toque: cosquillas */
        Anim.gestoAhora('cosquillas', { texto: null });
        Audio2.risita(); Haptica.alegria();
        Burbujas.decir(pick(['¡jijiji!', '¡ay, cosquillas!', '¡para, para!']), { dur: 2 });
        Estado.felicidad = clamp(Estado.felicidad + .1, 0, 1);
        return;
      }
      if (enAreaOjo(p.x, p.y)) { golpecitoOjo(p.x, p.y); return; }
      esperandoDoble = setTimeout(() => {
        esperandoDoble = null;
        /* toque normal en cualquier parte: le llama la atención */
        if (Estado.durmiendo) { Emocion.dormir(false, 'toque'); }
        else {
          Anim.gestoAhora('curiosidad', { texto: null });
          Audio2.gorgojo(); Haptica.suave();
          Reflejos.mirar((p.x - Dibujo.centro().x) / (Dibujo.W * .4), (p.y - Dibujo.centro().y) / (Dibujo.H * .4), 1600);
          Estado.novedad = now();
          if (chance(.35)) Burbujas.decir(pick(['¿sí?', '¡hola!', 'me has tocado', '¿jugamos?']), { dur: 1.8 });
          if (Estado.modo === 'emergencia') Bateria.revisar();
        }
      }, 300);
    } else if (dist > 90 && dur < 300) {
      /* gesto rápido: le empuja */
      Estado.mareo = now();
      Anim.gestoAhora('mareado', { sinSonido: true });
      Audio2.chillido(); Haptica.fuerte();
      Burbujas.decir(pick(['¡uuuuy!', '¡me has tirado!', '¡eh, con cuidado!']), { dur: 2 });
      Dibujo.Movimiento.empujar((p.x - inicio.x) * 4, (p.y - inicio.y) * 4);
    }
  }
  /* --- sensores --- */
  function sacudida(e) {
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (!a) return;
    const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    if (m > 24 && now() - ultimaSacudida > 2600) {
      ultimaSacudida = now();
      sacudidas++;
      Estado.mareo = now(); Estado.novedad = now();
      Anim.gestoAhora('mareado', {});
      Burbujas.decir(pick(['¡aaay, qué mareo!', '¡para de moverme!', '¡uyuyuy!']), { dur: 2.2 });
      Audio2.hipo(); Haptica.temblor();
      Dibujo.Movimiento.empujar(rnd(-90, 90), rnd(-60, 60));
      if (sacudidas > 3) { Estado.miedo = clamp(Estado.miedo + .2, 0, 1); sacudidas = 0; }
    }
  }
  function orientar(e) {
    const beta = e.beta || 0, gamma = e.gamma || 0;
    inclinacion.beta = beta; inclinacion.gamma = gamma;
    Estado.flatPhone = Math.abs(beta) < 26 && Math.abs(gamma) < 26;
    /* se desliza hacia el lado inclinado + ojos que siguen la gravedad */
    if (!Estado.durmiendo) {
      const k = clamp(gamma / 55, -1, 1);
      if (Math.abs(k) > .3) {
        Dibujo.Movimiento.empujar(-k * 26, beta > 60 ? 20 : 0);
        Reflejos.mirar(-k * .8, clamp(beta / 90, -.5, .5), 900);

        }
      }
    }
  }
  function init() {
    cv.addEventListener('pointerdown', down, { passive: true });
    window.addEventListener('pointermove', move, { passive: true });
    window.addEventListener('pointerup', up, { passive: true });
    window.addEventListener('pointercancel', up, { passive: true });
    window.addEventListener('devicemotion', sacudida, { passive: true });
    window.addEventListener('deviceorientation', orientar, { passive: true });
  }
  async function pedirSensores() {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission();
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission();
      return true;
    } catch (e) { return false; }
  }
  return { init, pedirSensores, enAreaOjo, enAreaBoca, enfadarYDisparar, get caricias() { return cariciasActivas; } };
})();

/* ==================================== 28. WAKE LOCK Y ATENUACIÓN ==================================== */
const Wake = (() => {
  let lock = null, activo = false;
  async function pedir() {
    if (!('wakeLock' in navigator)) return false;
    try { lock = await navigator.wakeLock.request('screen'); activo = true; lock.addEventListener('release', () => { activo = false; }); return true; } catch (e) { return false; }
  }
  async function liberar() { try { if (lock) await lock.release(); } catch (e) {} lock = null; activo = false; }
  function despertarPantalla() { if (!activo) pedir(); }
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') { pedir(); App.volver(); }
    else { liberar(); App.ocultar(); }
  });
  return { pedir, liberar, despertarPantalla, get activo() { return activo; } };
})();

/* ==================================== 29. SUEÑOS (mini escenas planas dentro de una burbuja) ==================================== */
const Suenos = (() => {
  const TIPOS = ['pizza', 'cohete', 'gato', 'playa', 'estrella', 'tele', 'lluvia', 'tarta', 'baile', 'volar', 'pesca', 'helado', 'burbuja', 'amigos'];
  let activo = null, proximo = 0;
  function empezar() { proximo = now() + rnd(8000, 16000); }
  function tick(t) {
    if (!Estado.durmiendo) { activo = null; return; }
    if (!proximo) empezar();
    if (t > proximo) {
      activo = { tipo: pick(TIPOS), t: 0, dur: rnd(6, 11) };
      proximo = t + activo.dur * 1000 + rnd(6000, 14000);
      Audio2.snore();
    }
    if (activo) { activo.t += 1; if (activo.t > activo.dur * 1000) activo = null; }
  }
  function dibujar(t) {
    if (!activo) return;
    const ctx = Dibujo.ctx, W = Dibujo.W, H = Dibujo.H, u = Dibujo.ojoU;
    const w = Math.min(W * .66, u * 6.4), h = w * .62;
    const x = W / 2 - w / 2, y = H * .16;
    const c = PALETA.dormido.acc, c2 = PALETA.normal.acc;
    ctx.save();
    ctx.globalAlpha = clamp(Math.min(activo.t / 400, (activo.dur * 1000 - activo.t) / 600), 0, 1);
    ctx.fillStyle = '#000'; ctx.strokeStyle = c; ctx.lineWidth = 2;
    const rr2 = (X, Y, Ww, Hh, R) => { ctx.beginPath(); ctx.moveTo(X + R, Y); ctx.arcTo(X + Ww, Y, X + Ww, Y + Hh, R); ctx.arcTo(X + Ww, Y + Hh, X, Y + Hh, R); ctx.arcTo(X, Y + Hh, X, Y, R); ctx.arcTo(X, Y, X + Ww, Y, R); ctx.closePath(); };
    rr2(x, y, w, h, 18); ctx.fill(); ctx.stroke();
    ctx.clip();
    const per = t * 1.2;
    const gx = x + w / 2, gy = y + h / 2, s = u * .5;
    ctx.fillStyle = c2;
    switch (activo.tipo) {
      case 'pizza': Dibujo.silueta('triangulo', gx, gy, s * 1.1, c2); Dibujo.silueta('circulo', gx, gy + s * .2, s * .2, c); break;
      case 'cohete': Dibujo.silueta('triangulo', gx + Math.sin(per) * 20, gy - 8, s, c2); Dibujo.silueta('chispa', gx + Math.sin(per) * 20, gy + s * .8, s * .4, c); break;
      case 'gato': Dibujo.silueta('circulo', gx, gy, s, c2); Dibujo.silueta('triangulo', gx - s * .3, gy - s * .3, s * .4, c2); Dibujo.silueta('triangulo', gx + s * .3, gy - s * .3, s * .4, c2); break;
      case 'playa': for (let i = 0; i < 3; i++) Dibujo.silueta('arco', x + w * (i + 1) / 4, gy + s * .5, s * (1 - i * .2), c); Dibujo.silueta('circulo', gx, gy - s * .5, s * .6, c2); break;
      case 'estrella': for (let i = 0; i < 4; i++) Dibujo.silueta('estrella', x + w * (.2 + i * .2), gy + Math.sin(per + i) * 10, s * .5, i % 2 ? c : c2); break;
      case 'tele': Dibujo.silueta('rect', gx, gy, s * 2, c2); Dibujo.silueta('rect', gx, gy, s * 1.5, '#000'); break;
      case 'lluvia': for (let i = 0; i < 8; i++) Dibujo.silueta('gota', x + (i + 1) * w / 9, y + ((t * .06 + i * 40) % h), s * .3, c); Dibujo.silueta('arco', gx, gy + s, s * 2, c2); break;
      case 'tarta': Dibujo.comida('tarta', gx, gy, s * 1.2, t / 600); Dibujo.silueta('estrella', gx, gy - s * 1.1, s * .4, c2); break;
      case 'baile': Dibujo.silueta('nota', gx - s * .5, gy + Math.sin(per * 2) * 8, s * .7, c2); Dibujo.silueta('nota', gx + s * .6, gy + Math.cos(per * 2) * 8, s * .6, c); break;
      case 'volar': Dibujo.silueta('luna', gx + Math.sin(per * .6) * 40, gy - 10, s, c2); Dibujo.silueta('estrella', gx - 40, gy + 14, s * .4, c); break;
      case 'pesca': Dibujo.silueta('luna', gx, gy - s * .5, s * .8, c2); Dibujo.silueta('gota', gx, gy + s * .4, s * .5, c); break;
      case 'helado': Dibujo.comida('helado', gx, gy, s * 1.2, per); break;
      case 'burbuja': for (let i = 0; i < 5; i++) Dibujo.silueta('onda', gx + Math.sin(per + i * 2) * 30, gy + Math.cos(per + i) * 12, s * (.3 + i * .14), i % 2 ? c : c2); break;
      default: /* amigos */ for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(gx + (i - 1) * s * 1.1, gy, s * .28, 0, TAU); ctx.fill(); } break;
    }
    ctx.restore();
    /* zZz flotando */
    if (chance(.02)) FX.G.zzz(x + w - 20, y + 10, PALETA.dormido.acc);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  return { tick, dibujar, get activo() { return activo; }, empezar };
})();

/* ==================================== 30. DORMIR Y DESPERTAR ==================================== */
Emocion.dormir = function (on, motivo) {
  const s = Estado;
  if (on) {
    if (s.durmiendo) return;
    s.durmiendo = true; s.modo = 'durmiendo';
    s.actividad = null; s.actividadItem = null; s.telequinesis = 0;
    Anim.limpiarGestos();
    Anim.gestoAhora('dormir', { texto: null });
    Anim.setMovimiento('respirar', { intensidad: .25, vel: .6, lado: 1 });
    Dibujo.brillo = .32;                       // pantalla muy atenuada
    Audio2.setNocturno(true);
    Audio2.ronroneo(false);
    Camara.intervalo = CFG.capture.dormido;    // captura cada varios segundos
    Voz.escuchar(false);                       // nada de escucha continua al dormir
    Manos.rafaga(false); Manos.limpiar();
    Suenos.empezar();
    Hoja.cerrar();
    if (Foto.preguntando) Foto.resolverGuardar(null);
    FX.G.zzz(Dibujo.centro().x + 40, Dibujo.centro().y - 40, PALETA.dormido.acc);
    Burbujas.decir(pick(['zzz...', 'a dormir...', 'buenas noches...']), { dur: 3 });
    Audio2.dormir();
    Memoria.apuntar('me dormí', { motivo: motivo || '' });
    return;
  }
  if (!s.durmiendo) return;
  s.durmiendo = false;
  s.sueno = Math.min(s.sueno, motivo === 'toque' ? .25 : .35);
  Dibujo.brillo = 1;
  Audio2.setNocturno(false);
  Camara.intervalo = CFG.capture.normal;
  Anim.gestoAhora('despertar', { texto: null });
  Audio2.despertar();
  if (motivo === 'toque') {
    /* despertar de mal humor: se enfada y dispara */
    s.enfado = clamp(s.enfado + .8, 0, 1);
    Emocion.inyectar('enfadado', 3000);
    Burbujas.decir(pick(['¡¿quién me despierta?!', '¡me estabas despertando!', '¡grrr! ¡deja dormir!']), { dur: 2.6 });
    setTimeout(() => Entrada.enfadarYDisparar(null), 420);
    Memoria.apuntar('me despertó de malas', {});
  } else {
    s.felicidad = clamp(s.felicidad + .1, 0, 1);
    s.modo = 'despierto';
    /* por soplido o por voz ya se dice la frase concreta justo después: no encolamos dos */
    if (motivo !== 'soplido' && motivo !== 'voz') {
      Burbujas.decir(pick(['¡uuuaaa!', 'buenos días', '¿ya es de día?', '¡hola otra vez!']), { dur: 2.6 });
    }
    Anim.pulso({ escala: .1 }, .8, 'out');
    Reflejos.mirar(0, 0, 2000);
  }
  Personas.resetPresencia();
  Suenos.tick(now());
};

/* ==================================== 31. PRUEBAS INTERNAS (solo con ?dev=1) ==================================== */
const DevTest = (() => {
  const bar = document.getElementById('devbar'), log = document.getElementById('devlog');
  let lineas = [];
  function escribe(txt) {
    lineas.unshift(typeof txt === 'string' ? txt : JSON.stringify(txt));
    lineas = lineas.slice(0, 7);
    log.textContent = lineas.join('\n');
  }
  /* --- simulador de 21 puntos de la mano (poses inequívocas) --- */
  const BASE = [
    [0, 1], [.1, .9], [.05, .8], [0, .72], [0, .65],
    [.25, .72], [.25, .55], [.25, .4], [.25, .28],
    [.5, .7], [.5, .5], [.5, .33], [.5, .2],
    [.72, .72], [.75, .55], [.75, .4], [.75, .3],
    [.9, .78], [.95, .65], [.95, .55], [.95, .45]
  ];
  const POSE = {
    abierta: {},
    /* puño: puntas hacia la muñeca y sin separación */
    puno: { 4: [.2, .84], 3: [.16, .78], 2: [.1, .86], 6: [.25, .55], 8: [.25, .6], 10: [.5, .52], 12: [.5, .58], 14: [.75, .55], 16: [.75, .6], 18: [.9, .62], 20: [.9, .66], 7: [.27, .66], 11: [.48, .68], 15: [.72, .66], 19: [.88, .72] },
    /* mano a medias: dos dedos extendidos y el resto doblados */
    media: { 12: [.5, .86], 16: [.72, .88], 20: [.9, .9], 11: [.5, .82], 15: [.74, .84], 19: [.92, .86] },
    paz: { 12: [.55, .25], 8: [.2, .25], 16: [.72, .88], 20: [.9, .9], 15: [.74, .84], 19: [.92, .86], 4: [.06, .74], 3: [.04, .86] },
    pulgar: { 4: [.3, .3], 8: [.3, .88], 12: [.44, .9], 16: [.58, .92], 20: [.7, .94], 7: [.27, .83], 11: [.45, .85], 15: [.6, .87], 19: [.74, .9] }
  };
  function manoSimulada(pose, cx, cy, esc) {
    const p = POSE[pose] || {};
    const out = [];
    for (let i = 0; i < 21; i++) {
      const b = p[i] || BASE[i];
      out.push({ x: cx + (b[0] - .5) * esc, y: cy + (b[1] - .5) * esc, z: 0 });
    }
    return out;
  }
  /* --- secuencias completas --- */
  const SECUENCIAS = {
    saludo:      { pose: 'abierta', paso: (k, n) => ({ cx: .5 + Math.sin(k * 1.15) * .2, cy: .55, esc: .8 }), dur: 16 },
    quieta:      { pose: 'abierta', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    alejandose:  { pose: 'abierta', paso: (k, n) => ({ cx: .5, cy: .55, esc: 1.0 - k / n * .35 }), dur: 10 },
    acercandose: { pose: 'abierta', paso: (k, n) => ({ cx: .5, cy: .55, esc: .6 + k / n * .45 }), dur: 10 },
    puno:        { pose: 'puno', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    medias:      { pose: 'media', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    paz:         { pose: 'paz', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 },
    pulgar:      { pose: 'pulgar', paso: () => ({ cx: .5, cy: .55, esc: .8 }), dur: 9 }
  };
  function pruebaSecuencia(nombre) {
    const sec = SECUENCIAS[nombre];
    if (!sec) { escribe('secuencia desconocida: ' + nombre); return; }
    escribe('▶ probando "' + nombre + '" (' + sec.dur + ' fotogramas)...');
    Manos.rafaga(true);
    Camara.rafaga(sec.dur * 130);
    let k = 0;
    const id = setInterval(() => {
      const tr = sec.paso(k, sec.dur);
      const mano = Manos.analizar(manoSimulada(sec.pose, tr.cx, tr.cy, tr.esc));
      Manos.inyectar([mano]);
      Manos.clasificar();
      escribe('  ' + nombre + ' #' + k + ' → gesto: ' + Manos.gesto + (Manos.duda ? ' (duda)' : '') + ' | telequinesis ' + Estado.telequinesis.toFixed(2));
      k++;
      if (k >= sec.dur) { clearInterval(id); Manos.rafaga(false); Camara.rafaga(1); escribe('✓ fin de "' + nombre + '"'); }
    }, 130);
  }
  function pruebaTodas() {
    const nombres = Object.keys(SECUENCIAS);
    nombres.forEach((n, i) => setTimeout(() => pruebaSecuencia(n), i * 2600));
    escribe('Probando las ' + nombres.length + ' secuencias (≈' + (nombres.length * 2.6).toFixed(0) + ' s)');
  }
  /* --- variantes procedurales --- */
  function reporteVariantes() {
    const cats = Object.keys(ESPEC.CAT);
    let total = 0; const partes = [];
    for (const c of cats) { const n = ESPEC.contar(c); total += n; partes.push(c + ':' + n); }
    escribe('Categorías ' + cats.length + ' | suma de variantes ' + total.toLocaleString('es-ES') + ' (todas ≥1024: ' + cats.every((c) => ESPEC.contar(c) >= 1024) + ')');
    escribe('Combinaciones libres: ' + ESPEC.totalLibre.toLocaleString('es-ES') + ' | rueda base: ' + ESPEC.TOTAL.toLocaleString('es-ES'));
    escribe(partes.join('  '));
    return { cats, total, libre: ESPEC.totalLibre };
  }
  function probarCodigo(code) {
    const spec = ESPEC.generarLibre({ code: Number(code) || 1 });
    escribe('código ' + code + ' → ' + JSON.stringify({ ojos: spec.ojos, cara: spec.cara, cejas: spec.cejas, boca: spec.boca, acc: spec.acc, mov: spec.mov, son: spec.son, dur: spec.dur }));
    Anim.gestoAhora('normal', { spec: spec });
    Audio2.tono3(880, 1200);
  }
  function cicloEmociones() {
    const emos = ['normal', 'feliz', 'triste', 'enfadado', 'curioso', 'sorpresa', 'miedo', 'nervioso', 'amor', 'aburrido', 'picaro', 'mareado', 'orgulloso', 'dormido'];
    emos.forEach((e, i) => setTimeout(() => { Emocion.inyectar(e, 1400); escribe('emoción → ' + e); }, i * 1500));
  }
  function stats() {
